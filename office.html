<meta charset="utf-8">
<!-- OFFICE.HTML — loads inside terminal.html's Office station (v1.10+), same pattern as
     timeline.html/quote-generator.html/shop_timeclock.html/qc_inspection.html.
     Card tokens borrowed from timeline.html so the live preview really is the card that
     lands on the board, not a mockup of one. The "Flag an issue" panel calls /api/claude
     for real — same contract terminal.html's proxy already serves. It runs in demo mode
     with a labeled fallback if there's no server behind it (e.g. opened standalone). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Office — Stealth R&amp;D</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --purple:#9233E6; --purple-lift:#A855F7; --purple-deep:#6B21C4;
    --purple-tint:rgba(146,51,230,.10); --purple-glow:rgba(146,51,230,.13);
    --white:#FFFFFF; --silver:#CCCCCC;
    --bg:#232327; --panel:#2C2C31; --raised:#35353B; --sunken:#060606;
    --line:#43434B; --line-hot:#54545E;
    --ink:#F4F4F6; --dim:#A6A6B2; --faint:#7C7C88;
    --pass:#4ADE80; --warn:#F0B429; --fail:#F87171;
    --pass-tint:rgba(74,222,128,.11);
    --gold:#C9A227; --gold-lift:#E3C158; --gold-dim:rgba(201,162,39,.32); --gold-glow:rgba(201,162,39,.15);
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --disp:'Barlow Condensed','Oswald',system-ui,sans-serif;
    /* card stock — same tokens timeline.html uses, so the preview is the real card */
    --frame:#1A1A1F; --frame-2:#0E0E12;
    --face:#33333C; --face-2:#26262D;
    --rule:rgba(255,255,255,.11);
    --off:#2B2B32; --off-2:#212126;
  }
  html,body{height:100%}
  /* transparent: runs inside terminal.html's iframe, over the dither canvas */
  html{background:transparent}
  body{margin:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:13px}
  /* same hairline bezel as terminal.html — one gesture, not a page-by-page reinvention */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
    box-shadow:inset 0 0 0 1px var(--gold-dim);}

  .wrap{max-width:none;margin:0;padding:14px 14px 26px}

  /* form and card are the same height — the card is the right-hand column of one block */
  .layout{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:stretch}
  @media(max-width:600px){.layout{grid-template-columns:1fr}}

  /* ---------- intake form ---------- */
  .form{background:var(--panel);border:1px solid var(--line);padding:18px;
    display:flex;flex-direction:column}
  .form .spacer{flex:1;min-height:6px}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .field input[type=text],.field input[type=number],.field input[type=date]{
    width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:14px;padding:10px 11px;transition:border-color .15s}
  .field input:focus{outline:none;border-color:var(--purple)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .custrow{display:flex;gap:8px}
  .custbtn{flex:1;background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 8px;cursor:pointer;transition:all .15s}
  .custbtn:hover{border-color:var(--line-hot)}
  .custbtn.sel{border-color:var(--purple);color:var(--white);background:var(--purple-tint)}

  .chkrow{display:flex;align-items:center;gap:8px;margin:2px 0 20px}
  .chkrow input{accent-color:var(--purple)}
  .chkrow label{font-size:11px;color:var(--faint);letter-spacing:.03em}

  /* ---------- go / no-go lights — everything award sweep needs ---------- */
  .launchrow{display:flex;gap:14px;align-items:stretch;margin-top:4px}
  .leds{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;
    gap:3px 12px;align-content:center}
  .led{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint);cursor:help;white-space:nowrap}
  .led i{flex-shrink:0;width:8px;height:8px;border-radius:50%;font-style:normal;
    background:var(--fail);box-shadow:0 0 5px rgba(224,74,74,.75);transition:all .2s}
  .led.ok{color:var(--dim)}
  .led.ok i{background:var(--pass);box-shadow:0 0 6px rgba(63,189,124,.8)}
  .led.wait i{background:var(--warn);box-shadow:0 0 6px rgba(240,180,41,.7)}
  @media(max-width:600px){.launchrow{flex-direction:column}.leds{grid-template-columns:1fr 1fr}
    .submit{width:100%}}

  .submit{width:180px;flex-shrink:0;background:var(--purple-deep);border:1px solid var(--purple);color:var(--white);
    font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:13px 10px;cursor:pointer;transition:background .15s,transform .08s}
  .submit:hover:not(:disabled){background:var(--purple)}
  .submit:active:not(:disabled){transform:scale(.985)}
  .submit:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line)}

  /* ---------- live card preview (same frame as timeline.html) ---------- */
  .stage{display:flex;flex-direction:column;align-items:stretch;min-height:0}
  .card{width:100%;display:flex;flex:1;min-height:340px;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px;
    box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 0 1px var(--gold-dim);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s,box-shadow .4s}
  .card.pulse{animation:cardPulse .55s ease}
  @keyframes cardPulse{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
  .card.launch{transform:translateY(120px) scale(.5);opacity:0}
  .plate2{flex:1;min-height:0;display:flex;flex-direction:column;
    border:1px solid var(--rule);border-radius:5px;overflow:hidden;
    background:linear-gradient(160deg,var(--face) 0%,var(--face-2) 100%)}
  .tbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 8px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border-bottom:1px solid var(--rule)}
  .tname{flex:1;min-width:0;font-family:var(--disp);font-size:16px;font-weight:700;
    color:var(--white);line-height:1.05;letter-spacing:.01em;word-break:break-word}
  .tname.ph{color:var(--faint);font-weight:600}
  .two{flex-shrink:0;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--white);background:var(--purple);border:1px solid rgba(255,255,255,.35);
    padding:2px 6px;transform:skewX(-10deg)}
  .art{position:relative;flex:1;min-height:56px;margin:5px 6px;background:var(--sunken);
    border:1px solid var(--rule);overflow:hidden;
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);
    display:flex;align-items:center;justify-content:center}
  .art i{font-style:normal;font-family:var(--disp);font-size:8px;letter-spacing:.22em;color:var(--faint)}
  .tline{flex-shrink:0;margin:0 6px;padding:4px 7px;background:rgba(255,255,255,.05);border:1px solid var(--rule);
    font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--white);
    display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
  .tline b{font-weight:700;color:var(--purple-lift)}
  .tline em{font-style:normal;color:var(--faint)}
  .tbox{flex-shrink:0;margin:5px 6px 0;padding:6px 7px;background:rgba(0,0,0,.28);
    border:1px solid var(--rule);min-height:46px}
  .prow{display:flex;justify-content:space-between;gap:8px;font-size:10px;padding:1.5px 0}
  .prow .k{color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .prow .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .bbar{flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
    margin:6px 6px 5px;padding-top:5px;border-top:1px solid var(--rule)}
  .coll{font-size:8px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;line-height:1.4}
  .pt{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--white);background:var(--sunken);
    border:1px solid var(--gold-dim);padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---------- queued-for-sweep list ---------- */
  .queue{margin-top:34px;padding-top:18px;border-top:1px solid transparent;
    border-image:linear-gradient(90deg,transparent,var(--gold-dim) 30%,var(--gold-dim) 70%,transparent) 1}
  .queuehd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .queuehd .t{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .queuehd .n{background:var(--purple-tint);border:1px solid var(--purple);color:var(--purple-lift);
    font-size:10px;padding:1px 7px;border-radius:10px}
  .qnote{font-size:11px;color:var(--faint);margin-bottom:14px;max-width:60ch;line-height:1.5}
  .qitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    padding:10px 13px;margin-bottom:6px;opacity:0;transform:translateY(-8px);
    animation:qin .3s ease forwards}
  @keyframes qin{to{opacity:1;transform:none}}
  .qitem .qmain{flex:1;font-size:12px}
  .qitem .qmain b{color:var(--ink)}
  .qitem .qmain span{color:var(--faint)}
  .qpill{font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--warn);border:1px solid rgba(240,180,41,.5);background:rgba(240,180,41,.08);
    padding:3px 8px;flex-shrink:0}
  .qflush{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--faint);
    font-family:var(--mono);font-size:11px;padding:8px 12px;cursor:pointer;width:100%;text-align:left}
  .qflush:hover{border-color:var(--purple);color:var(--dim)}
  .qempty{font-size:11px;color:var(--faint);font-style:italic}

  /* ---------- flag an issue — exception path only, lives under Submit ---------- */
  .issuewrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .issuelink{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:11px;
    letter-spacing:.02em;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:6px}
  .issuelink .flag{color:var(--warn)}
  .issuelink:hover{color:var(--dim)}
  .issuepanel{display:none;margin-top:10px;background:var(--sunken);border:1px solid rgba(240,180,41,.28)}
  .issuewrap.open .issuepanel{display:block}
  .issuenote{font-size:11px;color:var(--faint);line-height:1.5;padding:11px 12px 0;margin:0}
  .chatlog{max-height:200px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:88%;font-size:12px;line-height:1.5;padding:8px 10px;border:1px solid var(--line)}
  .msg .who{display:block;font-family:var(--disp);font-size:8.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .msg.me{align-self:flex-end;background:var(--purple-tint);border-color:var(--purple-deep)}
  .msg.me .who{color:var(--purple-lift)}
  .msg.ai{align-self:flex-start;background:var(--sunken)}
  .msg.sys{align-self:center;color:var(--faint);font-style:italic;border:none;background:none;font-size:11px}
  .usebtn{margin-top:7px;background:none;border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 9px;cursor:pointer}
  .usebtn:hover{background:var(--purple-tint)}
  .chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .chatin input[type=text]{flex:1;background:var(--sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:9px 10px}
  .chatin input[type=text]:focus{outline:none;border-color:var(--purple)}
  .chatin button{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-size:14px;padding:0 12px;cursor:pointer}
  .chatin button:hover{border-color:var(--purple);color:var(--white)}
  .thumb{max-width:140px;border:1px solid var(--line);margin-top:6px;display:block}

  /* ================= DEPTH PASS ================= */
  :root{--sheen:inset 0 1px 0 rgba(255,255,255,.06);--sink:inset 0 2px 5px rgba(0,0,0,.55)}
  /* body background intentionally transparent — see html,body above */
  .form{background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 40%);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.7),var(--sheen);border-radius:3px}
  .field input[type=text],.field input[type=number],.field input[type=date],
  .chatin input[type=text]{box-shadow:var(--sink);transition:border-color .15s,box-shadow .15s}
  .field input:focus{box-shadow:var(--sink),0 0 0 2px rgba(146,51,230,.22)}
  .custbtn{box-shadow:var(--sink)}
  .custbtn.sel{box-shadow:var(--sink),0 0 14px -5px rgba(168,85,247,.8)}
  .submit{background:linear-gradient(180deg,var(--purple) 0%,var(--purple-deep) 100%);
    box-shadow:0 8px 18px -8px rgba(146,51,230,.9),var(--sheen)}
  .submit:hover:not(:disabled){background:linear-gradient(180deg,#A24BF0 0%,var(--purple) 100%)}
  .submit:disabled{background:var(--panel);box-shadow:none}
  .card{box-shadow:0 18px 38px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.45),
    inset 0 0 0 1px var(--gold-dim)}
  .plate2{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -14px 22px -18px #000}
  .art,.tbox{box-shadow:var(--sink)}
  .qitem{box-shadow:0 4px 12px -6px rgba(0,0,0,.6),var(--sheen);
    transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s}
  .qitem:hover{transform:translateX(3px);border-color:var(--line-hot)}
  .issuepanel{box-shadow:var(--sink)}
  .msg{box-shadow:0 2px 8px -4px rgba(0,0,0,.6)}

  @media(max-width:600px){
    .wrap{padding:12px 10px 24px}
    .h1{font-size:22px}
    .layout{gap:24px}
    .stage{position:static;width:100%;align-items:center}
    .card{width:220px}
    .row2{grid-template-columns:1fr}
    .custrow{flex-wrap:wrap}
    .custbtn{min-width:44%}
  }
  @media(prefers-reduced-motion:reduce){.qitem:hover{transform:none}}

  /* ---------- themes (driven from terminal.html's selector) ---------- */
  :root[data-theme="pixel"]{
    --purple:#39FF6A;--purple-lift:#8CFFAE;--purple-deep:#1E9E43;--purple-tint:rgba(57,255,106,.1);--purple-glow:rgba(57,255,106,.13);
    --bg:#0B0F0B;--panel:#10160F;--raised:#16200F;--sunken:#000;
    --line:#254024;--line-hot:#3A6636;
    --ink:#D8FFDD;--dim:#7FCB8C;--faint:#3E6A45;
    --pass:#39FF6A;--warn:#FFD23F;--fail:#FF3B3B;--pass-tint:rgba(57,255,106,.11);
    --gold:#39FF6A;--gold-lift:#8CFFAE;--gold-dim:rgba(57,255,106,.35);--gold-glow:rgba(57,255,106,.15);
    --frame:#0E140D;--frame-2:#060A05;--face:#142016;--face-2:#0E170F;
    --rule:rgba(140,255,174,.14);--off:#101B10;--off-2:#0B140B;
    --sheen:none;--sink:inset 0 0 0 2px rgba(0,0,0,.7);
  }
  :root[data-theme="pixel"] *{border-radius:0!important}
  :root[data-theme="pixel"] body{background:transparent}
  :root[data-theme="pixel"] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:400;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

  :root[data-theme="stealth"]{
    --purple:#C21E2B;--purple-lift:#E5495A;--purple-deep:#7A1017;--purple-tint:rgba(194,30,43,.1);--purple-glow:rgba(194,30,43,.15);
    --bg:#0A0A0B;--panel:#111113;--raised:#17171A;--sunken:#000;
    --line:#242426;--line-hot:#333336;
    --ink:#E9E9EC;--dim:#8A8A90;--faint:#54545A;
    --pass:#4ADE80;--warn:#F0B429;--fail:#E5495A;--pass-tint:rgba(74,222,128,.09);
    --gold:#8A8A90;--gold-lift:#B5B5BA;--gold-dim:rgba(138,138,144,.25);--gold-glow:rgba(138,138,144,.1);
    --frame:#141416;--frame-2:#0A0A0B;--face:#1B1B1E;--face-2:#131315;
    --rule:rgba(255,255,255,.09);--off:#151517;--off-2:#0F0F11;
    --sheen:inset 0 1px 0 rgba(255,255,255,.03);--sink:inset 0 3px 7px rgba(0,0,0,.75);
  }
  :root[data-theme="stealth"] body{background:transparent}

  :root[data-theme="mono"] body{filter:grayscale(1) contrast(1.08)}

</style>

<script>
(function(){
  var THEMES=['normal','pixel','mono','stealth'];
  function apply(t){
    if(THEMES.indexOf(t)<0) t='normal';
    document.documentElement.setAttribute('data-theme',t);
  }
  var saved='normal';
  try{ saved=localStorage.getItem('sr_theme')||'normal'; }catch(e){}
  apply(saved);
  window.addEventListener('storage',function(e){
    if(e.key==='sr_theme') apply(e.newValue||'normal');
  });
})();
</script>

<div class="wrap">
  <div class="layout">
    <div class="form">
      <div class="field">
        <label>Part number</label>
        <input type="text" id="fPart" placeholder="TRAM_G2-01046" autocomplete="off">
      </div>
      <div class="row2">
        <div class="field">
          <label>PO number</label>
          <input type="text" id="fPO" placeholder="266677" autocomplete="off">
        </div>
        <div class="field">
          <label>Qty</label>
          <input type="number" id="fQty" placeholder="12" min="0">
        </div>
      </div>
      <div class="field">
        <label>Customer</label>
        <div class="custrow">
          <button type="button" class="custbtn" data-c="ROBERTS">Roberts</button>
          <button type="button" class="custbtn" data-c="FTI">Ferrera (FTI)</button>
        </div>
      </div>
      <div class="field">
        <label>Due date <span style="text-transform:none;color:var(--faint)">(optional)</span></label>
        <input type="date" id="fDue">
      </div>
      <div class="chkrow">
        <input type="checkbox" id="fDad"><label for="fDad">DAD JOB — separate invoice sequence</label>
      </div>
      <div class="spacer"></div>

      <div class="launchrow">
        <div class="leds" id="leds">
          <div class="led" data-k="part"  title="Part number as it appears on the PO"><i></i>Part no.</div>
          <div class="led" data-k="po"    title="PO number — names the OFFICE/PO_XXXXX folder"><i></i>PO no.</div>
          <div class="led" data-k="qty"   title="Quantity on this PO line"><i></i>Qty</div>
          <div class="led" data-k="cust"  title="Sets the Dropbox customer folder and the QBO customer"><i></i>Customer</div>
          <div class="led" data-k="due"   title="Drives late counts on the timeline"><i></i>Due date</div>
          <div class="led wait" data-k="file" title="PO scan in JOBSHOP/INBOX/ — can't be checked from the tablet; award sweep confirms it and moves the file"><i></i>PO file</div>
        </div>
        <button class="submit" id="fSubmit" disabled>Award job</button>
      </div>

      <div class="issuewrap" id="issueWrap">
        <button type="button" class="issuelink" id="issueToggle" title="Exceptions only — a PO that won't read clean, an ambiguous repeat part, anything that doesn't fit a field above"><span class="flag">⚑</span> Flag an issue</button>
        <div class="issuepanel">
          <div class="chatlog" id="chatLog"></div>
          <div class="chatin">
            <button type="button" id="chatAttach" title="Attach photo">📎</button>
            <input type="file" id="chatFile" accept="image/*,application/pdf" capture="environment" hidden>
            <input type="text" id="chatText" placeholder="e.g. this PO number is smudged, could be 15902 or 15920…">
            <button type="button" id="chatSend" title="Send">➤</button>
          </div>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="card" id="pCard" title="Live preview — this is the card that gets created">
        <div class="plate2">
          <div class="tbar">
            <div class="tname ph" id="pName">Part number</div>
            <div class="two" id="pWo">NEW</div>
          </div>
          <div class="art"><i id="pArt">AWAITING SPEC</i></div>
          <div class="tline">
            <b id="pPo">PO —</b><em>·</em><span id="pCust">CUSTOMER</span><em>·</em><span>AWARD</span>
          </div>
          <div class="tbox">
            <div class="prow"><span class="k">Qty</span><span class="v" id="pQty">—</span></div>
            <div class="prow"><span class="k">Due</span><span class="v" id="pDue">—</span></div>
          </div>
          <div class="bbar">
            <div class="coll">STEALTH R&amp;D<br><span id="pCollCust">—</span></div>
            <div class="pt" id="pStat">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="queue">
    <div class="queuehd"><span class="t" title="Dropbox work award sweep still owes: scaffold folders, cross-check JOBSHOP/INBOX/, move the PO file into OFFICE/PO_XXXXX/. Run &quot;award sweep&quot; in chat to clear it.">Queued for sweep</span><span class="n" id="qCount">0</span></div>
    <div id="qList"><div class="qempty">Nothing queued.</div></div>
  </div>



</div>

<script>
(function(){
  var state={part:'',po:'',cust:'',qty:'',due:'',dad:false};
  var queue=[]; // in-memory only until api/jobs.js exists — the write endpoint the card
                // and the queue both need to actually persist across a reload or a second device

  var fPart=el('fPart'),fPO=el('fPO'),fQty=el('fQty'),fDue=el('fDue'),fDad=el('fDad'),fSubmit=el('fSubmit');
  function el(id){return document.getElementById(id)}

  function refreshPreview(){
    el('pName').textContent=state.part||'Part number';
    el('pName').classList.toggle('ph',!state.part);
    el('pPo').textContent='PO '+(state.po||'—');
    el('pCust').textContent=state.cust||'CUSTOMER';
    el('pQty').textContent=state.qty||'—';
    el('pDue').textContent=state.due?fmtDate(state.due):'—';
    el('pCollCust').textContent=state.cust==='ROBERTS'?'Roberts Manufacturing':
                                  state.cust==='FTI'?'Ferrera Tooling':'—';
    el('pStat').textContent=state.dad?'DAD':(state.qty||'—');
    el('pArt').textContent=state.cust?state.cust+' JOB':'AWAITING SPEC';
    checkReady();
  }
  function fmtDate(iso){
    var d=new Date(iso+'T00:00:00');
    return (d.getMonth()+1)+'/'+d.getDate();
  }
  // Go / no-go lights.
  // Part / PO / Customer are hard requirements — red until filled, and the
  // Award button stays disabled until all three are green (same gate the form
  // has always had).
  // Qty / Due date are shown but don't block: the real board routinely has
  // JOB AWARD cards with no due date yet, and qty/price both get re-confirmed
  // against the PO at sweep/invoice time anyway — so these read amber-until-filled,
  // green-once-filled, informational only.
  // PO file always reads amber: the browser can't see JOBSHOP/INBOX/, so award
  // sweep is what actually confirms and moves it. The card is allowed to exist
  // before the scan does.
  var BLOCKING=['part','po','cust'];
  function checkReady(){
    var filled={
      part: !!state.part.trim(),
      po:   !!state.po.trim(),
      cust: !!state.cust,
      qty:  !!state.qty && Number(state.qty)>0,
      due:  !!state.due,
      file: false
    };
    var allGo=true;
    document.querySelectorAll('#leds .led').forEach(function(l){
      var k=l.dataset.k;
      if(k==='file'){ l.className='led wait'; return; }
      var ok=filled[k];
      l.className='led'+(ok?' ok':(BLOCKING.indexOf(k)<0?' wait':''));
      if(BLOCKING.indexOf(k)>=0 && !ok) allGo=false;
    });
    fSubmit.disabled=!allGo;
  }

  fPart.addEventListener('input',function(){state.part=fPart.value;refreshPreview();});
  fPO.addEventListener('input',function(){state.po=fPO.value;refreshPreview();});
  fQty.addEventListener('input',function(){state.qty=fQty.value;refreshPreview();});
  fDue.addEventListener('input',function(){state.due=fDue.value;refreshPreview();});
  fDad.addEventListener('change',function(){state.dad=fDad.checked;refreshPreview();});

  document.querySelectorAll('.custbtn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.custbtn').forEach(function(x){x.classList.remove('sel')});
      b.classList.add('sel');
      state.cust=b.dataset.c;
      refreshPreview();
    });
  });

  fSubmit.addEventListener('click',function(){
    if(fSubmit.disabled) return;
    var job={part:state.part,po:state.po,cust:state.cust};
    postJob(); // fire immediately — don't make the animation wait on the network
    var card=el('pCard');
    card.classList.add('pulse');
    setTimeout(function(){
      card.classList.remove('pulse');
      card.classList.add('launch');
      setTimeout(function(){
        addToQueue(job);
        card.classList.remove('launch');
        resetForm();
      },420);
    },550);
  });

  // Persist to api/jobs.js. This is the actual write now that the endpoint
  // exists — the in-memory "Queued for sweep" list below is unrelated to
  // whether this succeeds; it only tracks the Dropbox side award sweep still owes.
  function postJob(){
    var payload={
      part:state.part, po:state.po, customer:state.cust,
      qty:state.qty?Number(state.qty):null, dueDate:state.due||null, dadJob:state.dad
    };
    fetch('/api/jobs',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    }).catch(function(){
      // offline / not deployed yet — the card still launches locally so the
      // form stays usable; nothing here should block or alert the person.
    });
  }

  function resetForm(){
    state={part:'',po:'',cust:'',qty:'',due:'',dad:false};
    fPart.value='';fPO.value='';fQty.value='';fDue.value='';fDad.checked=false;
    document.querySelectorAll('.custbtn').forEach(function(x){x.classList.remove('sel')});
    refreshPreview();
    fPart.focus();
  }

  function addToQueue(job){
    queue.unshift(job);
    el('qCount').textContent=queue.length;
    var list=el('qList');
    if(queue.length===1) list.innerHTML='';
    var row=document.createElement('div');
    row.className='qitem';
    row.innerHTML='<div class="qmain"><b>'+job.part+'</b> <span>— PO '+job.po+' · '+job.cust+'</span></div>'+
                   '<span class="qpill">Awaiting sweep</span>';
    list.prepend(row);
  }

  refreshPreview();

  // ---------------- flag an issue (exception path only) ----------------
  var issueWrap=el('issueWrap'),chatLog=el('chatLog'),chatText=el('chatText');
  el('issueToggle').addEventListener('click',function(){issueWrap.classList.toggle('open')});

  var pendingImage=null;
  el('chatAttach').addEventListener('click',function(){el('chatFile').click()});
  el('chatFile').addEventListener('change',function(){
    var f=this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      pendingImage={data:r.result.split(',')[1],media_type:f.type||'image/jpeg'};
      addMsg('me','Attached: '+f.name);
      var img=document.createElement('img');
      img.className='thumb'; img.src=r.result;
      chatLog.lastChild.appendChild(img);
      scrollChat();
    };
    r.readAsDataURL(f);
  });

  el('chatSend').addEventListener('click',sendChat);
  chatText.addEventListener('keydown',function(e){if(e.key==='Enter') sendChat();});

  function addMsg(who,text){
    var m=document.createElement('div');
    m.className='msg '+who;
    m.innerHTML='<span class="who">'+(who==='me'?'You':who==='ai'?'Claude':'')+'</span>'+escapeHtml(text);
    chatLog.appendChild(m);
    scrollChat();
    return m;
  }
  function escapeHtml(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function scrollChat(){chatLog.scrollTop=chatLog.scrollHeight}

  function sendChat(){
    var text=chatText.value.trim();
    if(!text&&!pendingImage) return;
    if(text) addMsg('me',text);
    chatText.value='';
    var content=[];
    if(pendingImage) content.push({type:'image',source:{type:'base64',media_type:pendingImage.media_type,data:pendingImage.data}});
    content.push({type:'text',text:text||'Read this PO and pull out the part number(s), PO number, qty, and unit price. Reply in plain sentences, then a fenced json block with any of {part,po,qty,customer} you\'re confident about.'});
    var img=pendingImage; pendingImage=null;

    var thinking=addMsg('ai','…thinking');
    fetch('/api/claude',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:content}]})
    }).then(function(r){
      if(!r.ok) throw new Error('no endpoint');
      return r.json();
    }).then(function(data){
      thinking.remove();
      var reply=(data.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('\n');
      handleReply(reply);
    }).catch(function(){
      thinking.remove();
      addMsg('sys','(demo mode — no /api/claude on this preview; this call is real once dropped onto stealthrnd.com)');
      // canned demo so the interaction is still legible while sketching
      handleReply('Reads as TRAM_G2 x1, PO 266677, qty 6. ```json\n{"part":"TRAM_G2-01046","po":"266677","qty":"6","customer":"FTI"}\n```');
    });
  }

  function handleReply(reply){
    var m=reply.match(/```json\s*([\s\S]*?)```/);
    var plain=reply.replace(/```json[\s\S]*?```/,'').trim();
    var msgEl=addMsg('ai',plain||reply);
    if(m){
      try{
        var fields=JSON.parse(m[1]);
        var btn=document.createElement('button');
        btn.className='usebtn'; btn.textContent='Use these values →';
        btn.onclick=function(){
          if(fields.part){fPart.value=fields.part;state.part=fields.part}
          if(fields.po){fPO.value=fields.po;state.po=fields.po}
          if(fields.qty){fQty.value=fields.qty;state.qty=fields.qty}
          if(fields.customer){
            document.querySelectorAll('.custbtn').forEach(function(x){
              x.classList.toggle('sel',x.dataset.c===fields.customer);
            });
            state.cust=fields.customer;
          }
          refreshPreview();
          issueWrap.classList.remove('open');
        };
        msgEl.appendChild(btn);
      }catch(e){}
    }
  }
})();
</script>
