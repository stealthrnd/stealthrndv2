<meta charset="utf-8">
<!-- OFFICE.HTML — loads inside terminal.html's Office station. Two desks:
     ONBOARD  — award a new job. Form and live card sit side by side, same size,
                because the card IS the deliverable, not a thumbnail of it.
     OFFBOARD — close a finished job out: invoice number, payment, folder archive.

     Card tokens are borrowed from timeline.html so the preview really is the card
     that lands on the board.

     DROPBOX SEAM: provisionFolders() / archiveFolders() POST to /api/dropbox. That
     endpoint doesn't exist yet — both fall back to "needs an award sweep in chat"
     and say so plainly. When the Dropbox app token lands, the endpoint appears and
     the fallback stops firing; nothing else in this file has to change. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Office — Stealth R&amp;D</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --purple:#9233E6; --purple-lift:#A855F7; --purple-deep:#6B21C4;
    --purple-tint:rgba(146,51,230,.10); --purple-glow:rgba(146,51,230,.13);
    --white:#FFFFFF; --silver:#CCCCCC;
    --bg:#232327; --panel:#2C2C31; --raised:#35353B; --sunken:#060606;
    --line:#43434B; --line-hot:#54545E;
    --ink:#F4F4F6; --dim:#A6A6B2; --faint:#7C7C88;
    --pass:#4ADE80; --warn:#F0B429; --fail:#F87171;
    --pass-tint:rgba(74,222,128,.11); --warn-tint:rgba(240,180,41,.11); --fail-tint:rgba(248,113,113,.11);
    --gold:#C9A227; --gold-lift:#E3C158; --gold-dim:rgba(201,162,39,.32);
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --disp:'Barlow Condensed','Oswald',system-ui,sans-serif;
    --frame:#1A1A1F; --frame-2:#0E0E12;
    --face:#33333C; --face-2:#26262D;
    --rule:rgba(255,255,255,.11);
    --sheen:inset 0 1px 0 rgba(255,255,255,.06);
    --sink:inset 0 2px 5px rgba(0,0,0,.55);
  }
  html,body{height:100%}
  html{background:transparent}
  body{margin:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:13px}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
    box-shadow:inset 0 0 0 1px var(--gold-dim)}

  .wrap{padding:12px 14px 26px;max-width:1180px;margin:0 auto}

  /* ---------- desk tabs ---------- */
  .tabs{display:flex;gap:4px;background:var(--sunken);border:1px solid var(--line);
    padding:4px;margin-bottom:14px}
  .tab{flex:1;background:none;border:1px solid transparent;color:var(--faint);cursor:pointer;
    font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;padding:9px 6px;transition:all .15s}
  .tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  .tab.on{color:var(--white);background:var(--purple-tint);border-color:var(--purple)}
  .tab .sub{display:block;font-family:var(--mono);font-size:9px;font-weight:400;
    letter-spacing:.03em;text-transform:none;color:var(--faint);margin-top:2px}
  .tab.on .sub{color:var(--dim)}
  .desk[hidden]{display:none}

  /* ---------- the two halves, deliberately equal ---------- */
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}

  .form{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;
    display:flex;flex-direction:column;
    background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 40%);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.7),var(--sheen)}
  .form .spacer{flex:1;min-height:4px}

  .field{margin-bottom:10px}
  .field label{display:block;font-family:var(--disp);font-size:9.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--faint);margin-bottom:4px}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select{
    width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:8px 9px;box-shadow:var(--sink);
    transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--purple);
    box-shadow:var(--sink),0 0 0 3px var(--purple-glow)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  .newcust{margin-top:6px}
  .newcust[hidden]{display:none}

  .chkrow{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .chkrow input{accent-color:var(--purple)}
  .chkrow label{font-size:11px;color:var(--faint);letter-spacing:.03em}

  /* ---------- go / no-go lights ---------- */
  .leds{display:flex;flex-wrap:wrap;gap:5px 14px;margin:8px 0 12px;
    padding-top:10px;border-top:1px solid var(--line)}
  .led{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint);cursor:help;white-space:nowrap}
  .led i{flex-shrink:0;width:7px;height:7px;border-radius:50%;font-style:normal;
    background:var(--fail);box-shadow:0 0 5px rgba(248,113,113,.7);transition:all .2s}
  .led.ok{color:var(--dim)}
  .led.ok i{background:var(--pass);box-shadow:0 0 6px rgba(74,222,128,.75)}
  .led.wait i{background:var(--warn);box-shadow:0 0 6px rgba(240,180,41,.7)}

  .submit{width:100%;background:linear-gradient(180deg,var(--purple) 0%,var(--purple-deep) 100%);
    border:1px solid var(--purple);color:var(--white);
    font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 10px;cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(146,51,230,.9),var(--sheen);
    transition:background .15s,transform .08s}
  .submit:hover:not(:disabled){background:linear-gradient(180deg,#A24BF0 0%,var(--purple) 100%)}
  .submit:active:not(:disabled){transform:scale(.985)}
  .submit:disabled{opacity:.35;cursor:not-allowed;background:var(--panel);
    border-color:var(--line);box-shadow:none}

  /* ---------- live card preview ---------- */
  .stage{display:flex;flex-direction:column;min-height:0}
  .card{flex:1;display:flex;min-height:420px;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px;
    box-shadow:0 18px 38px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.45),
      inset 0 0 0 1px var(--gold-dim);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
  .card.pulse{animation:cardPulse .55s ease}
  @keyframes cardPulse{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
  .card.launch{transform:translateY(120px) scale(.5);opacity:0}
  .plate2{flex:1;min-height:0;display:flex;flex-direction:column;
    border:1px solid var(--rule);border-radius:5px;overflow:hidden;
    background:linear-gradient(160deg,var(--face) 0%,var(--face-2) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -14px 22px -18px #000}
  .tbar{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:8px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border-bottom:1px solid var(--rule)}
  .tname{flex:1;min-width:0;font-family:var(--disp);font-size:22px;font-weight:700;
    color:var(--white);line-height:1.05;word-break:break-word}
  .tname.ph{color:var(--faint);font-weight:600}
  .two{flex-shrink:0;font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.08em;
    color:var(--white);background:var(--purple);border:1px solid rgba(255,255,255,.35);
    padding:3px 8px;transform:skewX(-10deg)}
  .art{position:relative;flex:1;min-height:90px;margin:6px 7px;background:var(--sunken);
    border:1px solid var(--rule);overflow:hidden;box-shadow:var(--sink);
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);
    display:flex;align-items:center;justify-content:center}
  .art i{font-style:normal;font-family:var(--disp);font-size:9px;letter-spacing:.22em;color:var(--faint)}
  .tline{flex-shrink:0;margin:0 7px;padding:5px 8px;background:rgba(255,255,255,.05);
    border:1px solid var(--rule);font-family:var(--disp);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--white);display:flex;gap:6px;align-items:center;
    white-space:nowrap;overflow:hidden}
  .tline b{font-weight:700;color:var(--purple-lift)}
  .tline em{font-style:normal;color:var(--faint)}
  .tbox{flex-shrink:0;margin:6px 7px 0;padding:8px 9px;background:rgba(0,0,0,.28);
    border:1px solid var(--rule);box-shadow:var(--sink)}
  .prow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
  .prow .k{color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .prow .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .bbar{flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
    margin:8px 7px 6px;padding-top:7px;border-top:1px solid var(--rule)}
  .coll{font-size:9px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;line-height:1.45}
  .pt{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--white);background:var(--sunken);
    border:1px solid var(--gold-dim);padding:3px 10px;white-space:nowrap;
    font-variant-numeric:tabular-nums;box-shadow:var(--sink)}

  /* ---------- folders panel (Dropbox seam) ---------- */
  .sect{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);margin:20px 0 9px;
    display:flex;align-items:center;gap:10px}
  .sect::after{content:'';flex:1;height:1px;background:var(--line)}
  .sect .n{background:var(--purple-tint);border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:10px;letter-spacing:.04em}
  .srcpill{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:2px 6px;color:var(--faint)}
  .srcpill.live{color:var(--pass);border-color:rgba(74,222,128,.35)}
  .srcpill.manual{color:var(--warn);border-color:rgba(240,180,41,.35)}

  .fitem{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    padding:9px 12px;margin-bottom:5px;box-shadow:0 4px 12px -6px rgba(0,0,0,.6),var(--sheen)}
  .fitem .fmain{flex:1;min-width:0;font-size:12px}
  .fitem .fmain b{color:var(--ink)}
  .fitem .fmain span{color:var(--faint)}
  .fitem .fpath{display:block;font-size:10px;color:var(--faint);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fpill{font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;flex-shrink:0;white-space:nowrap}
  .fpill.wait{color:var(--warn);border:1px solid rgba(240,180,41,.5);background:var(--warn-tint)}
  .fpill.ok{color:var(--pass);border:1px solid rgba(74,222,128,.5);background:var(--pass-tint)}
  .fpill.bad{color:var(--fail);border:1px solid rgba(248,113,113,.5);background:var(--fail-tint)}
  .empty{font-size:11px;color:var(--faint);font-style:italic;padding:4px 0}
  .note{font-size:10.5px;color:var(--faint);line-height:1.55;margin:0 0 10px;max-width:74ch}

  /* ---------- offboard ---------- */
  .obfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .obchip{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;padding:7px 13px;cursor:pointer;transition:all .15s}
  .obchip:hover{border-color:var(--line-hot);color:var(--ink)}
  .obchip.on{background:var(--purple-tint);border-color:var(--purple);color:var(--white)}
  .obchip i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);
    margin-left:6px}
  .obchip.on i{color:var(--purple-lift)}

  .oblayout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .oblist{display:flex;flex-direction:column;gap:5px;max-height:560px;overflow-y:auto}
  .obrow{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--line);padding:10px 12px;cursor:pointer;text-align:left;width:100%;
    font-family:var(--mono);transition:border-color .15s,transform .15s}
  .obrow:hover{border-color:var(--line-hot);transform:translateX(2px)}
  .obrow.sel{border-color:var(--purple);border-left-color:var(--purple);background:var(--purple-tint)}
  .obrow.s-noinv{border-left-color:var(--fail)}
  .obrow.s-unpaid{border-left-color:var(--warn)}
  .obrow.s-paid{border-left-color:var(--pass)}
  .obrow .obj{flex:1;min-width:0}
  .obrow .obj b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;
    color:var(--ink);letter-spacing:.02em}
  .obrow .obj span{display:block;font-size:10px;color:var(--faint);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .obrow .obf{font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    flex-shrink:0;white-space:nowrap}
  .obrow.s-noinv .obf{color:var(--fail)}
  .obrow.s-unpaid .obf{color:var(--warn)}
  .obrow.s-paid .obf{color:var(--pass)}

  .obpanel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;
    box-shadow:0 14px 34px -14px rgba(0,0,0,.7),var(--sheen);position:sticky;top:8px}
  .obhd{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.02em}
  .obsub{font-size:10.5px;color:var(--faint);margin:3px 0 12px;line-height:1.5}
  .obsteps{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
  .obstep{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:11.5px;color:var(--dim);
    border-bottom:1px solid rgba(67,67,75,.5)}
  .obstep:last-child{border-bottom:none}
  .obstep .d{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--line-hot)}
  .obstep.done .d{background:var(--pass);box-shadow:0 0 6px rgba(74,222,128,.6)}
  .obstep.todo .d{background:var(--warn);box-shadow:0 0 6px rgba(240,180,41,.6)}
  .obstep .l{flex:1}
  .obstep.done .l{color:var(--faint)}
  .obacts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
  .obacts .wide{grid-column:1/-1}
  .obbtn{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;padding:10px 8px;cursor:pointer;transition:all .15s}
  .obbtn:hover:not(:disabled){border-color:var(--purple);color:var(--white);background:var(--purple-tint)}
  .obbtn:disabled{opacity:.35;cursor:not-allowed}
  .obbtn.go{border-color:rgba(74,222,128,.45);color:var(--pass)}
  .obbtn.go:hover:not(:disabled){background:var(--pass-tint);border-color:var(--pass);color:var(--pass)}
  .obstat{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    margin-top:9px;text-align:center;min-height:13px}
  .obstat.ok{color:var(--pass)} .obstat.bad{color:var(--fail)} .obstat.busy{color:var(--warn)}
  .obnone{background:rgba(0,0,0,.35);border:1px dashed var(--line-hot);border-radius:3px;
    padding:34px 22px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.6}

  /* ---------- flag an issue ---------- */
  .issuewrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .issuelink{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:11px;
    cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:6px}
  .issuelink .flag{color:var(--warn)}
  .issuelink:hover{color:var(--dim)}
  .issuepanel{display:none;margin-top:10px;background:var(--sunken);
    border:1px solid rgba(240,180,41,.28);box-shadow:var(--sink)}
  .issuewrap.open .issuepanel{display:block}
  .chatlog{max-height:200px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:88%;font-size:12px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);
    box-shadow:0 2px 8px -4px rgba(0,0,0,.6)}
  .msg .who{display:block;font-family:var(--disp);font-size:8.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .msg.me{align-self:flex-end;background:var(--purple-tint);border-color:var(--purple-deep)}
  .msg.me .who{color:var(--purple-lift)}
  .msg.ai{align-self:flex-start;background:var(--sunken)}
  .msg.sys{align-self:center;color:var(--faint);font-style:italic;border:none;background:none;font-size:11px}
  .usebtn{margin-top:7px;background:none;border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 9px;cursor:pointer}
  .usebtn:hover{background:var(--purple-tint)}
  .chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .chatin input[type=text]{flex:1;background:var(--sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:9px 10px;box-shadow:var(--sink)}
  .chatin input[type=text]:focus{outline:none;border-color:var(--purple)}
  .chatin button{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-size:14px;padding:0 12px;cursor:pointer}
  .chatin button:hover{border-color:var(--purple);color:var(--white)}
  .thumb{max-width:140px;border:1px solid var(--line);margin-top:6px;display:block}

  .toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,14px);z-index:300;
    background:var(--panel);border:1px solid var(--purple);padding:11px 16px;font-size:11px;
    color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- mobile: 700px to match timeline.html, same iframe width ---------- */
  @media(max-width:700px){
    .wrap{padding:10px 10px 26px}
    .tab{font-size:12px;padding:8px 4px}
    .tab .sub{display:none}
    /* The card stops being a side-by-side peer and becomes what it is on a
       phone: the thing you glance at after filling the form. */
    .layout,.oblayout{grid-template-columns:1fr;gap:14px}
    .card{min-height:0}
    .art{min-height:76px}
    .tname{font-size:19px}
    .obpanel{position:static}
    .oblist{max-height:none}
    .row3{grid-template-columns:1fr 1fr}
    .row3 .field:first-child{grid-column:1/-1}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- themes (driven from terminal.html's selector) ---------- */
  :root[data-theme="pixel"]{
    --purple:#39FF6A;--purple-lift:#8CFFAE;--purple-deep:#1E9E43;--purple-tint:rgba(57,255,106,.1);
    --purple-glow:rgba(57,255,106,.13);
    --bg:#0B0F0B;--panel:#10160F;--raised:#16200F;--sunken:#000;
    --line:#254024;--line-hot:#3A6636;
    --ink:#D8FFDD;--dim:#7FCB8C;--faint:#3E6A45;
    --pass:#39FF6A;--warn:#FFD23F;--fail:#FF3B3B;
    --pass-tint:rgba(57,255,106,.11);--warn-tint:rgba(255,210,63,.11);--fail-tint:rgba(255,59,59,.11);
    --gold:#39FF6A;--gold-lift:#8CFFAE;--gold-dim:rgba(57,255,106,.35);
    --frame:#0E140D;--frame-2:#060A05;--face:#142016;--face-2:#0E170F;
    --rule:rgba(140,255,174,.14);
    --sheen:none;--sink:inset 0 0 0 2px rgba(0,0,0,.7);
  }
  :root[data-theme="pixel"] *{border-radius:0!important}
  :root[data-theme="pixel"] body{background:transparent}
  :root[data-theme="pixel"] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:400;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

  :root[data-theme="stealth"]{

    --gold:#8A8A90;--gold-lift:#B5B5BA;--gold-dim:rgba(138,138,144,.25);

<script>
(function(){
  var THEMES=['normal','pixel','mono','stealth'];
  function apply(t){
    if(THEMES.indexOf(t)<0) t='normal';
    document.documentElement.setAttribute('data-theme',t);
  }
  var saved='normal';
  try{ saved=localStorage.getItem('sr_theme')||'normal'; }catch(e){}
  apply(saved);
  window.addEventListener('storage',function(e){
    if(e.key==='sr_theme') apply(e.newValue||'normal');
  });
})();
</script>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ---- known QBO customer labels. Anything not in here still works; it just
  // shows its own name on the card instead of a long-form company name.
  var CUST_LABELS={
    'ROBERTS':'Roberts Manufacturing',
    'FTI':'Ferrera Tooling'
  };
  var SEED_CUSTOMERS=['ROBERTS','FTI'];
  var NEW_CUST='__new__';

  var state={part:'',po:'',cust:'',qty:'',price:'',due:'',dad:false};
  var JOBS=[];               // everything from /api/jobs
  var pendingFolders=[];     // jobs awarded this session whose folders aren't confirmed
  var dropboxLive=false;     // flips true once /api/dropbox answers

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(n){
    if(n==null||isNaN(n)||n==='')return '\u2014';
    return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function custLabel(c){return CUST_LABELS[c]||c||'\u2014';}

  var toastEl=el('toast');
  function toast(m){
    toastEl.textContent=m;toastEl.classList.add('on');
    clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('on');},3200);
  }

  // ---------------- desk tabs ----------------
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.onclick=function(){
      var d=b.getAttribute('data-desk');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
        x.classList.toggle('on',x===b);
      });
      el('deskOnboard').hidden=(d!=='onboard');
      el('deskOffboard').hidden=(d!=='offboard');
      if(d==='offboard') renderOffboard();
    };
  });

  // ---------------- customers ----------------
  // Built from the jobs that actually exist, not a hardcoded pair — a third
  // customer shouldn't need a code change to show up here.
  function customerList(){
    var seen={},out=[];
    SEED_CUSTOMERS.forEach(function(c){seen[c]=1;out.push(c);});
    JOBS.forEach(function(j){
      var c=(j.customer||'').trim();
      if(c&&!seen[c]){seen[c]=1;out.push(c);}
    });
    return out.sort();
  }
  function paintCustomers(){
    var sel=el('fCust'), cur=state.cust;
    sel.innerHTML='<option value="">Select customer\u2026</option>'+
      customerList().map(function(c){
        return '<option value="'+esc(c)+'"'+(c===cur?' selected':'')+'>'+
          esc(c)+(CUST_LABELS[c]?(' \u2014 '+esc(CUST_LABELS[c])):'')+'</option>';
      }).join('')+
      '<option value="'+NEW_CUST+'">+ New customer\u2026</option>';
  }
  el('fCust').addEventListener('change',function(){
    var v=el('fCust').value;
    if(v===NEW_CUST){
      el('newCustWrap').hidden=false;
      state.cust='';
      el('fNewCust').focus();
    }else{
      el('newCustWrap').hidden=true;
      el('fNewCust').value='';
      state.cust=v;
    }
    refreshPreview();
  });
  el('fNewCust').addEventListener('input',function(){
    // Customer folders are literal Dropbox path segments, so keep them to the
    // same shape the existing ones use rather than letting a slash in.
    state.cust=el('fNewCust').value.trim().toUpperCase().replace(/[\/\\]/g,'');
    refreshPreview();
  });

  // ---------------- live card preview ----------------
  function refreshPreview(){
    var qty=state.qty?Number(state.qty):null, price=state.price?Number(state.price):null;
    el('pName').textContent=state.part||'Part number';
    el('pName').classList.toggle('ph',!state.part);
    el('pPo').textContent='PO '+(state.po||'\u2014');
    el('pCust').textContent=state.cust||'CUSTOMER';
    el('pQty').textContent=qty!=null?qty:'\u2014';
    el('pPrice').textContent=price!=null?money(price):'\u2014';
    el('pTotal').textContent=(qty!=null&&price!=null)?money(qty*price):'\u2014';
    el('pDue').textContent=state.due?fmtDate(state.due):'\u2014';
    el('pCollCust').textContent=state.cust?custLabel(state.cust):'\u2014';
    el('pStat').textContent=state.dad?'DAD':(qty!=null?qty:'\u2014');
    el('pArt').textContent=state.cust?(state.cust+' JOB'):'AWAITING SPEC';
    checkReady();
  }
  function fmtDate(iso){
    var d=new Date(iso+'T00:00:00');
    return (d.getMonth()+1)+'/'+d.getDate();
  }

  // Part / PO / Customer block the award. Qty / Price / Due are informational —
  // the real board routinely has JOB AWARD cards with no due date yet, and
  // qty/price are re-confirmed against the PO at invoice time anyway.
  // PO file reads amber until Dropbox is connected; once it is, it becomes a
  // real check against JOBSHOP/INBOX/ instead of a standing reminder.
  var BLOCKING=['part','po','cust'];
  function checkReady(){
    var filled={
      part: !!state.part.trim(),
      po:   !!state.po.trim(),
      cust: !!state.cust,
      qty:  !!state.qty && Number(state.qty)>0,
      price:!!state.price && Number(state.price)>0,
      due:  !!state.due
    };
    var allGo=true;
    Array.prototype.forEach.call(document.querySelectorAll('#leds .led'),function(l){
      var k=l.getAttribute('data-k');
      if(k==='file'){ l.className='led wait'; return; }
      var ok=filled[k];
      l.className='led'+(ok?' ok':(BLOCKING.indexOf(k)<0?' wait':''));
      if(BLOCKING.indexOf(k)>=0 && !ok) allGo=false;
    });
    el('fSubmit').disabled=!allGo;
  }

  ['fPart','fPO','fQty','fPrice','fDue'].forEach(function(id){
    var key={fPart:'part',fPO:'po',fQty:'qty',fPrice:'price',fDue:'due'}[id];
    el(id).addEventListener('input',function(){ state[key]=el(id).value; refreshPreview(); });
  });
  el('fDad').addEventListener('change',function(){state.dad=el('fDad').checked;refreshPreview();});

  // ---------------- award ----------------
  el('fSubmit').addEventListener('click',function(){
    if(el('fSubmit').disabled) return;
    var job={
      part:state.part.trim(), po:state.po.trim(), customer:state.cust,
      qty:state.qty?Number(state.qty):null,
      price:state.price?Number(state.price):null,
      dueDate:state.due||null, dadJob:state.dad
    };
    postJob(job);
    var card=el('pCard');
    card.classList.add('pulse');
    setTimeout(function(){
      card.classList.remove('pulse');
      card.classList.add('launch');
      setTimeout(function(){
        card.classList.remove('launch');
        resetForm();
      },420);
    },520);
  });

  function postJob(job){
    fetch('/api/jobs',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(job)
    })
    .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(saved){
      JOBS.push(saved);
      paintCustomers();
      provisionFolders(saved);
      toast('Awarded '+(saved.part||'')+' \u2014 PO '+(saved.po||''));
    })
    .catch(function(){
      toast('Couldn\u2019t save the job \u2014 check the connection and re-enter it');
    });
  }

  function resetForm(){
    state={part:'',po:'',cust:'',qty:'',price:'',due:'',dad:false};
    ['fPart','fPO','fQty','fPrice','fDue','fNewCust'].forEach(function(id){el(id).value='';});
    el('fDad').checked=false;
    el('newCustWrap').hidden=true;
    el('fCust').value='';
    refreshPreview();
    el('fPart').focus();
  }

  // ---------------- DROPBOX SEAM ----------------
  // One call, two outcomes. While /api/dropbox is absent this records the job as
  // owing an award sweep and says so; once the endpoint exists the same call
  // provisions the folders for real and the pending list stops filling up.
  function dropboxPath(job){
    return 'JOBSHOP/'+(job.customer||'?')+'/'+(job.part||'?')+'/OFFICE/PO_'+(job.po||'?');
  }
  function provisionFolders(job){
    var entry={job:job,status:'wait',msg:'Awaiting award sweep'};
    pendingFolders.unshift(entry);
    renderFolders();

    fetch('/api/dropbox',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'provision',customer:job.customer,part:job.part,po:job.po})
    })
    .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(res){
      dropboxLive=true;
      entry.status=res&&res.ok===false?'bad':'ok';
      entry.msg=(res&&res.message)||(entry.status==='ok'?'Folders created':'Dropbox refused');
      renderFolders();
    })
    .catch(function(){
      // No endpoint yet — leave it queued and keep the wording honest.
      entry.status='wait';
      entry.msg='Awaiting award sweep';
      renderFolders();
    });
  }

  function renderFolders(){
    el('fCount').textContent=pendingFolders.length;
    var src=el('fSrc');
    src.className='srcpill '+(dropboxLive?'live':'manual');
    src.textContent=dropboxLive?'Dropbox live':'Manual sweep';
    el('fNote').textContent=dropboxLive
      ? 'Folders are created here as each job is awarded, and the PO scan is moved out of JOBSHOP/INBOX/ automatically.'
      : 'Dropbox isn\u2019t connected to the terminal yet, so folder scaffolding and the PO file move still happen when you run "award sweep" in chat. Jobs awarded here are listed below so nothing gets missed.';

    var list=el('fList');
    if(!pendingFolders.length){ list.innerHTML='<div class="empty">Nothing waiting.</div>'; return; }
    list.innerHTML=pendingFolders.map(function(e){
      var cls=e.status==='ok'?'ok':e.status==='bad'?'bad':'wait';
      return '<div class="fitem"><div class="fmain"><b>'+esc(e.job.part||'\u2014')+'</b> '+
        '<span>\u2014 PO '+esc(e.job.po||'\u2014')+' \u00b7 '+esc(e.job.customer||'')+'</span>'+
        '<span class="fpath">'+esc(dropboxPath(e.job))+'</span></div>'+
        '<span class="fpill '+cls+'">'+esc(e.msg)+'</span></div>';
    }).join('');
  }

  // ---------------- OFFBOARD ----------------
  var obFilter='open', obSelId=null;

  function jobStatus(j){
    if(j.paidAt) return 'paid';
    if(j.invoice) return 'unpaid';
    return 'noinv';
  }
  // Offboarding only applies to work that's actually finished — a job still on
  // the floor isn't ready to close, no matter what its money state says.
  function finished(j){ return (j.stage||1)>=6; }
  function obPool(){
    return JOBS.filter(finished).sort(function(a,b){
      return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
    });
  }
  function obFiltered(){
    var pool=obPool();
    if(obFilter==='open')   return pool.filter(function(j){return !j.paidAt;});
    if(obFilter==='noinv')  return pool.filter(function(j){return jobStatus(j)==='noinv';});
    if(obFilter==='unpaid') return pool.filter(function(j){return jobStatus(j)==='unpaid';});
    return pool.filter(function(j){return jobStatus(j)==='paid';});
  }

  Array.prototype.forEach.call(document.querySelectorAll('.obchip'),function(b){
    b.onclick=function(){
      obFilter=b.getAttribute('data-f');
      Array.prototype.forEach.call(document.querySelectorAll('.obchip'),function(x){
        x.classList.toggle('on',x===b);
      });
      renderOffboard();
    };
  });

  function renderOffboard(){
    var pool=obPool();
    var counts={
      open:pool.filter(function(j){return !j.paidAt;}).length,
      noinv:pool.filter(function(j){return jobStatus(j)==='noinv';}).length,
      unpaid:pool.filter(function(j){return jobStatus(j)==='unpaid';}).length,
      paid:pool.filter(function(j){return jobStatus(j)==='paid';}).length
    };
    Array.prototype.forEach.call(document.querySelectorAll('.obchip'),function(b){
      var i=b.querySelector('i');
      if(i) i.textContent=counts[b.getAttribute('data-f')]||0;
    });

    var rows=obFiltered();
    var list=el('obList');
    if(!rows.length){
      list.innerHTML='<div class="obnone">Nothing here. Jobs show up once they reach Ship.</div>';
    }else{
      list.innerHTML=rows.map(function(j){
        var st=jobStatus(j);
        var flag=st==='noinv'?'NOT INVOICED':st==='unpaid'?('INV '+esc(j.invoice)):'PAID';
        var val=(j.qty!=null&&j.price!=null)?money(j.qty*j.price):'\u2014';
        return '<button class="obrow s-'+st+(j.id===obSelId?' sel':'')+'" data-id="'+esc(j.id)+'">'+
          '<span class="obj"><b>'+esc(j.part||'\u2014')+'</b>'+
          '<span>PO '+esc(j.po||'\u2014')+' \u00b7 '+esc(j.customer||'')+' \u00b7 '+val+'</span></span>'+
          '<span class="obf">'+flag+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(list.querySelectorAll('.obrow'),function(b){
        b.onclick=function(){ obSelId=b.getAttribute('data-id'); renderOffboard(); };
      });
    }

    var sel=JOBS.filter(function(j){return j.id===obSelId;})[0];
    // A job can drop out of the current filter after it's updated (paying it
    // moves it from "awaiting payment" to "closed"), so keep the panel on it
    // rather than blanking the screen mid-closeout.
    el('obNone').hidden=!!sel;
    el('obPanel').hidden=!sel;
    if(sel) renderObPanel(sel);
  }

  function renderObPanel(j){
    var st=jobStatus(j);
    var val=(j.qty!=null&&j.price!=null)?money(j.qty*j.price):null;
    var seq=j.dadJob?'DAD JOB sequence (5005+)':'Main sequence (1053+)';

    function step(done,label){
      return '<div class="obstep '+(done?'done':'todo')+'"><span class="d"></span>'+
        '<span class="l">'+label+'</span></div>';
    }

    el('obPanel').innerHTML=
      '<div class="obhd">'+esc(j.part||'\u2014')+'</div>'+
      '<div class="obsub">PO '+esc(j.po||'\u2014')+' \u00b7 '+esc(custLabel(j.customer))+
        (val?(' \u00b7 '+val):'')+'<br>'+esc(seq)+'</div>'+

      '<div class="obsteps">'+
        step(j.qty!=null&&j.price!=null,'Qty and price on the record')+
        step(!!j.invoice, j.invoice?('Invoiced \u2014 '+esc(j.invoice)):'Invoice number')+
        step(!!j.paidAt,  j.paidAt?('Paid '+esc(String(j.paidAt).slice(0,10))):'Payment received')+
        step(false,'Folders archived')+
      '</div>'+

      '<div class="field"><label>Invoice number</label>'+
        '<input type="text" id="obInv" value="'+esc(j.invoice||'')+'" placeholder="1053"></div>'+
      '<div class="field"><label>Paid on</label>'+
        '<input type="date" id="obPaid" value="'+esc(j.paidAt?String(j.paidAt).slice(0,10):'')+'"></div>'+

      '<div class="obacts">'+
        '<button class="obbtn" data-ob="today">Paid today</button>'+
        '<button class="obbtn" data-ob="clearpaid">Clear date</button>'+
        '<button class="obbtn go wide" data-ob="save">Save closeout</button>'+
        '<button class="obbtn wide" data-ob="archive">Archive folders</button>'+
      '</div>'+
      '<div class="obstat" id="obStat"></div>';

    Array.prototype.forEach.call(el('obPanel').querySelectorAll('[data-ob]'),function(b){
      b.onclick=function(){
        var a=b.getAttribute('data-ob');
        if(a==='today') el('obPaid').value=new Date().toISOString().slice(0,10);
        else if(a==='clearpaid') el('obPaid').value='';
        else if(a==='save') saveCloseout(j);
        else if(a==='archive') archiveFolders(j);
      };
    });
  }

  function saveCloseout(j){
    var stat=el('obStat');
    var inv=el('obInv').value.trim()||null;
    var paid=el('obPaid').value||null;

    // Same rule api/jobs.js enforces — it rejects paid-without-invoice with a
    // 400, so catch it here and say why instead of showing a bare failure.
    if(paid&&!inv){
      stat.textContent='Needs an invoice number before it can be marked paid';
      stat.className='obstat bad';
      return;
    }
    stat.textContent='Saving\u2026'; stat.className='obstat busy';

    fetch('/api/jobs',{
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:j.id,invoice:inv,paidAt:paid})
    })
    .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(saved){
      for(var i=0;i<JOBS.length;i++) if(JOBS[i].id===saved.id) JOBS[i]=saved;
      // api/jobs.js silently drops an attempt to null out an existing invoice
      // number — the double-billing guard — so report that rather than "Saved".
      if(inv===null&&saved.invoice){
        stat.textContent='Saved \u2014 invoice number can\u2019t be cleared once set';
        stat.className='obstat bad';
      }else{
        stat.textContent='Saved';
        stat.className='obstat ok';
      }
      renderOffboard();
    })
    .catch(function(){ stat.textContent='Didn\u2019t save \u2014 try again'; stat.className='obstat bad'; });
  }

  // Second half of the Dropbox seam. Archiving is the offboard mirror of
  // provisioning: same endpoint, same honest fallback while it's absent.
  function archiveFolders(j){
    var stat=el('obStat');
    stat.textContent='Archiving\u2026'; stat.className='obstat busy';
    fetch('/api/dropbox',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'archive',customer:j.customer,part:j.part,po:j.po})
    })
    .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(){
      dropboxLive=true;
      stat.textContent='Folders archived'; stat.className='obstat ok';
      renderFolders();
    })
    .catch(function(){
      stat.textContent='Dropbox isn\u2019t connected yet \u2014 archive it by hand for now';
      stat.className='obstat bad';
    });
  }

  // ---------------- load ----------------
  function load(){
    return fetch('/api/jobs',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(jobs){
        JOBS=Array.isArray(jobs)?jobs:[];
        paintCustomers();
        if(!el('deskOffboard').hidden) renderOffboard();
      })
      .catch(function(){ paintCustomers(); });
  }

  // ---------------- flag an issue ----------------
  var issueWrap=el('issueWrap'),chatLog=el('chatLog'),chatText=el('chatText');
  el('issueToggle').addEventListener('click',function(){issueWrap.classList.toggle('open');});

  var pendingImage=null;
  el('chatAttach').addEventListener('click',function(){el('chatFile').click();});
  el('chatFile').addEventListener('change',function(){
    var f=this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      pendingImage={data:r.result.split(',')[1],media_type:f.type||'image/jpeg'};
      addMsg('me','Attached: '+f.name);
      var img=document.createElement('img');
      img.className='thumb'; img.src=r.result;
      chatLog.lastChild.appendChild(img);
      scrollChat();
    };
    r.readAsDataURL(f);
  });
  el('chatSend').addEventListener('click',sendChat);
  chatText.addEventListener('keydown',function(e){if(e.key==='Enter') sendChat();});

  function addMsg(who,text){
    var m=document.createElement('div');
    m.className='msg '+who;
    m.innerHTML='<span class="who">'+(who==='me'?'You':who==='ai'?'Claude':'')+'</span>'+esc(text);
    chatLog.appendChild(m);
    scrollChat();
    return m;
  }
  function scrollChat(){chatLog.scrollTop=chatLog.scrollHeight;}

  function sendChat(){
    var text=chatText.value.trim();
    if(!text&&!pendingImage) return;
    if(text) addMsg('me',text);
    chatText.value='';
    var content=[];
    if(pendingImage) content.push({type:'image',source:{type:'base64',
      media_type:pendingImage.media_type,data:pendingImage.data}});
    content.push({type:'text',text:text||'Read this PO and pull out the part number(s), PO number, qty, and unit price. Reply in plain sentences, then a fenced json block with any of {part,po,qty,price,customer} you\'re confident about.'});
    pendingImage=null;

    var thinking=addMsg('ai','\u2026thinking');
    fetch('/api/claude',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:content}]})
    }).then(function(r){
      if(!r.ok) throw new Error('no endpoint');
      return r.json();
    }).then(function(data){
      thinking.remove();
      var reply=(data.content||[]).filter(function(b){return b.type==='text';})
        .map(function(b){return b.text;}).join('\n');
      handleReply(reply);
    }).catch(function(){
      thinking.remove();
      addMsg('sys','(no /api/claude on this preview \u2014 this call is real once deployed)');
    });
  }

  function handleReply(reply){
    var m=reply.match(/```json\s*([\s\S]*?)```/);
    var plain=reply.replace(/```json[\s\S]*?```/,'').trim();
    var msgEl=addMsg('ai',plain||reply);
    if(!m) return;
    try{
      var fields=JSON.parse(m[1]);
      var btn=document.createElement('button');
      btn.className='usebtn'; btn.textContent='Use these values \u2192';
      btn.onclick=function(){
        if(fields.part){el('fPart').value=fields.part;state.part=fields.part;}
        if(fields.po){el('fPO').value=fields.po;state.po=fields.po;}
        if(fields.qty){el('fQty').value=fields.qty;state.qty=fields.qty;}
        if(fields.price){el('fPrice').value=fields.price;state.price=fields.price;}
        if(fields.customer){
          state.cust=fields.customer;
          // An unseen customer has no <option> yet, so add it before selecting.
          if(customerList().indexOf(fields.customer)<0) SEED_CUSTOMERS.push(fields.customer);
          paintCustomers();
          el('fCust').value=fields.customer;
          el('newCustWrap').hidden=true;
        }
        refreshPreview();
        issueWrap.classList.remove('open');
      };
      msgEl.appendChild(btn);
    }catch(e){}
  }

  paintCustomers();
  refreshPreview();
  renderFolders();
  load();
})();
</script>
