<!-- qc_inspection.html | Stealth R&D | v1.1.0 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* brand accent */
    --accent: #9233E6;
    --accent-light: #A855F7;
    --accent-deep: #6B21C4;
    --accent-glow: rgba(146,51,230,.13);
    --accent-tint: rgba(146,51,230,.11);
    --silver: #CCCCCC;

    /* surfaces */
    --bg: #232327;
    --panel: #2C2C31;
    --panel-2: #35353B;
    --input-bg: #060606;

    /* lines */
    --line: #43434B;
    --line-hot: #55555F;

    /* type */
    --ink: #F4F4F6;
    --ink-dim: #A6A6B2;
    --ink-faint: #7D7D89;
    --on-accent: #060606;

    /* status */
    --pass: #4ADE80;
    --fail: #F87171;
    --warn: #F0B429;
    --live: var(--pass);
    --pass-tint: rgba(74,222,128,.11);
    --warn-tint: rgba(240,180,41,.11);
    --fail-tint: rgba(248,113,113,.11);

    --focus-glow: 0 0 0 3px var(--accent-glow);
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --disp: 'Barlow Condensed', 'Oswald', system-ui, sans-serif;
  }

  html { background: transparent; }

  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  /* This tool is iframed into terminal.html, which paints the dithered shop
     background behind it. .wrap is the readable surface that floats on top —
     tinted + blurred where the browser supports it, solid where it doesn't,
     so text always keeps a clear backing. */
  .wrap {
    max-width: 880px; margin: 0 auto; padding: 0 0 80px;
    min-height: 100vh; position: relative;
    background: rgba(35,35,39,.95);
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .wrap {
      background: rgba(35,35,39,.80);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
    }
  }

  /* ---------- header ---------- */
  .hdr {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 0;
    overflow: hidden;
  }
  .hdr::before{content:'';position:absolute;inset:-30%;
    background-image:
      radial-gradient(ellipse 55% 65% at 78% 15%, rgba(168,85,247,.30), transparent 62%),
      radial-gradient(ellipse 50% 55% at 15% 95%, rgba(107,33,196,.22), transparent 60%);
    filter:blur(18px);animation:hdrAura 19s ease-in-out infinite alternate;pointer-events:none}
  .hdr::after{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 100% at 50% -10%, rgba(168,85,247,.14), transparent 70%);
    animation:hdrFlick 9s steps(1,end) infinite;pointer-events:none}
  @keyframes hdrAura{from{transform:translate(0,0)}to{transform:translate(4%,3%)}}
  @keyframes hdrFlick{0%,100%{opacity:.5}3%{opacity:.92}4.5%{opacity:.38}41%{opacity:.6}42%{opacity:.95}43.5%{opacity:.5}76%{opacity:.72}77%{opacity:.42}}
  @keyframes ledFlicker{0%,88%,100%{opacity:1}90%{opacity:.35}92%{opacity:1}94%{opacity:.5}}
  .hdr > * { position: relative; z-index: 1; }

  .hdr-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hdr-part {
    font-family: var(--disp); font-size: 30px; font-weight: 700;
    letter-spacing: .02em; line-height: 1; text-transform: uppercase;
    color: var(--silver);
  }
  .hdr-meta { font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; }
  .hdr-meta b { color: var(--ink); font-weight: 500; }
  .hdr-ver, .ver { margin-left: auto; font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; }

  .tabs { display: flex; gap: 2px; margin-top: 14px; }
  .tab {
    flex: 1; padding: 11px 8px; text-align: center; cursor: pointer;
    font-family: var(--disp); font-size: 15px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint); background: none; border: none;
    border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--accent-light); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent), var(--focus-glow); }

  /* ---------- generic ---------- */
  .pane { padding: 18px 16px; }
  .pane[hidden] { display: none; }

  .eyebrow {
    font-family: var(--disp); font-size: 12px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint);
    margin: 0 0 10px; display: flex; align-items: center; gap: 11px;
  }
  .eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  label { display: block; font-size: 10px; letter-spacing: .08em; color: var(--ink-dim); margin-bottom: 5px; text-transform: uppercase; }

  input, select {
    width: 100%; background: var(--input-bg); border: 1px solid var(--line);
    color: var(--ink); font-family: var(--mono); font-size: 15px;
    padding: 10px 11px; border-radius: 3px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-glow); }
  input::placeholder { color: var(--ink-faint); }

  .grid { display: grid; gap: 10px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g4 { grid-template-columns: repeat(4, 1fr); }

  button.act {
    font-family: var(--disp); font-size: 15px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent);
    padding: 12px 18px; border-radius: 3px; cursor: pointer;
  }
  button.act:hover { background: var(--accent-light); border-color: var(--accent-light); }
  button.act:active { transform: translateY(1px); }
  button.ghost {
    background: none; color: var(--ink-dim); border: 1px solid var(--line);
  }
  button.ghost:hover { background: var(--panel-2); color: var(--ink); border-color: var(--line-hot); }
  button.sm { font-size: 12px; padding: 7px 12px; }
  button:disabled { background: var(--panel-2); color: var(--ink-faint); border-color: var(--line); cursor: not-allowed; opacity: .6; }
  button.act:focus-visible, button.ghost:focus-visible { outline: none; box-shadow: var(--focus-glow); border-color: var(--accent); }

  /* ---------- bubble list ---------- */
  .bub {
    display: grid; grid-template-columns: 44px 1fr 90px 74px 74px 34px;
    gap: 8px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .bub-n {
    font-family: var(--disp); font-size: 19px; font-weight: 700;
    background: var(--panel-2); border: 1px solid var(--line-hot);
    border-radius: 50%; width: 34px; height: 34px;
    display: grid; place-items: center; color: var(--accent-light);
  }
  .bub-head {
    font-size: 10px; letter-spacing: .1em; color: var(--ink-faint);
    text-transform: uppercase; border-bottom: 1px solid var(--line-hot); padding-bottom: 6px;
  }
  .x {
    background: none; border: none; color: var(--ink-faint);
    font-size: 20px; cursor: pointer; padding: 0; line-height: 1;
  }
  .x:hover { color: var(--fail); }
  button:focus-visible { outline: none; box-shadow: var(--focus-glow); border-color: var(--accent); }

  /* ---------- inspect ---------- */
  .partbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .partbar button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--disp); font-size: 22px; font-weight: 700;
    width: 46px; height: 46px; border-radius: 3px; cursor: pointer;
  }
  .partnum {
    flex: 1; text-align: center;
  }
  .partnum .lbl { font-size: 10px; letter-spacing: .16em; color: var(--ink-faint); text-transform: uppercase; }
  .partnum .val { font-family: var(--disp); font-size: 34px; font-weight: 700; line-height: 1.05; }

  .dimcard {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px; margin-bottom: 10px;
  }
  .dimcard.pass { border-color: rgba(74,222,128,.5); }
  .dimcard.fail { border-color: var(--fail); }

  .dim-top { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .dim-desc { flex: 1; font-size: 13px; color: var(--ink-dim); }
  .dim-spec { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  .readout { display: flex; align-items: center; gap: 12px; }
  .readout input {
    font-size: 26px; font-weight: 500; letter-spacing: .04em;
    text-align: right; padding: 12px 13px; background: var(--input-bg);
    border-color: var(--line-hot);
  }
  .verdict {
    font-family: var(--disp); font-size: 15px; font-weight: 700;
    letter-spacing: .12em; width: 62px; text-align: center; flex-shrink: 0;
  }
  .verdict.pass { color: var(--pass); text-shadow: 0 0 14px rgba(74,222,128,.45); }
  .verdict.fail { color: var(--fail); text-shadow: 0 0 14px rgba(248,113,113,.5); animation: ledFlicker 3.2s steps(1,end) infinite; }
  .verdict.none { color: var(--ink-faint); }

  /* signature: tolerance band */
  .band { margin-top: 12px; height: 26px; position: relative; }
  .band-track {
    position: absolute; left: 0; right: 0; top: 11px; height: 4px;
    background: var(--panel-2); border-radius: 2px; overflow: hidden;
  }
  .band-in {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(74,222,128,.25), rgba(74,222,128,.5), rgba(74,222,128,.25));
  }
  .band-mid { position: absolute; top: 5px; width: 1px; height: 16px; background: var(--line-hot); }
  .band-mark {
    position: absolute; top: 3px; width: 3px; height: 20px;
    background: var(--accent); border-radius: 1px; box-shadow: 0 0 12px rgba(146,51,230,.85);
    transition: left .12s ease-out;
  }
  .band-mark.fail { background: var(--fail); box-shadow: 0 0 12px rgba(248,113,113,.9); }
  .band-lbl {
    position: absolute; top: 19px; font-size: 9px; color: var(--ink-faint);
    letter-spacing: .06em;
  }

  .devi { font-size: 11px; color: var(--ink-faint); margin-top: 3px; text-align: right; }

  /* ---------- report ---------- */
  .sum { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 11px 12px; }
  .stat .n { font-family: var(--disp); font-size: 27px; font-weight: 700; line-height: 1; }
  .stat .k { font-size: 9px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; margin-top: 4px; }

  .tbl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { background: var(--panel-2); color: var(--ink-dim); font-weight: 500; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; position: sticky; top: 0; }
  td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
  th:first-child { background: var(--panel-2); z-index: 2; }
  td.f { color: var(--fail); font-weight: 600; }
  td.p { color: var(--ink); }
  td.e { color: var(--ink-faint); }

  .empty { color: var(--ink-faint); font-size: 13px; padding: 30px 0; text-align: center; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line-hot); border-left: 3px solid var(--accent);
    padding: 10px 18px; border-radius: 3px; font-size: 13px; color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90%; text-align: center;
  }
  .toast.on { opacity: 1; }

  .row-btns, .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  @media (max-width: 560px) {
    .bub { grid-template-columns: 38px 1fr 76px 62px 62px 30px; gap: 6px; font-size: 13px; }
    .g4 { grid-template-columns: 1fr 1fr; }
    .sum { grid-template-columns: 1fr 1fr; }
    .hdr-part { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-part" id="hPart">NO JOB</div>
      <div class="hdr-meta" id="hMeta"></div>
      <div class="hdr-ver">v1.1.0</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-t="setup">Setup</button>
      <button class="tab" role="tab" aria-selected="false" data-t="inspect">Inspect</button>
      <button class="tab" role="tab" aria-selected="false" data-t="report">Report</button>
    </div>
  </div>

  <!-- SETUP -->
  <div class="pane" id="p-setup">
    <p class="eyebrow">Job</p>
    <div class="grid g4" style="margin-bottom:20px">
      <div><label>Part</label><input id="jPart" placeholder="516-39"></div>
      <div><label>PO</label><input id="jPO" placeholder="15900"></div>
      <div><label>Rev</label><input id="jRev" placeholder="D"></div>
      <div><label>Qty</label><input id="jQty" type="number" inputmode="numeric" placeholder="40"></div>
    </div>

    <p class="eyebrow">Bubbles</p>
    <div class="bub" style="border-bottom-color:var(--line-hot)">
      <div class="bub-head">#</div>
      <div class="bub-head">Feature</div>
      <div class="bub-head">Nominal</div>
      <div class="bub-head">+ Tol</div>
      <div class="bub-head">&minus; Tol</div>
      <div></div>
    </div>
    <div id="bubList"></div>
    <div class="row-btns">
      <button class="act ghost" id="addBub">+ Add bubble</button>
      <button class="act" id="startBtn">Start inspection</button>
    </div>
  </div>

  <!-- INSPECT -->
  <div class="pane" id="p-inspect" hidden>
    <div class="partbar">
      <button id="prevPart" aria-label="Previous part">&lsaquo;</button>
      <div class="partnum">
        <div class="lbl">Part</div>
        <div class="val"><span id="curPart">1</span> <span style="color:var(--ink-faint);font-size:20px">/ <span id="totPart">1</span></span></div>
      </div>
      <button id="nextPart" aria-label="Next part">&rsaquo;</button>
    </div>
    <div id="dimList"></div>
    <div class="row-btns">
      <button class="act" id="savePart">Save &amp; next part</button>
    </div>
  </div>

  <!-- REPORT -->
  <div class="pane" id="p-report" hidden>
    <div class="sum">
      <div class="stat"><div class="n" id="sInsp">0</div><div class="k">Parts checked</div></div>
      <div class="stat"><div class="n" id="sDims">0</div><div class="k">Readings</div></div>
      <div class="stat"><div class="n" id="sFail" style="color:var(--fail)">0</div><div class="k">Out of tol</div></div>
      <div class="stat"><div class="n" id="sRate" style="color:var(--pass)">&mdash;</div><div class="k">Pass rate</div></div>
    </div>
    <div id="repBody"></div>
    <div class="row-btns">
      <button class="act ghost" id="csvBtn">Export CSV</button>
      <button class="act ghost" id="printBtn">Print</button>
      <button class="act ghost" id="clearBtn">Clear readings</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var VERSION = '1.1.0';
  var KEY = 'qc:job';

  /* Special characters are written as numeric escapes so the source stays pure
     ASCII. A missing charset declaration used to render these as mojibake. */
  var DASH   = '\u2014';  /* em dash */

  /* storage: window.storage inside Claude artifacts, localStorage when opened from disk */
  var STORE=(function(){
    var hasWS=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
    return {
      get:function(k){
        if(hasWS)return window.storage.get(k);
        try{var v=localStorage.getItem(k);return Promise.resolve(v?{key:k,value:v}:null)}
        catch(e){return Promise.resolve(null)}
      },
      set:function(k,v){
        if(hasWS)return window.storage.set(k,v);
        try{localStorage.setItem(k,v);return Promise.resolve({key:k,value:v})}
        catch(e){return Promise.resolve(null)}
      }
    };
  })();

  var job = { part:'', po:'', rev:'', qty:1, bubbles:[], readings:{}, cur:1 };
  var bubSeq = 0;

  var $ = function(id){ return document.getElementById(id); };

  function toast(m){
    var t = $('toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(t._x); t._x = setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  function save(){
    try { STORE.set(KEY, JSON.stringify(job)).catch(function(){}); } catch(e){}
  }

  function load(){
    try {
      STORE.get(KEY).then(function(r){
        if (r && r.value) { job = JSON.parse(r.value); hydrate(); }
      }).catch(function(){ renderBubbles(); });
    } catch(e){ renderBubbles(); }
  }

  function hydrate(){
    $('jPart').value = job.part || '';
    $('jPO').value = job.po || '';
    $('jRev').value = job.rev || '';
    $('jQty').value = job.qty || '';
    job.bubbles.forEach(function(b){ if (b.id > bubSeq) bubSeq = b.id; });
    renderBubbles(); renderHeader(); renderDims(); renderReport();
  }

  /* ---------- setup ---------- */
  function addBubble(b){
    bubSeq++;
    job.bubbles.push(b || { id:bubSeq, n:job.bubbles.length+1, desc:'', nom:'', up:'', lo:'' });
    renderBubbles(); save();
  }

  function renderBubbles(){
    var host = $('bubList');
    host.innerHTML = '';
    if (!job.bubbles.length) {
      host.innerHTML = '<div class="empty">No bubbles yet. Add one for each dimension on the print.</div>';
      return;
    }
    job.bubbles.forEach(function(b, i){
      var row = document.createElement('div');
      row.className = 'bub';
      row.innerHTML =
        '<div class="bub-n">' + (i+1) + '</div>' +
        '<input data-k="desc" placeholder="OD / bore / length" value="' + esc(b.desc) + '">' +
        '<input data-k="nom" inputmode="decimal" placeholder="1.2500" value="' + esc(b.nom) + '">' +
        '<input data-k="up" inputmode="decimal" placeholder=".005" value="' + esc(b.up) + '">' +
        '<input data-k="lo" inputmode="decimal" placeholder=".005" value="' + esc(b.lo) + '">' +
        '<button class="x" aria-label="Remove bubble ' + (i+1) + '">&times;</button>';
      row.querySelectorAll('input').forEach(function(inp){
        inp.addEventListener('input', function(){
          b[inp.dataset.k] = inp.value; save();
        });
      });
      row.querySelector('.x').addEventListener('click', function(){
        job.bubbles.splice(i,1);
        job.bubbles.forEach(function(x,j){ x.n = j+1; });
        renderBubbles(); renderDims(); renderReport(); save();
      });
      host.appendChild(row);
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function readJob(){
    job.part = $('jPart').value.trim();
    job.po   = $('jPO').value.trim();
    job.rev  = $('jRev').value.trim();
    job.qty  = Math.max(1, parseInt($('jQty').value,10) || 1);
  }

  function renderHeader(){
    $('hPart').textContent = job.part ? job.part : 'NO JOB';
    var bits = [];
    if (job.po)  bits.push('PO <b>' + esc(job.po) + '</b>');
    if (job.rev) bits.push('REV <b>' + esc(job.rev) + '</b>');
    if (job.qty) bits.push('QTY <b>' + job.qty + '</b>');
    $('hMeta').innerHTML = bits.join(' &nbsp;/&nbsp; ');
  }

  /* ---------- limits ---------- */
  function limits(b){
    var nom = parseFloat(b.nom);
    if (isNaN(nom)) return null;
    var up = parseFloat(b.up); if (isNaN(up)) up = 0;
    var lo = parseFloat(b.lo); if (isNaN(lo)) lo = 0;
    return { nom:nom, min:nom - Math.abs(lo), max:nom + Math.abs(up) };
  }

  function key(part, bid){ return part + ':' + bid; }

  /* ---------- inspect ---------- */
  function renderDims(){
    $('curPart').textContent = job.cur;
    $('totPart').textContent = job.qty || 1;
    var host = $('dimList');
    host.innerHTML = '';
    if (!job.bubbles.length) {
      host.innerHTML = '<div class="empty">Add bubbles in Setup first.</div>';
      return;
    }
    job.bubbles.forEach(function(b, i){
      var L = limits(b);
      var val = job.readings[key(job.cur, b.id)];
      var card = document.createElement('div');
      card.className = 'dimcard';

      var spec = L
        ? L.min.toFixed(4) + ' &ndash; ' + L.max.toFixed(4)
        : 'no spec';

      card.innerHTML =
        '<div class="dim-top">' +
          '<div class="bub-n">' + (i+1) + '</div>' +
          '<div class="dim-desc">' + (esc(b.desc) || '&mdash;') + '</div>' +
          '<div class="dim-spec">' + spec + '</div>' +
        '</div>' +
        '<div class="readout">' +
          '<input inputmode="decimal" placeholder="0.0000" value="' + (val==null?'':esc(val)) + '">' +
          '<div class="verdict none">&mdash;</div>' +
        '</div>' +
        '<div class="devi"></div>' +
        '<div class="band">' +
          '<div class="band-track"><div class="band-in"></div></div>' +
          '<div class="band-mid"></div>' +
          '<div class="band-mark" hidden></div>' +
          '<div class="band-lbl band-lmin"></div>' +
          '<div class="band-lbl band-lmax" style="right:0"></div>' +
        '</div>';

      var inp = card.querySelector('input');
      var vd  = card.querySelector('.verdict');
      var dv  = card.querySelector('.devi');
      var bandIn = card.querySelector('.band-in');
      var mid = card.querySelector('.band-mid');
      var mark = card.querySelector('.band-mark');
      var lmin = card.querySelector('.band-lmin');
      var lmax = card.querySelector('.band-lmax');

      if (L) {
        // in-tolerance zone occupies middle 60% of the track
        bandIn.style.left = '20%'; bandIn.style.right = '20%';
        var midPct = 20 + ((L.nom - L.min) / (L.max - L.min || 1)) * 60;
        mid.style.left = midPct + '%';
        lmin.textContent = L.min.toFixed(4);
        lmax.textContent = L.max.toFixed(4);
      } else {
        bandIn.style.left = '0'; bandIn.style.right = '0';
        mid.hidden = true;
      }

      function paint(){
        var raw = inp.value.trim();
        if (raw === '') {
          card.className = 'dimcard'; vd.className = 'verdict none'; vd.textContent = DASH;
          dv.textContent = ''; mark.hidden = true; return;
        }
        var v = parseFloat(raw);
        if (isNaN(v) || !L) {
          card.className = 'dimcard'; vd.className = 'verdict none'; vd.textContent = DASH;
          dv.textContent = ''; mark.hidden = true; return;
        }
        var ok = v >= L.min && v <= L.max;
        card.className = 'dimcard ' + (ok ? 'pass' : 'fail');
        vd.className = 'verdict ' + (ok ? 'pass' : 'fail');
        vd.textContent = ok ? 'IN' : 'OUT';

        var d = v - L.nom;
        dv.textContent = (d >= 0 ? '+' : '') + d.toFixed(4) + ' from nominal';

        var span = (L.max - L.min) || 1;
        var pct = 20 + ((v - L.min) / span) * 60;
        pct = Math.max(1, Math.min(99, pct));
        mark.hidden = false;
        mark.style.left = pct + '%';
        mark.className = 'band-mark' + (ok ? '' : ' fail');
      }

      inp.addEventListener('input', function(){
        var raw = inp.value.trim();
        if (raw === '') delete job.readings[key(job.cur, b.id)];
        else job.readings[key(job.cur, b.id)] = raw;
        paint(); save();
      });

      inp.addEventListener('keydown', function(e){
        if (e.key === 'Enter') {
          e.preventDefault();
          var all = Array.prototype.slice.call(host.querySelectorAll('.readout input'));
          var idx = all.indexOf(inp);
          if (idx > -1 && idx < all.length - 1) all[idx+1].focus();
          else nextPart();
        }
      });

      paint();
      host.appendChild(card);
    });
  }

  function nextPart(){
    if (job.cur < (job.qty || 1)) { job.cur++; }
    else { toast('Last part reached'); return; }
    renderDims(); save();
    var f = document.querySelector('#dimList .readout input');
    if (f) f.focus();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function prevPart(){
    if (job.cur > 1) { job.cur--; renderDims(); save(); window.scrollTo({top:0,behavior:'smooth'}); }
  }

  /* ---------- report ---------- */
  function renderReport(){
    var host = $('repBody');
    if (!job.bubbles.length) {
      host.innerHTML = '<div class="empty">Nothing to report yet.</div>';
      $('sInsp').textContent = '0'; $('sDims').textContent = '0';
      $('sFail').textContent = '0'; $('sRate').textContent = DASH;
      return;
    }

    var parts = [], total = 0, fails = 0;
    for (var p = 1; p <= (job.qty||1); p++) {
      var any = false;
      job.bubbles.forEach(function(b){ if (job.readings[key(p,b.id)] != null) any = true; });
      if (any) parts.push(p);
    }

    var h = '<div class="tbl-scroll"><table><thead><tr><th>Part</th>';
    job.bubbles.forEach(function(b,i){
      h += '<th>' + (i+1) + (b.desc ? ' &middot; ' + esc(b.desc) : '') + '</th>';
    });
    h += '</tr></thead><tbody>';

    parts.forEach(function(p){
      h += '<tr><td>#' + p + '</td>';
      job.bubbles.forEach(function(b){
        var raw = job.readings[key(p,b.id)];
        if (raw == null || raw === '') { h += '<td class="e">&mdash;</td>'; return; }
        total++;
        var L = limits(b), v = parseFloat(raw);
        var bad = L && !isNaN(v) && (v < L.min || v > L.max);
        if (bad) fails++;
        h += '<td class="' + (bad?'f':'p') + '">' + esc(raw) + (bad?' &#9888;':'') + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';

    host.innerHTML = parts.length ? h : '<div class="empty">No readings recorded yet.</div>';

    $('sInsp').textContent = parts.length;
    $('sDims').textContent = total;
    $('sFail').textContent = fails;
    $('sRate').textContent = total ? Math.round((total-fails)/total*100) + '%' : DASH;
    $('sRate').style.color = fails ? 'var(--warn)' : 'var(--pass)';
  }

  /* ---------- export ---------- */
  function csv(){
    var rows = [];
    rows.push(['Part number', job.part]);
    rows.push(['PO', job.po]);
    rows.push(['Rev', job.rev]);
    rows.push(['Date', new Date().toLocaleString()]);
    rows.push(['Tool version', VERSION]);
    rows.push([]);
    var head = ['Part'];
    job.bubbles.forEach(function(b,i){
      var L = limits(b);
      head.push('#' + (i+1) + ' ' + (b.desc||'') + ' [' + (L ? L.min.toFixed(4)+'-'+L.max.toFixed(4) : 'no spec') + ']');
    });
    rows.push(head);
    for (var p = 1; p <= (job.qty||1); p++) {
      var line = ['#'+p], any = false;
      job.bubbles.forEach(function(b){
        var v = job.readings[key(p,b.id)];
        if (v != null && v !== '') any = true;
        line.push(v == null ? '' : v);
      });
      if (any) rows.push(line);
    }
    var out = rows.map(function(r){
      return r.map(function(c){
        c = String(c==null?'':c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
      }).join(',');
    }).join('\n');

    var blob = new Blob([out], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (job.part||'inspection') + '_PO' + (job.po||'') + '_inspection.csv';
    a.click();
    toast('CSV downloaded');
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected','false'); });
      t.setAttribute('aria-selected','true');
      ['setup','inspect','report'].forEach(function(n){
        $('p-'+n).hidden = (n !== t.dataset.t);
      });
      if (t.dataset.t === 'report') renderReport();
      if (t.dataset.t === 'inspect') renderDims();
    });
  });

  ['jPart','jPO','jRev','jQty'].forEach(function(id){
    $(id).addEventListener('input', function(){ readJob(); renderHeader(); save(); });
  });

  $('addBub').addEventListener('click', function(){ addBubble(); });

  $('startBtn').addEventListener('click', function(){
    readJob();
    if (!job.bubbles.length) { toast('Add at least one bubble'); return; }
    renderHeader(); renderDims(); save();
    document.querySelector('.tab[data-t="inspect"]').click();
    var f = document.querySelector('#dimList .readout input');
    if (f) f.focus();
  });

  $('nextPart').addEventListener('click', nextPart);
  $('prevPart').addEventListener('click', prevPart);
  $('savePart').addEventListener('click', function(){ save(); toast('Saved'); nextPart(); });
  $('csvBtn').addEventListener('click', csv);
  $('printBtn').addEventListener('click', function(){ window.print(); });
  $('clearBtn').addEventListener('click', function(){
    if (!confirm('Clear all readings? Bubbles and job info stay.')) return;
    job.readings = {}; job.cur = 1;
    renderDims(); renderReport(); save(); toast('Readings cleared');
  });

  load();
  renderBubbles();
  renderHeader();
})();
</script>
