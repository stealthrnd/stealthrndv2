  // ---- LANES -----------------------------------------------------
  STAGES.forEach(function(s,i){
    var lane=document.createElement('div');
    lane.className='lane';
    lane.innerHTML='<button class="node"></button><div class="fanUp"></div><div class="fanDown"></div>';
    flow.appendChild(lane);
    laneEls.push(lane);
    lane.querySelector('.node').addEventListener('click',function(ev){
      ev.stopPropagation();
      if(window.innerWidth<=700&&!openState[i]){
        STAGES.forEach(function(x,j){if(j!==i)openState[j]=false;});
        renderAll();
      }
      openState[i]=!openState[i];
      renderLane(i);
    });
    nodeEls.push(lane.querySelector('.node'));
  });

  // Hover and wheel hit-test against lane geometry, with one exception: if the
  // pointer is actually on a card, that card's own lane wins. The fan spreads far
  // enough right to overhang the next lane, so pure x-geometry meant reaching for
  // the second card in a stack flipped the peek to the neighbouring station and
  // the stack you were reaching for vanished out from under the cursor.
  // How much of a lane's width counts as its "capture" zone, centred on the node.
  // Below 1.0 this leaves a dead gutter between lanes: drifting into the gutter
  // holds whatever lane you're already on instead of immediately switching. Lower
  // = stickier / harder to leave a lane by accident. 1.0 restores edge-to-edge.
  var LANE_CORE=0.45;
  // Grace margin in px around the fan's real extent. Bigger = more forgiving when
  // the pointer slips off the edge of a card. X is generous, Y deliberately tight —
  // the fan should own the space beside the cards, not the rail above them.
  var FAN_PAD=34;
  var FAN_PAD_Y=10;

  // Fan geometry lives in one place so the hit zone and the drawing can't drift
  // apart. CARD_W must match .card width in the stylesheet.
  var CARD_W=216;
  function fanMetrics(i){
    var built=laneCards[i]||[];
    var n=built.length;
    if(!n)return null;
    var openNow=!!openState[i];
    return {
      n:n, open:openNow,
      reveal:openNow?1:0.78,
      step:openNow?(n>6?26:34):30,
      base:openNow?30:24,
      scale:openNow?1:0.86
    };
  }
  // Horizontal extent the fan actually occupies on screen, plus the vertical band
  // the cards really sit in. The span is generous left-to-right — that's the whole
  // point — but it must not claim the empty air above or below the stack, or the
  // rail itself stops responding while a wide fan is open.
  function fanSpan(i){
    var m=fanMetrics(i);
    if(!m)return null;
    if(!(openState[i]||peekState[i]))return null;
    var built=laneCards[i];
    var fi=((focusIdx[i]||0)%m.n+m.n)%m.n;
    var fEl=built[fi]&&built[fi].el;
    if(!fEl)return null;
    var fr=fEl.getBoundingClientRect();
    if(!fr.height)return null;

    var r=laneEls[i].getBoundingClientRect();
    var cx=r.left+r.width/2;
    var minTx=(0-fi)*m.step*m.reveal;
    var maxTx=(m.n-1-fi)*m.step*m.reveal;
    var half=(CARD_W*m.scale)/2;

    // cards step away from the centre line as they get further from focus
    var maxAd=Math.max(fi,m.n-1-fi);
    var spread=maxAd*7*m.reveal;
    var up=(STAGES[i].dir==='up');
    return {
      left:cx+minTx-half, right:cx+maxTx+half,
      top:   fr.top    - (up?spread:0) - FAN_PAD_Y,
      bottom:fr.bottom + (up?0:spread) + FAN_PAD_Y
    };
  }

  function currentLane(){
    for(var j=0;j<STAGES.length;j++)if(peekState[j])return j;
    for(var k=0;k<STAGES.length;k++)if(openState[k])return k;
    return -1;
  }
  function laneAt(clientX,sticky){
    var cur=-1;
    for(var i=0;i<laneEls.length;i++){
      var r=laneEls[i].getBoundingClientRect();
      if(clientX>=r.left&&clientX<r.right){cur=i;break;}
    }
    if(cur<0)return -1;
    var rr=laneEls[cur].getBoundingClientRect();
    var inset=rr.width*(1-LANE_CORE)/2;
    // Inside the core band: this lane takes the hover outright.
    if(clientX>=rr.left+inset&&clientX<rr.right-inset)return cur;
    // In the gutter: hold the lane we're already on rather than flipping. Only
    // when nothing is active does a gutter position claim a lane at all.
    if(sticky!=null&&sticky>=0)return sticky;
    return cur;
  }
  function laneFor(e){
    var el=e.target&&e.target.closest?e.target.closest('.card'):null;
    if(el&&el._lane!=null) return el._lane;
    var cur=currentLane();
    // Anywhere over the open fan — including the gaps between cards and a grace
    // margin past either end — stays with that lane. Sliding off the left edge of
    // the focused card no longer dumps you into the previous station.
    if(cur>=0){
      var sp=fanSpan(cur);
      if(sp&&e.clientX>=sp.left-FAN_PAD&&e.clientX<=sp.right+FAN_PAD&&
            e.clientY>=sp.top&&e.clientY<=sp.bottom) return cur;
    }
    return laneAt(e.clientX,cur);
  }
  flow.addEventListener('mousemove',function(e){
    var i=laneFor(e);
    // Only the lanes whose peek state actually flipped get rebuilt. renderAll()
    // here meant six lanes of DOM churn every time the pointer crossed a boundary.
    for(var j=0;j<STAGES.length;j++){
      var want=(j===i);
      if(!!peekState[j]!==want){peekState[j]=want;renderLane(j);}
    }
    // Hover-to-browse. Deliberately driven from mousemove rather than each card's
    // own mouseenter: focusing a card slides it to centre, which drops a different
    // card under the cursor — with mouseenter that fires again and the stack
    // shuffles on its own. mousemove only fires when the pointer really moves.
    if(i<0)return;
    var el=e.target&&e.target.closest?e.target.closest('.card'):null;
    if(!el||el._lane!==i||el._idx==null)return;
    if(focusIdx[i]===el._idx)return;
    focusIdx[i]=el._idx;
    positionLane(i,true);
    clearTimeout(laneSettle[i]);
    laneSettle[i]=setTimeout(function(){refreshFocusActs(i);},170);
  });
  // Click the empty board to close any open stage. Cards and nodes stop propagation
  // themselves, so anything reaching here is genuinely background.
  flow.addEventListener('click',function(e){
    if(e.target.closest&&(e.target.closest('.card')||e.target.closest('.node')))return;
    var changed=false;
    for(var j=0;j<STAGES.length;j++){
      if(openState[j]){openState[j]=false;changed=true;}
    }
    if(changed)renderAll();
  });

  flow.addEventListener('mouseleave',function(){
    for(var j=0;j<STAGES.length;j++){
      if(peekState[j]){peekState[j]=false;renderLane(j);}
    }
  });
  // Wheel riffling: strictly one card per notch, in order. Browsers report wildly
  // different deltaY per physical notch (3 on some trackpads, 300 on some mice), so
  // dividing by a fixed notch size meant one flick could jump three cards — that's
  // what read as random. Magnitude is now ignored entirely; only direction counts.
  var wheelAcc={}, wheelRAF={}, wheelIdle={}, wheelLast={};
  flow.addEventListener('wheel',function(e){
    var i=laneFor(e);
    if(i<0) return;
    if(!(openState[i]||peekState[i])) return;
    var n=stageCards(i+1).length;
    if(n<2) return;
    e.preventDefault();

    var now=(window.performance&&performance.now)?performance.now():Date.now();
    // A gap means a new gesture: drop leftover delta so it can't carry over.
    if(now-(wheelLast[i]||0)>160) wheelAcc[i]=0;
    wheelLast[i]=now;

    wheelAcc[i]=(wheelAcc[i]||0)+(e.deltaMode===1?e.deltaY*16:e.deltaY);

    var TH=40;
    if(Math.abs(wheelAcc[i])<TH) return;
    var dir=wheelAcc[i]>0?1:-1;
    wheelAcc[i]=0;                       // reset, don't subtract — no accumulation
    focusIdx[i]=(((focusIdx[i]||0)+dir)%n+n)%n;

    if(!wheelRAF[i]){
      wheelRAF[i]=requestAnimationFrame(function(){
        wheelRAF[i]=null;
        positionLane(i,true);
      });
    }
    clearTimeout(wheelIdle[i]);
    wheelIdle[i]=setTimeout(function(){refreshFocusActs(i);},160);
  },{passive:false});

  // touch: swipe sideways for stages, up/down to rifle cards
  (function(){
    var sx=0,sy=0,st=0,go=false;
    flow.addEventListener('touchstart',function(e){
      if(e.touches.length!==1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();go=true;
    },{passive:true});
    flow.addEventListener('touchend',function(e){
      if(!go)return;go=false;
      var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st>700)return;
      var adx=Math.abs(dx),ady=Math.abs(dy);
      if(adx<42&&ady<42)return;
      var oi=-1;
      for(var i=0;i<STAGES.length;i++){if(openState[i]){oi=i;break;}}
      if(adx>ady){
        var next=(oi<0)?(dx<0?0:STAGES.length-1):oi+(dx<0?1:-1);
        if(next<0||next>=STAGES.length)return;
        STAGES.forEach(function(x,j){openState[j]=false;});
        openState[next]=true;
        renderAll();
      }else if(oi>=0){
        var n=stageCards(oi+1).length;
        if(n<2)return;
        focusIdx[oi]=(((focusIdx[oi]||0)+(dy<0?1:-1))%n+n)%n;
        positionLane(oi,true);
        setTimeout(function(){refreshFocusActs(oi);},170);
      }
    },{passive:true});
  })();

  // Lane rendering is split in two on purpose:
  //   renderLane(i)   — rebuilds the card DOM. Only when the card set or state changes.
  //   positionLane(i) — moves what's already there. Runs on every riffle tick.
  // The old code rebuilt every card's innerHTML on each wheel notch, which is why
  // flipping through a stack stuttered: it was re-parsing HTML mid-animation.
  var laneCards={};   // lane index -> [{el, card}]

  function positionLane(i,riffle){
    var built=laneCards[i];
    if(!built||!built.length)return;
    var s=STAGES[i];
    var openNow=!!openState[i];
    var showing=openNow||!!peekState[i];
    var n=built.length;
    var fi=((focusIdx[i]||0)%n+n)%n;
    paintCount(i,n);

    // Hiding is a fade, not a teardown. The DOM stays built so coming back to a
    // lane is a transition rather than a rebuild — that's what made hovering
    // across the board feel like it was catching.
    if(!showing){
      for(var h=0;h<n;h++){
        var eh=built[h].el;
        eh.classList.remove('show','riffle');
        eh.style.transitionDelay='0ms';
        // positionLane writes opacity as an inline style when showing, and an inline
        // style outranks the class rule — so dropping .show alone left the cards
        // sitting there fully visible. Clear the inline value too.
        eh.style.opacity='0';
        eh.style.pointerEvents='none';
      }
      return;
    }

    // Peek used to be a preview you couldn't touch. Now it's a browsing surface,
    // so the fan opens wider — each card needs a sliver big enough to aim at.
    var m=fanMetrics(i);
    var reveal=m.reveal, step=m.step, base=m.base;


    for(var k=0;k<n;k++){
      var elc=built[k].el, isFocus=(k===fi);
      var d=k-fi, ad=Math.abs(d);
      elc.style.zIndex=String(60-ad);
      var tx=d*step*reveal;
      var ty=(base+ad*7)*reveal*(s.dir==='up'?-1:1);
      var rot=d*(openNow?2.5:2)*reveal;
      var scale=m.scale*(isFocus?1:0.94);
      var op=isFocus?1:(openNow?0.94:(ad>3?0.55:0.8));

      // During a riffle every card moves at once with no stagger — the stagger is
      // what made fast scrolling feel like wading. Only the first reveal stacks.
      elc.style.transitionDelay=riffle?'0ms':(ad*22)+'ms';
      elc.classList.toggle('riffle',!!riffle);
      elc.classList.toggle('focus',isFocus);
      elc.style.transform='translate(calc(-50% + '+tx+'px), '+ty+'px) rotate('+rot+'deg) scale('+scale+')';
      elc.style.opacity=String(op);
      elc.style.pointerEvents='';   // clears the inline block set while hidden
      elc.classList.add('show');
    }
  }

  var laneSig={}, laneSettle={};
  function paintCount(i,total){
    var cnt=nodeEls[i]&&nodeEls[i].querySelector('.cnt');
    if(!cnt)return;
    var showing=openState[i]||peekState[i];
    if(showing&&total>1){
      var fi=((focusIdx[i]||0)%total+total)%total;
      cnt.textContent=(fi+1)+'/'+total;
      cnt.classList.add('pos');
    }else{
      cnt.textContent=String(total);
      cnt.classList.remove('pos');
    }
  }
  function sigOf(cards){
    return cards.map(function(c){
      return c.id+':'+c.stage+':'+(isRunning(c)?1:0)+':'+partsDone(c)+':'+(hits[c.id]?1:0)+
             ':'+(artMode[c.id]||'photo');
    }).join('|');
  }

  function renderLane(i){
    var s=STAGES[i],lane=laneEls[i],node=nodeEls[i];
    var cards=stageCards(i+1);
    var late=cards.filter(isLate).length;
    var mineStage=roleDef().stages.indexOf(i+1)>=0&&plain();

    node.className='node'+(openState[i]?' on':'')+(peekState[i]&&!openState[i]?' peek':'')+
                   (mineStage?' mine':'');
    node.innerHTML=(late?'<span class="late"></span>':'')+
      '<span class="plate"><span class="lbl">'+s.name+'</span>'+
      '<span class="cnt">'+cards.length+'</span></span><span class="dot"></span>';
    // position-in-stack moved into the node plate. It used to be a floating box
    // above the fan, which sat right on top of the timeline rail.
    paintCount(i,cards.length);

    // Nothing about the cards changed — this is just a show/hide. Reposition the
    // existing DOM instead of rebuilding it, so peeking is a pure transition.
    var sig=sigOf(cards);
    if(laneSig[i]===sig&&laneCards[i]&&laneCards[i].length===cards.length&&cards.length){
      positionLane(i,false);
      return;
    }
    laneSig[i]=sig;

    var up=lane.querySelector('.fanUp'),down=lane.querySelector('.fanDown');
    up.innerHTML='';down.innerHTML='';
    laneCards[i]=[];
    var host=(s.dir==='up')?up:down;
    if(!(openState[i]||peekState[i])){laneSig[i]=null;return;}

    if(!cards.length){
      var e=document.createElement('div');
      e.className='laneempty';e.textContent='No cards.';
      host.appendChild(e);
      return;
    }

    var n=cards.length;
    var fi=((focusIdx[i]||0)%n+n)%n;

    cards.forEach(function(c,idx){
      var elc=document.createElement('div');
      var mine=isMine(c)&&plain();
      var notMine=!isMine(c)&&plain();
      elc.className='card'+(isLate(c)?' late':'')+
                    (mine?' mine':'')+(notMine?' notmine':'')+(hits[c.id]?' hit':'');
      elc.innerHTML=cardFaceHTML(c,false,(idx===fi)?miniActsHTML(c):'');
      elc._cid=c.id;
      elc._idx=idx;
      elc._lane=i;
      elc.addEventListener('click',function(ev){
        if(ev.target.closest('[data-mini]'))return;
        ev.stopPropagation();
        openSheet(c,ev.target.closest('[data-open="time"]')?'time':'card');
      });
      host.appendChild(elc);

      Array.prototype.forEach.call(elc.querySelectorAll('[data-mini]'),function(b){
        b.onclick=function(ev){
          ev.stopPropagation();
          var a=b.getAttribute('data-mini');
          if(a==='in')clockIn(c);
          else if(a==='out')clockOut(c);
          else if(a==='status')openSheet(c,'time');
        };
      });

      laneCards[i].push({el:elc,card:c});
    });

    // first paint: let the browser see the start state, then fan out with stagger
    requestAnimationFrame(function(){positionLane(i,false);});
  }

  // The focused card carries the clock buttons. Rebuilding that markup mid-riffle is
  // what we're avoiding, so it's deferred until the stack stops moving.
  function refreshFocusActs(i){
    var built=laneCards[i];
    if(!built||!built.length)return;
    var n=built.length, fi=((focusIdx[i]||0)%n+n)%n;
    for(var k=0;k<n;k++){
      var b=built[k], has=!!b.el.querySelector('.mini-acts');
      if(k===fi&&!has)b.el.innerHTML=cardFaceHTML(b.card,false,miniActsHTML(b.card));
      else if(k!==fi&&has)b.el.innerHTML=cardFaceHTML(b.card,false,'');
      else continue;
      (function(el,c){
        Array.prototype.forEach.call(el.querySelectorAll('[data-mini]'),function(bt){
          bt.onclick=function(ev){
            ev.stopPropagation();
            var a=bt.getAttribute('data-mini');
            if(a==='in')clockIn(c);
            else if(a==='out')clockOut(c);
            else if(a==='status')openSheet(c,'time');
          };
        });
      })(b.el,b.card);
    }
  }

  function renderAll(){STAGES.forEach(function(s,i){renderLane(i);});}

  // ---- SEARCH ----------------------------------------------------
  var sscrim=document.getElementById('sscrim');
  var spal=document.getElementById('spal');
  var sInput=document.getElementById('sInput');
  var sRes=document.getElementById('sRes');
  var sFlat=[],sSel=0,sOpen=false;

  function openSearch(){
    sOpen=true;
    sscrim.classList.add('open');spal.classList.add('open');
    sInput.value='';sSel=0;
    runSearch('');
    setTimeout(function(){sInput.focus();},30);
  }
  function closeSearch(){
    sOpen=false;
    sscrim.classList.remove('open');spal.classList.remove('open');
  }
  sscrim.addEventListener('click',closeSearch);
  document.getElementById('searchBtn').onclick=openSearch;

  function buildResults(q){
    q=q.trim().toLowerCase();
    var groups=[
      {key:'Parts',items:[]},{key:'Work orders',items:[]},
      {key:'POs',items:[]},{key:'Invoices',items:[]},{key:'Customers',items:[]}
    ];
    if(!q){
      // no query yet: offer whatever is late, as a useful default
      CARDS.filter(isLate).slice(0,8).forEach(function(c){
        groups[0].items.push({label:c.part||c.wo,meta:'PO '+(c.po||'\u2014')+' \u00b7 '+
          Math.abs(c.days)+'d over',note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      });
      return groups.filter(function(g){return g.items.length;});
    }
    var seenPO={},seenCust={};
    CARDS.forEach(function(c){
      if((c.part||'').toLowerCase().indexOf(q)>=0){
        groups[0].items.push({label:c.part,meta:(c.customer||'')+' \u00b7 PO '+(c.po||'\u2014')+
          ' \u00b7 qty '+(c.qty!=null?c.qty:'\u2014'),note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if((c.wo||'').toLowerCase().indexOf(q)>=0){
        groups[1].items.push({label:c.wo,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.invoice&&String(c.invoice).toLowerCase().indexOf(q)>=0){
        groups[3].items.push({label:'INV '+c.invoice,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.po&&String(c.po).toLowerCase().indexOf(q)>=0&&!seenPO[c.po]){
        seenPO[c.po]=1;
        var sib=CARDS.filter(function(x){return x.po===c.po;});
        groups[2].items.push({label:'PO '+c.po,meta:sib.map(function(x){return x.part;}).join(', '),
          note:sib.length+' card'+(sib.length===1?'':'s'),ids:sib.map(function(x){return x.id;})});
      }
      if(c.customer&&c.customer.toLowerCase().indexOf(q)>=0&&!seenCust[c.customer]){
        seenCust[c.customer]=1;
        var mine=CARDS.filter(function(x){return x.customer===c.customer;});
        groups[4].items.push({label:c.customer,meta:mine.length+' open card'+(mine.length===1?'':'s'),
          note:'',ids:mine.map(function(x){return x.id;})});
      }
    });
    return groups.filter(function(g){return g.items.length;});
  }

  function runSearch(q){
    var groups=buildResults(q);
    sFlat=[];
    if(!groups.length){
      sRes.innerHTML='<div class="sempty">Nothing matches that.</div>';
      return;
    }
    var html='';
    groups.forEach(function(g){
      html+='<div class="sgrp">'+esc(g.key)+'</div>';
      g.items.slice(0,8).forEach(function(it){
        var idx=sFlat.length;
        sFlat.push(it);
        html+='<div class="sitem" data-i="'+idx+'">'+
          '<span class="sk">'+esc(it.label)+'</span>'+
          '<span class="sm">'+esc(it.meta||'')+'</span>'+
          '<span class="sn">'+esc(it.note||'')+'</span></div>';
      });
    });
    sRes.innerHTML=html;
    if(sSel>=sFlat.length) sSel=0;
    paintSel();
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      el.onclick=function(){ sSel=+el.getAttribute('data-i'); choose(); };
    });
  }
  function paintSel(){
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      var on=(+el.getAttribute('data-i')===sSel);
      el.classList.toggle('sel',on);
      if(on&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    });
  }
  function choose(){
    var it=sFlat[sSel];
    if(!it)return;
    closeSearch();
    gotoCards(it.ids);
  }

  // Bring the timeline to a card (or a PO's whole set) and mark them.
  function gotoCards(ids){
    hits={};
    ids.forEach(function(id){hits[id]=1;});
    setView('timeline');
    var stagesHit={};
    ids.forEach(function(id){
      var c=byId(id);
      if(c) stagesHit[c.stage]=1;
    });
    STAGES.forEach(function(s,i){ openState[i]=!!stagesHit[i+1]; });
    // focus the first hit inside each opened stage
    Object.keys(stagesHit).forEach(function(st){
      var list=stageCards(+st);
      for(var i=0;i<list.length;i++){
        if(hits[list[i].id]){ focusIdx[+st-1]=i; break; }
      }
    });
    renderAll();
    if(ids.length===1){
      var c=byId(ids[0]);
      if(c) setTimeout(function(){openSheet(c,'card');},260);
    } else {
      toast(ids.length+' cards across '+Object.keys(stagesHit).length+' stage'+
            (Object.keys(stagesHit).length===1?'':'s'));
    }
    setTimeout(function(){hits={};renderAll();},6000);
  }

  sInput.addEventListener('input',function(){sSel=0;runSearch(sInput.value);});
  sInput.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();sSel=Math.min(sSel+1,sFlat.length-1);paintSel();}
    else if(e.key==='ArrowUp'){e.preventDefault();sSel=Math.max(sSel-1,0);paintSel();}
    else if(e.key==='Enter'){e.preventDefault();choose();}
    else if(e.key==='Escape'){e.preventDefault();closeSearch();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ if(sOpen)closeSearch(); else closeSheet(); return; }
    var typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||''));
    if(!sOpen&&!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){
      e.preventDefault();openSearch();
    }
  });
  // terminal shell can hand us a card to jump to
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='sr:focusCard'&&d.id) gotoCards([d.id]);
    if(d.type==='sr:search') openSearch();
  });

  // ---- DASHBOARD -------------------------------------------------
  function priority(a,b){
    if(isRunning(a)!==isRunning(b))return isRunning(a)?-1:1;
    var ad=(a.days==null)?9999:a.days,bd=(b.days==null)?9999:b.days;
    return ad-bd;
  }
  function renderDash(){
    var r=roleDef();
    var mine=CARDS.filter(function(c){return isMine(c)&&c.active;}).sort(priority);
    document.getElementById('dTitle').textContent=r.label;
    var lateN=mine.filter(isLate).length;
    document.getElementById('dSub').textContent=
      r.stages.length===0 ? '' :
      mine.length+' open'+(lateN?(' \u00b7 '+lateN+' late'):'');

    var host=document.getElementById('dList');
    if(!mine.length){
      host.innerHTML='<div class="dempty">Nothing waiting at your station right now. '+
        'Switch to <b>Timeline</b> to see where everything else is sitting.</div>';
      return;
    }
    host.innerHTML='';
    mine.forEach(function(c){
      var row=document.createElement('div');
      row.className='drow'+(isRunning(c)?' running':'');
      var nxt=(STAGES[c.stage]||{}).name;
      var done=partsDone(c);
      row.innerHTML=
        '<div class="dstripe"><span>'+esc(c.wo)+'</span></div>'+
        '<div class="in"><div class="top">'+
          '<div class="who"><div class="dpart">'+esc(c.part||c.name||'\u2014')+'</div>'+
            '<div class="meta">PO '+esc(c.po||'\u2014')+' \u00b7 '+esc(c.customer||'\u2014')+
              ' \u00b7 '+esc((STAGES[c.stage-1]||{}).name||'')+'<br>'+
              done+' / '+esc(c.qty!=null?c.qty:'?')+' parts \u00b7 '+fmtHours(totalMs(c))+' hrs \u00b7 '+
              esc(dueText(c))+'</div></div>'+
          '<div class="timer" data-do="time"><span data-clock="'+esc(c.id)+'">'+fmtHMS(totalMs(c))+
            '</span><small>'+(isRunning(c)?'RUNNING':'LOGGED')+'</small></div>'+
        '</div>'+
        (flagsHTML(c)?'<div class="flags">'+flagsHTML(c)+'</div>':'')+
        paceBarHTML(c,false)+
        '<div class="btns">'+
          (isRunning(c)
            ? '<button class="act stop" data-do="out"><span class="an">Clock out</span><span class="ad">Stop the timer</span></button>'
            : '<button class="act go" data-do="in"><span class="an">Clock in</span><span class="ad">Start the timer</span></button>')+
          (nxt
            ? '<button class="act" data-do="next"><span class="an">Finish</span><span class="ad">Send to '+esc(nxt)+'</span></button>'
            : '<button class="act" disabled><span class="an">Finish</span><span class="ad">Last station</span></button>')+
          '<button class="act wide ghost" data-do="open"><span class="an">Card</span>'+
            '<span class="ad">Full card, quote and files</span></button>'+
        '</div></div>';
      Array.prototype.forEach.call(row.querySelectorAll('[data-do]'),function(b){
        b.onclick=function(){
          var a=b.getAttribute('data-do');
          if(a==='in')clockIn(c);
          else if(a==='out')clockOut(c);
          else if(a==='next')advance(c);
          else if(a==='time')openSheet(c,'time');
          else if(a==='open')openSheet(c,'card');
        };
      });
      host.appendChild(row);
    });
  }

  setInterval(function(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-clock]'),function(t){
      var c=byId(t.getAttribute('data-clock'));
      if(c)t.textContent=fmtHMS(totalMs(c));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.mb.live'),function(b){
      var card=b.closest('.card');
      if(!card||!card._cid)return;
      var c=byId(card._cid);
      if(c&&isRunning(c))b.textContent=fmtHMS(totalMs(c));
    });
  },1000);

  function refreshViews(){
    renderAll();renderDash();
    if(openSheetId){var c=byId(openSheetId);if(c)openSheet(c,sheetMode);}
  }

  // ---- VIEW SWITCH -----------------------------------------------
  var tabT=document.getElementById('tabTimeline'),tabD=document.getElementById('tabDash');
  function setView(v){
    view=v;
    tabT.classList.toggle('on',v==='timeline');
    tabD.classList.toggle('on',v==='dashboard');
    document.getElementById('scTimeline').classList.toggle('on',v==='timeline');
    document.getElementById('scDash').classList.toggle('on',v==='dashboard');
    document.getElementById('btnAll').style.display=(v==='timeline')?'':'none';
    setHint();
    if(v==='dashboard')renderDash();else renderAll();
  }
  tabT.onclick=function(){setView('timeline');};
  tabD.onclick=function(){setView('dashboard');};

  function setHint(){
    // tooltip, not page copy — the controls explain themselves on hover now
    document.getElementById('hint').title=(view==='dashboard')
      ? 'Your jobs, highest priority first \u00b7 press / to search'
      : 'Hover a stage to peek \u00b7 click to hold open \u00b7 wheel or swipe to rifle cards \u00b7 press / to search';
  }

  var roleSel=document.getElementById('roleSel');
  roleSel.innerHTML=ROLES.map(function(r){
    return '<option value="'+r.id+'"'+(r.id===role?' selected':'')+'>'+r.label+'</option>';
  }).join('');
  roleSel.onchange=function(){
    role=roleSel.value;lsSet('sr_role',role);
    toast('Station set to '+roleDef().label);
    refreshViews();
  };
  document.getElementById('btnAll').addEventListener('click',function(){
    var anyClosed=STAGES.some(function(s,i){return !openState[i];});
    STAGES.forEach(function(s,i){openState[i]=anyClosed;});
    this.textContent=anyClosed?'Close all':'Open all';
    renderAll();
  });

  // ---- DEMO DATA (only when /api/trello can't be reached) ---------
  function demoCards(){
    var parts=[
      ['100844','ROBERTS','15902','B',40],['100849','ROBERTS','15902','B',40],
      ['100846','ROBERTS','15902','A',40],['100101','ROBERTS','15935','C',8],
      ['100151','ROBERTS','15935','C',8],['TRAM_G2-01046','FTI','266677','A',12],
      ['BRKT-9','FTI','266550','D',20],['SLV-2207','FTI','266612','A',30],
      ['PIN-4410','ROBERTS','15948','B',150],['HSG-1180','FTI','266701','B',6],
      ['CLP-3302','ROBERTS','15951','A',75],['MNT-0074','FTI','266688','C',18],
      ['SPCR-119','ROBERTS','15944','A',200],['ADPT-556','FTI','266720','B',10],
      ['ROD-8821','ROBERTS','15960','A',24],['CAM-0453','FTI','266733','E',4],
      ['BSHG-207','ROBERTS','15955','B',90],['FLNG-330','FTI','266742','A',14],
      ['KEY-1102','ROBERTS','15962','C',60],['GDE-7789','FTI','266750','B',22]
    ];
    var now=Math.floor(Date.now()/1000);
    return parts.map(function(p,i){
      var stage=1+Math.floor(Math.random()*6);
      var days;
      if(Math.random()<0.25)days=-(2+Math.floor(Math.random()*24));
      else if(Math.random()<0.4)days=Math.floor(Math.random()*7);
      else days=8+Math.floor(Math.random()*30);
      var shipped=(stage===6);
      var created=now-Math.floor(Math.random()*400*86400);
      return {
        id:created.toString(16)+String(1000+i),
        part:p[0],name:p[0]+' \u2014 PO '+p[2],customer:p[1],po:p[2],rev:p[3],qty:p[4],
        stage:stage,list:STAGES[stage-1].name,days:days,
        active:!shipped,shipped:shipped,
        invoice:(shipped&&Math.random()<0.6)?String(1053+i):null,
        time:null,op1:null,photo:null,url:null,
        quoted:+(p[4]*(0.06+Math.random()*0.22)+1.5).toFixed(2)
      };
    });
  }

  function ingest(cards,demo){
    CARDS=cards.map(function(c){
      var o={};
      for(var k in c)if(Object.prototype.hasOwnProperty.call(c,k))o[k]=c[k];
      o._created=cardCreated(c.id);
      if(moves[o.id]){o.stage=moves[o.id];o.list=(STAGES[o.stage-1]||{}).name||o.list;}
      return o;
    });
    assignWorkOrders(CARDS);
    document.getElementById('sOpen').textContent=CARDS.filter(function(c){return c.active;}).length;
    document.getElementById('sLate').textContent=CARDS.filter(isLate).length;
    document.getElementById('sDemo').style.display=demo?'':'none';
    refreshViews();
  }

  // ---- api/jobs.js -> CARDS shape --------------------------------------
  // /api/trello already returns cards pre-enriched with stage/list/days/active/
  // shipped. /api/jobs returns the locked schema straight — dueDate, numeric
  // stage — so that enrichment happens here once, at the boundary, rather than
  // teaching every render function two shapes.
  function daysUntil(iso){
    if(!iso) return null;
    var due=new Date(iso); if(isNaN(due)) return null;
    var ms=due.setHours(23,59,59,999)-Date.now();
    return Math.floor(ms/86400000);
  }
  function jobToCard(j){
    var stage=j.stage||1, shipped=(stage>=6);
    return {
      id:j.id, part:j.part, name:(j.part||'')+' \u2014 PO '+(j.po||''),
      customer:j.customer, po:j.po, rev:j.rev, qty:j.qty,
      stage:Math.min(stage,6), list:(STAGES[Math.min(stage,6)-1]||{}).name,
      days:daysUntil(j.dueDate), active:!shipped, shipped:shipped,
      invoice:j.invoice, time:j.time, op1:j.op1, op2:j.op2, rate:j.rate,
      photo:j.photo, url:null, quoted:j.quoted
    };
  }

  function load(){
    return fetch('/api/jobs',{credentials:'same-origin'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(jobs){
        if(!Array.isArray(jobs)||!jobs.length)throw new Error('no jobs yet');
        ingest(jobs.map(jobToCard),false);
      })
      .catch(function(){
        return fetch('/api/trello',{credentials:'same-origin'})
          .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
          .then(function(d){
            if(d.error)throw new Error(d.error);
            if(!d.cards||!d.cards.length)throw new Error('no cards');
            ingest(d.cards,false);
          });
      })
      .catch(function(){if(!CARDS.length)ingest(demoCards(),true);});
  }

  setHint();
  load();
  setInterval(load,120000);
})();
</script>
