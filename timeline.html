<meta charset="utf-8">
<!-- TIMELINE.HTML — loads inside terminal.html's Timeline station. Version in APP_VERSION below. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Timeline — Stealth R&amp;D</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --purple:#9233E6; --purple-lift:#A855F7; --purple-deep:#6B21C4;
    --purple-tint:rgba(146,51,230,.10);
    --white:#FFFFFF; --silver:#CCCCCC;
    --bg:#232327; --panel:#2C2C31; --raised:#35353B; --sunken:#060606;
    --line:#43434B; --line-hot:#54545E;
    --ink:#F4F4F6; --dim:#A6A6B2; --faint:#7C7C88;
    --pass:#4ADE80; --warn:#F0B429; --fail:#F87171;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --disp:'Barlow Condensed','Oswald',system-ui,sans-serif;
    /* card stock */
    --frame:#1A1A1F; --frame-2:#0E0E12;
    --face:#33333C; --face-2:#26262D;
    --rule:rgba(255,255,255,.11);
    --off:#2B2B32; --off-2:#212126;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
       -webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- top bar ---------- */
  .bar{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:10px 14px;
       border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .bar .t{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.18em;
          text-transform:uppercase;color:var(--white)}
  .bar .t span{color:var(--purple-lift)}
  .toggle{display:flex;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
  .toggle button{background:none;border:none;color:var(--faint);font-family:var(--disp);
          font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
          padding:7px 14px;cursor:pointer;transition:all .15s}
  .toggle button.on{background:var(--purple);color:var(--white)}
  .searchbtn{flex:1;max-width:230px;display:flex;align-items:center;gap:8px;background:var(--sunken);
    border:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px;
    padding:7px 11px;cursor:pointer;text-align:left}
  .searchbtn:hover{border-color:var(--purple);color:var(--dim)}
  .searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:9px;border:1px solid var(--line);
    padding:1px 4px;color:var(--faint)}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .stat{font-size:10px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
  .stat b{color:var(--white);font-weight:500}
  .stat.demo{color:var(--warn);border:1px solid rgba(240,180,41,.4);padding:3px 7px}
  select.role,button.mini{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
       font-family:var(--mono);font-size:10px;padding:5px 9px;cursor:pointer}
  select.role:focus{outline:none;border-color:var(--purple)}
  button.mini:hover{border-color:var(--purple);color:var(--purple-lift)}
  .hint{font-size:10px;color:var(--faint)}

  .screen{flex:1;min-height:0;display:none}
  .screen.on{display:flex}

  /* ---------- TIMELINE ---------- */
  #scTimeline{flex-direction:column}
  .flow{position:relative;flex:1;display:flex;padding:0 12px;min-height:0;overflow:hidden;touch-action:pan-y}
  .flow::before{content:'';position:absolute;left:24px;right:24px;top:50%;height:1px;z-index:0;
    background:linear-gradient(90deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.34) 14%,
      var(--purple-lift) 50%,rgba(255,255,255,.34) 86%,rgba(255,255,255,.10) 100%)}
  .flow::after{content:'';position:absolute;left:24px;right:24px;top:50%;height:5px;z-index:0;
    transform:translateY(-2px);opacity:.32;filter:blur(4px);
    background:linear-gradient(90deg,transparent 20%,var(--purple) 50%,transparent 80%)}
  .lane{flex:1;position:relative}

  /* node sits above the cards and carries its own plate so nothing overlaps it */
  .node{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:80;
        background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
        align-items:center;gap:6px;padding:4px}
  .node .plate{display:flex;align-items:center;gap:7px;background:var(--bg);
    border:1px solid var(--line);padding:3px 9px;white-space:nowrap;transition:all .16s}
  .node.peek .plate,.node.on .plate{border-color:var(--white)}
  .node .lbl{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--faint);transition:color .16s}
  .node.on .lbl,.node.peek .lbl{color:var(--white)}
  .node.mine .lbl{color:var(--pass)}
  .node .cnt{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.06em;
             border-left:1px solid var(--line);padding-left:7px}
  .node.on .cnt{color:var(--purple-lift)}
  .node .dot{width:13px;height:13px;transform:rotate(45deg);background:var(--sunken);
             border:1px solid rgba(255,255,255,.45);transition:all .16s}
  .node.peek .dot{border-color:var(--white);background:var(--purple-deep)}
  .node.on .dot{border-color:var(--white);background:var(--purple)}
  .node.mine .dot{border-color:var(--pass)}
  .node.mine.on .dot{background:var(--pass)}
  .node .late{position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:var(--fail);
              transform:rotate(45deg)}

  .fanUp,.fanDown{position:absolute;left:50%;z-index:2}
  .fanUp{bottom:calc(50% + 34px)}
  .fanDown{top:calc(50% + 34px)}
  .laneempty{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;
             color:var(--faint);white-space:nowrap}
  .fanUp .laneempty{bottom:calc(50% + 38px)}
  .fanDown .laneempty{top:calc(50% + 38px)}
  .counter{position:absolute;left:50%;transform:translateX(-50%);z-index:90;
    font-family:var(--disp);font-size:10px;letter-spacing:.18em;color:var(--white);
    background:var(--sunken);border:1px solid var(--purple);padding:2px 9px;white-space:nowrap}
  .fanUp .counter{bottom:-26px}
  .fanDown .counter{top:-26px}

  /* ---------- THE CARD (MTG frame) ---------- */
  .card{position:absolute;left:50%;width:196px;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px;
    opacity:0;pointer-events:none;cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.6);
    transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .22s,border-color .16s}
  .fanUp .card{bottom:0;transform-origin:bottom center;transform:translate(-50%,0) scale(.72)}
  .fanDown .card{top:0;transform-origin:top center;transform:translate(-50%,0) scale(.72)}
  .card.show{opacity:1;pointer-events:auto}
  .card.focus{border-color:var(--purple-lift)}
  .card.focus .plate2{border-color:var(--purple)}
  .card.mine{border-color:rgba(74,222,128,.55)}
  .card.hit{border-color:var(--warn)}
  .plate2{border:1px solid var(--rule);border-radius:5px;overflow:hidden;
          background:linear-gradient(160deg,var(--face) 0%,var(--face-2) 100%)}
  .card.notmine .plate2{background:linear-gradient(160deg,var(--off) 0%,var(--off-2) 100%)}

  /* title bar — part number left, work order right (the "cost") */
  .tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;
        background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
        border-bottom:1px solid var(--rule)}
  .tname{flex:1;min-width:0;font-family:var(--disp);font-size:16px;font-weight:700;
         color:var(--white);line-height:1.05;letter-spacing:.01em;word-break:break-word}
  .twо,.two{flex-shrink:0}
  .two{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--white);
       background:var(--purple);border:1px solid rgba(255,255,255,.35);padding:2px 6px;
       transform:skewX(-10deg)}
  .card.mine .two{background:var(--pass);color:var(--sunken)}

  /* art window */
  .art{position:relative;height:62px;margin:5px 6px;background:var(--sunken);
       border:1px solid var(--rule);overflow:hidden;
       background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px)}
  .art i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;
         font-family:var(--disp);font-size:8px;letter-spacing:.22em;color:var(--faint)}
  .art img{width:100%;height:100%;object-fit:cover;display:block}

  /* type line — PO · CUSTOMER · STAGE, grouped as one identity strip */
  .tline{margin:0 6px;padding:4px 7px;background:rgba(255,255,255,.05);
         border:1px solid var(--rule);font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;
         text-transform:uppercase;color:var(--white);display:flex;gap:6px;align-items:center;
         white-space:nowrap;overflow:hidden}
  .tline b{font-weight:700;color:var(--purple-lift)}
  .card.mine .tline b{color:var(--pass)}
  .tline em{font-style:normal;color:var(--faint)}

  /* text box — production block: qty, parts, time */
  .tbox{margin:5px 6px 0;padding:6px 7px;background:rgba(0,0,0,.28);border:1px solid var(--rule);
        min-height:52px}
  .prow{display:flex;justify-content:space-between;gap:8px;font-size:10px;padding:1.5px 0}
  .prow .k{color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .prow .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .prow.clickable{cursor:pointer;margin:0 -3px;padding:1.5px 3px}
  .prow.clickable:hover{background:var(--purple-tint)}
  .prow.clickable .v{color:var(--purple-lift);border-bottom:1px dotted var(--purple)}
  .bars{display:flex;height:3px;margin-top:5px;gap:1px;background:var(--sunken)}
  .bars i{display:block;height:100%}

  .flags{display:flex;gap:3px;flex-wrap:wrap;margin:5px 6px 0}
  .flag{font-size:8px;letter-spacing:.07em;padding:1px 4px;color:var(--faint);
        border:1px solid var(--line);white-space:nowrap}
  .flag.late{color:var(--fail);border-color:rgba(248,113,113,.5)}
  .flag.sib{color:var(--warn);border-color:rgba(240,180,41,.5)}
  .flag.inv{color:var(--pass);border-color:rgba(74,222,128,.5)}
  .flag.you{color:var(--pass);border-color:rgba(74,222,128,.6)}
  .flag.run{color:var(--white);border-color:var(--purple);background:var(--purple-tint)}

  /* bottom bar — collector line left, qty box right (the "power/toughness") */
  .bbar{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
        margin:6px 6px 5px;padding-top:5px;border-top:1px solid var(--rule)}
  .coll{font-size:8px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;line-height:1.4}
  .pt{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--white);
      background:var(--sunken);border:1px solid rgba(255,255,255,.3);padding:2px 8px;
      white-space:nowrap;font-variant-numeric:tabular-nums}
  .card.late .pt{border-color:rgba(248,113,113,.6);color:var(--fail)}

  .mini-acts{display:none;gap:4px;margin:6px 6px 2px}
  .card.focus .mini-acts{display:flex}
  .mb{flex:1;background:var(--sunken);border:1px solid var(--line);color:var(--dim);
      font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
      padding:6px 3px;cursor:pointer;text-align:center;text-decoration:none;white-space:nowrap}
  .mb:hover{border-color:var(--purple);color:var(--white)}
  .mb.go{border-color:rgba(74,222,128,.45);color:var(--pass)}
  .mb.stop{border-color:rgba(248,113,113,.45);color:var(--fail)}
  .mb.live{border-color:var(--purple);color:var(--white);background:var(--purple-tint)}

  /* ---------- overlays ---------- */
  .scrim{position:fixed;inset:0;background:rgba(6,6,6,.76);z-index:60;opacity:0;
         pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:61;
    width:min(360px,calc(100vw - 26px));max-height:calc(100vh - 30px);overflow-y:auto;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid var(--purple);border-radius:10px;padding:6px;
    box-shadow:0 24px 56px rgba(0,0,0,.75);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s cubic-bezier(.2,.8,.2,1)}
  .sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .sheet .tname{font-size:23px}
  .sheet .two{font-size:14px;padding:3px 8px}
  .sheet .art{height:132px}
  .sheet .tline{font-size:10.5px}
  .sheet .prow{font-size:11px;padding:3px 0}
  .sheet .close{position:absolute;top:10px;right:12px;z-index:3;background:none;border:none;
                color:var(--faint);font-size:19px;line-height:1;cursor:pointer;padding:3px 6px}
  .sheet .close:hover{color:var(--white)}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 6px 4px}
  .act{display:flex;flex-direction:column;gap:3px;text-decoration:none;background:var(--sunken);
       border:1px solid var(--line);padding:9px 10px;cursor:pointer;font-family:var(--mono);
       text-align:left;width:100%;transition:border-color .15s,background .15s}
  .act:hover{border-color:var(--purple);background:var(--purple-tint)}
  .act .an{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.12em;
           text-transform:uppercase;color:var(--purple-lift)}
  .act .ad{font-size:9px;color:var(--faint);line-height:1.3}
  .act.wide{grid-column:1/-1}
  .act.ghost .an{color:var(--dim)}
  .act.go{border-color:rgba(74,222,128,.4)} .act.go .an{color:var(--pass)}
  .act.stop{border-color:rgba(248,113,113,.4)} .act.stop .an{color:var(--fail)}
  .act[disabled]{opacity:.4;cursor:not-allowed}

  /* time breakdown */
  .brk{margin:9px 6px 2px;padding:10px 11px;background:rgba(0,0,0,.3);border:1px solid var(--rule)}
  .brk .bh{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--white);margin-bottom:9px;display:flex;justify-content:space-between}
  .brk .bh span{color:var(--purple-lift)}
  .seg{margin-bottom:9px}
  .seg .sl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px}
  .seg .sl b{color:var(--white);font-weight:500;font-variant-numeric:tabular-nums}
  .track{height:7px;background:var(--sunken);border:1px solid var(--line)}
  .track i{display:block;height:100%;background:var(--purple)}
  .seg.op2 .track i{background:var(--purple-lift)}
  .seg.op3 .track i{background:var(--pass)}
  .brk .none{font-size:10px;color:var(--faint);line-height:1.6}
  .logrow{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
  .logrow select,.logrow input{background:var(--sunken);border:1px solid var(--line);color:var(--white);
    font-family:var(--mono);font-size:12px;padding:7px 8px;min-width:0}
  .logrow select{flex:0 0 74px} .logrow input{flex:1}
  .logrow button{background:var(--sunken);border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 11px;cursor:pointer}
  .logrow button:hover{background:var(--purple-tint);color:var(--white)}

  /* ---------- SEARCH ---------- */
  .sscrim{position:fixed;inset:0;background:rgba(6,6,6,.8);z-index:90;opacity:0;pointer-events:none;
          transition:opacity .16s}
  .sscrim.open{opacity:1;pointer-events:auto}
  .spal{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);z-index:91;
    width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 100px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--purple);box-shadow:0 24px 60px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
  .spal.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .spal input{width:100%;background:var(--sunken);border:none;border-bottom:1px solid var(--line);
    color:var(--white);font-family:var(--mono);font-size:16px;padding:15px 17px}
  .spal input:focus{outline:none}
  .sres{overflow-y:auto;padding:6px 0 8px}
  .sgrp{font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
        color:var(--faint);padding:9px 17px 5px}
  .sitem{display:flex;align-items:center;gap:10px;padding:8px 17px;cursor:pointer;border-left:2px solid transparent}
  .sitem.sel{background:var(--purple-tint);border-left-color:var(--purple)}
  .sitem .sk{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--white);
             flex-shrink:0;min-width:96px}
  .sitem .sm{font-size:10px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .sitem .sn{font-size:9px;color:var(--faint);flex-shrink:0}
  .sempty{padding:22px 17px;font-size:11px;color:var(--faint)}
  .sfoot{border-top:1px solid var(--line);padding:8px 17px;font-size:9px;color:var(--faint);
         display:flex;gap:14px}

  /* ---------- DASHBOARD ---------- */
  #scDash{flex-direction:column;overflow-y:auto;padding:16px 16px 40px}
  .dtitle{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--white)}
  .dsub{font-size:11px;color:var(--faint);margin:4px 0 14px;line-height:1.5;max-width:600px}
  .dlist{display:flex;flex-direction:column;gap:10px;max-width:660px}
  .drow{background:linear-gradient(160deg,var(--face) 0%,var(--face-2) 100%);
        border:1px solid rgba(255,255,255,.13);position:relative;overflow:hidden;
        box-shadow:0 6px 16px rgba(0,0,0,.42)}
  .drow.running{border-color:var(--purple)}
  .drow .dstripe{position:absolute;left:0;top:0;bottom:0;width:19px;background:var(--purple);
    display:flex;align-items:center;justify-content:center}
  .drow.running .dstripe{background:var(--purple-lift)}
  .drow .dstripe span{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.18em;
    color:var(--white);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  .drow .in{margin-left:19px;padding:12px 13px}
  .drow .top{display:flex;align-items:flex-start;gap:11px}
  .drow .who{flex:1;min-width:0}
  .drow .dpart{font-family:var(--disp);font-size:21px;font-weight:700;color:var(--white);line-height:1.1}
  .drow .meta{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5}
  .drow .timer{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--white);
               font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0;cursor:pointer}
  .drow .timer small{display:block;font-family:var(--mono);font-size:8px;color:var(--faint);
                     letter-spacing:.1em;font-weight:400}
  .drow.running .timer{color:var(--purple-lift)}
  .drow .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
  .drow .flags{margin:8px 0 0}
  .dempty{background:var(--panel);border:1px solid var(--line);padding:22px 20px;font-size:12px;
          color:var(--faint);line-height:1.6;max-width:660px}
  .dempty b{color:var(--dim);font-weight:500}

  .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,14px);z-index:95;
    background:var(--panel);border:1px solid var(--purple);padding:11px 16px;font-size:11px;
    color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:700px){
    .card{width:166px}
    .tname{font-size:14px}
    .flow{padding:0 4px}
    .bar{gap:8px;padding:9px 11px} .bar .t{font-size:12px}
    .searchbtn{max-width:none;order:5;flex-basis:100%}
    .hint{width:100%;order:9}
    .drow .btns{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar">
  <div class="t">Stealth <span>R&amp;D</span></div>
  <div class="toggle">
    <button id="tabTimeline" class="on">Timeline</button>
    <button id="tabDash">Dashboard</button>
  </div>
  <button class="searchbtn" id="searchBtn">Search parts, WO, PO, invoice<kbd>/</kbd></button>
  <div class="right">
    <div class="stat demo" id="sDemo" style="display:none">DEMO DATA</div>
    <div class="stat">OPEN <b id="sOpen">—</b></div>
    <div class="stat">LATE <b id="sLate">—</b></div>
    <select class="role" id="roleSel" title="Which station do you run?"></select>
    <button class="mini" id="btnAll">Open all</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="screen on" id="scTimeline"><div class="flow" id="flow"></div></div>

<div class="screen" id="scDash">
  <div class="dtitle" id="dTitle">Your queue</div>
  <div class="dsub" id="dSub">—</div>
  <div class="dlist" id="dList"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="sscrim" id="sscrim"></div>
<div class="spal" id="spal" role="dialog" aria-modal="true">
  <input id="sInput" type="text" placeholder="Part, work order, PO, invoice, customer…" autocomplete="off" spellcheck="false">
  <div class="sres" id="sRes"></div>
  <div class="sfoot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var APP_VERSION='v4.0';

  var STAGES=[
    {name:'Award',   dir:'up'},
    {name:'Plan',    dir:'down'},
    {name:'Machine', dir:'up'},
    {name:'QC',      dir:'down'},
    {name:'Pack',    dir:'up'},
    {name:'Ship',    dir:'down'}
  ];
  var OPS=['OP1','OP2','OP3'];

  var ROLES=[
    {id:'owner',    label:'Owner (all stations)', stages:[1,2,3,4,5,6]},
    {id:'office',   label:'Office / Programming', stages:[1,2]},
    {id:'machinist',label:'Machinist',            stages:[3]},
    {id:'qc',       label:'Quality',              stages:[4]},
    {id:'shipping', label:'Shipping',             stages:[5,6]},
    {id:'viewer',   label:'View only',            stages:[]}
  ];

  var QUOTE_TOOL='quote-generator.html';
  var DROPBOX_ROOT='https://www.dropbox.com/home/JOBSHOP';

  var flow=document.getElementById('flow');
  var scrim=document.getElementById('scrim');
  var sheetEl=document.getElementById('sheet');
  var toastEl=document.getElementById('toast');

  var openState={}, peekState={}, focusIdx={};
  var CARDS=[], laneEls=[], nodeEls=[];
  var hits={};   // card ids highlighted by a search result
  var view='timeline', openSheetId=null, sheetMode='card';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function lsGet(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  var role=lsGet('sr_role','owner');
  var clocks=lsGet('sr_clocks',{});
  var moves=lsGet('sr_moves',{});
  function saveClocks(){lsSet('sr_clocks',clocks);}
  function saveMoves(){lsSet('sr_moves',moves);}

  function roleDef(){for(var i=0;i<ROLES.length;i++)if(ROLES[i].id===role)return ROLES[i];return ROLES[0];}
  function isMine(c){return roleDef().stages.indexOf(c.stage)>=0;}
  function plain(){return role!=='owner'&&role!=='viewer';}
  function toast(m){
    toastEl.textContent=m;toastEl.classList.add('on');
    clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('on');},3000);
  }

  // ---- WORK ORDER: XX-YYYY, counter restarts each January ---------
  function cardCreated(id){
    if(!id||id.length<8)return null;
    var ts=parseInt(id.substring(0,8),16);
    return (!ts||isNaN(ts))?null:new Date(ts*1000);
  }
  function assignWorkOrders(cards){
    var dated=cards.filter(function(c){return c._created;});
    dated.sort(function(a,b){return a._created-b._created;});
    var per={};
    dated.forEach(function(c){
      var y=c._created.getFullYear();
      per[y]=(per[y]||0)+1;
      c.wo=String(y%100).padStart(2,'0')+'-'+String(per[y]).padStart(4,'0');
    });
    cards.forEach(function(c){if(!c.wo)c.wo='\u2014';});
  }

  function isLate(c){return !!c.active&&c.days!=null&&c.days<0;}
  function siblings(c){
    if(!c.po)return 0;
    return CARDS.filter(function(x){return x.po===c.po&&x.stage!==c.stage;}).length;
  }
  function dueText(c){
    if(c.days==null)return c.active?'no date':'\u2014';
    if(c.days<0)return Math.abs(c.days)+'d over';
    return c.days===0?'today':'in '+c.days+'d';
  }
  function byId(id){for(var i=0;i<CARDS.length;i++)if(CARDS[i].id===id)return CARDS[i];return null;}
  function stageCards(s){return CARDS.filter(function(c){return c.stage===s;});}
  function dropboxURL(c){
    return DROPBOX_ROOT+'/'+encodeURIComponent(c.customer||'')+'/'+encodeURIComponent(c.part||'');
  }

  // ---- CLOCK: plain in / out, parts logged separately -------------
  function rec(c){
    if(!clocks[c.id])clocks[c.id]={startedAt:null,accumulated:0,sessions:[],opTotals:{}};
    var r=clocks[c.id];
    if(!r.sessions)r.sessions=[];
    if(!r.opTotals)r.opTotals={};
    return r;
  }
  function isRunning(c){return !!(clocks[c.id]&&clocks[c.id].startedAt);}
  function sessionMs(c){var r=clocks[c.id];return (r&&r.startedAt)?(Date.now()-r.startedAt):0;}
  function totalMs(c){var r=clocks[c.id];return r?((r.accumulated||0)+sessionMs(c)):0;}
  function fmtHMS(ms){
    var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  }
  function fmtHours(ms){return (ms/3600000).toFixed(2);}
  function partsDone(c){
    var r=clocks[c.id];if(!r)return 0;
    return OPS.reduce(function(a,o){return a+(r.opTotals[o]||0);},0);
  }

  function clockIn(c){
    Object.keys(clocks).forEach(function(id){
      var r=clocks[id];
      if(id!==c.id&&r&&r.startedAt){
        r.accumulated=(r.accumulated||0)+(Date.now()-r.startedAt);
        r.startedAt=null;
      }
    });
    rec(c).startedAt=Date.now();
    saveClocks();
    toast('Clocked in on '+(c.part||c.wo));
    refreshViews();
  }
  function clockOut(c){
    var r=clocks[c.id];
    if(!r||!r.startedAt)return;
    var ms=Date.now()-r.startedAt;
    r.accumulated=(r.accumulated||0)+ms;
    r.startedAt=null;
    r.sessions.push({op:null,parts:0,ms:ms,endedAt:Date.now()});
    saveClocks();
    toast('Clocked out \u2014 '+fmtHours(ms)+' hrs on '+(c.part||c.wo));
    refreshViews();
  }
  // Parts are logged on their own, from the time breakdown — not a gate on clocking out.
  function logParts(c,op,n){
    var r=rec(c);
    r.opTotals[op]=(r.opTotals[op]||0)+n;
    var last=r.sessions[r.sessions.length-1];
    if(last&&!last.op){last.op=op;last.parts=n;}
    else r.sessions.push({op:op,parts:n,ms:0,endedAt:Date.now()});
    saveClocks();
    toast('Logged '+n+' pcs on '+op);
    refreshViews();
  }

  function advance(c){
    if(c.stage>=STAGES.length){toast('Already at the last station.');return;}
    if(isRunning(c))clockOut(c);
    var to=c.stage+1;
    c.stage=to;c.list=STAGES[to-1].name;
    moves[c.id]=to;saveMoves();
    closeSheet();
    toast('Sent to '+STAGES[to-1].name+' \u2014 local only, still move it in Trello.');
    refreshViews();
  }

  // ---- CARD FACE (MTG frame) -------------------------------------
  function flagsHTML(c){
    var f='';
    if(isLate(c))f+='<span class="flag late">'+Math.abs(c.days)+'D LATE</span>';
    var sib=siblings(c);
    if(sib)f+='<span class="flag sib">+'+sib+' ON PO</span>';
    if(isRunning(c))f+='<span class="flag run">RUNNING</span>';
    if(isMine(c)&&plain())f+='<span class="flag you">YOUR STATION</span>';
    if(c.invoice)f+='<span class="flag inv">INV '+esc(c.invoice)+'</span>';
    return f;
  }
  function prow(k,v,click){
    return '<div class="prow'+(click?' clickable':'')+'"'+(click?' data-open="time"':'')+
           '><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  }

  function cardFaceHTML(c,big,extra){
    var stage=(STAGES[c.stage-1]||{}).name||c.list||'\u2014';
    var done=partsDone(c), qty=(c.qty!=null?c.qty:null);
    var t=totalMs(c);

    // production block: qty, parts, time — one group
    var prod=prow('Qty',qty!=null?esc(qty):'\u2014')+
             prow('Parts',done+(qty!=null?(' / '+qty):''))+
             prow('Time',t>0?(fmtHours(t)+' hrs'):(c.time!=null?esc(c.time)+' hrs':'0.00 hrs'),true);

    // little op-share bar under the block
    var r=clocks[c.id];
    var bars='';
    if(r&&r.sessions&&r.sessions.length){
      var byOp={},tot=0;
      r.sessions.forEach(function(s){var o=s.op||'\u2014';byOp[o]=(byOp[o]||0)+s.ms;tot+=s.ms;});
      if(tot>0){
        var cols={'OP1':'var(--purple)','OP2':'var(--purple-lift)','OP3':'var(--pass)','\u2014':'var(--line-hot)'};
        bars='<div class="bars">'+Object.keys(byOp).map(function(o){
          return '<i style="width:'+((byOp[o]/tot)*100).toFixed(1)+'%;background:'+(cols[o]||'var(--line-hot)')+'"></i>';
        }).join('')+'</div>';
      }
    }

    var flags=flagsHTML(c);
    var art='<div class="art">'+(c.photo?'<img src="'+esc(c.photo)+'" alt="">':'<i>NO PHOTO</i>')+'</div>';

    return '<div class="plate2">'+
      '<div class="tbar"><div class="tname">'+esc(c.part||c.name||'\u2014')+'</div>'+
        '<div class="two">'+esc(c.wo)+'</div></div>'+
      art+
      '<div class="tline"><b>PO '+esc(c.po||'\u2014')+'</b><em>\u00b7</em>'+
        esc(c.customer||'\u2014')+'<em>\u00b7</em>'+esc(stage)+'</div>'+
      '<div class="tbox">'+prod+bars+'</div>'+
      (flags?'<div class="flags">'+flags+'</div>':'')+
      '<div class="bbar"><div class="coll">REV '+esc(c.rev||'\u2014')+'<br>'+esc(dueText(c))+'</div>'+
        '<div class="pt">'+done+' / '+(qty!=null?esc(qty):'?')+'</div></div>'+
      (extra||'')+
    '</div>';
  }

  function miniActsHTML(c){
    var mine=isMine(c)&&role!=='viewer';
    var b='';
    if(mine){
      b+=isRunning(c)
        ? '<button class="mb live" data-mini="status">'+fmtHMS(totalMs(c))+'</button>'+
          '<button class="mb stop" data-mini="out">Clock out</button>'
        : '<button class="mb go" data-mini="in">Clock in</button>';
    }
    b+='<a class="mb" href="'+esc(dropboxURL(c))+'" target="_blank" rel="noopener" data-mini="files">Files</a>';
    return '<div class="mini-acts">'+b+'</div>';
  }

  // ---- SHEET -----------------------------------------------------
  function openSheet(c,mode){
    openSheetId=c.id;sheetMode=mode||'card';
    var extra=(sheetMode==='time')?breakdownHTML(c):actsHTML(c);
    sheetEl.innerHTML='<button class="close" aria-label="Close">\u00d7</button>'+cardFaceHTML(c,true,extra);
    sheetEl.classList.add('open');scrim.classList.add('open');
    sheetEl.querySelector('.close').onclick=closeSheet;
    wireSheet(c);
  }
  function closeSheet(){
    openSheetId=null;sheetMode='card';
    sheetEl.classList.remove('open');scrim.classList.remove('open');
  }
  scrim.addEventListener('click',closeSheet);

  function actsHTML(c){
    var q=encodeURIComponent(c.part||'');
    var mine=isMine(c)&&role!=='viewer';
    var a='';
    if(mine){
      a+=isRunning(c)
        ? '<button class="act stop" data-do="out"><span class="an">Clock out</span>'+
          '<span class="ad">Running '+fmtHMS(totalMs(c))+'</span></button>'
        : '<button class="act go" data-do="in"><span class="an">Clock in</span>'+
          '<span class="ad">Start the timer on this job</span></button>';
      var nxt=(STAGES[c.stage]||{}).name;
      a+=nxt
        ? '<button class="act" data-do="next"><span class="an">Finish</span><span class="ad">Send to '+esc(nxt)+'</span></button>'
        : '<button class="act" disabled><span class="an">Finish</span><span class="ad">Last station</span></button>';
    }
    a+='<button class="act" data-do="time"><span class="an">Time</span>'+
        '<span class="ad">Breakdown and parts log</span></button>'+
      '<a class="act" href="'+QUOTE_TOOL+'?part='+q+'" target="_blank" rel="noopener">'+
        '<span class="an">Quote</span><span class="ad">Open this part in the quote generator</span></a>'+
      '<a class="act wide" href="'+esc(dropboxURL(c))+'" target="_blank" rel="noopener">'+
        '<span class="an">Open files</span><span class="ad">JOBSHOP / '+esc(c.customer||'\u2014')+
        ' / '+esc(c.part||'\u2014')+'</span></a>';
    if(c.url){
      a+='<a class="act wide ghost" href="'+esc(c.url)+'" target="_blank" rel="noopener">'+
        '<span class="an">Open in Trello</span><span class="ad">Move the card, edit the description</span></a>';
    }
    if(!isMine(c)&&plain()){
      a+='<div class="act wide ghost" style="cursor:default"><span class="an">Read only</span>'+
        '<span class="ad">Sitting at '+esc((STAGES[c.stage-1]||{}).name||'\u2014')+', not your station</span></div>';
    }
    return '<div class="acts">'+a+'</div>';
  }

  function breakdownHTML(c){
    var r=clocks[c.id];
    var total=totalMs(c);
    var body='';
    if(!r||!r.sessions||!r.sessions.length){
      body='<div class="none">No time logged on this card yet. Clock in to start building a history.</div>';
    }else{
      var byOp={};
      r.sessions.forEach(function(s){
        var o=s.op||'Unassigned';
        if(!byOp[o])byOp[o]={ms:0,parts:0,n:0};
        byOp[o].ms+=s.ms;byOp[o].parts+=(s.parts||0);byOp[o].n++;
      });
      var max=Math.max.apply(null,Object.keys(byOp).map(function(o){return byOp[o].ms;}))||1;
      body=Object.keys(byOp).map(function(o){
        var d=byOp[o];
        var pct=total>0?Math.round(d.ms/total*100):0;
        return '<div class="seg '+o.toLowerCase()+'">'+
          '<div class="sl"><span>'+esc(o)+' \u00b7 '+d.n+' session'+(d.n===1?'':'s')+
            (d.parts?(' \u00b7 '+d.parts+' pcs'):'')+'</span>'+
            '<b>'+fmtHours(d.ms)+' hrs \u00b7 '+pct+'%</b></div>'+
          '<div class="track"><i style="width:'+Math.round(d.ms/max*100)+'%"></i></div></div>';
      }).join('');
      if(c.qty){
        var done=partsDone(c);
        var perPart=done>0?(total/done/3600000):0;
        body+='<div class="none" style="margin-top:4px">'+done+' of '+c.qty+' parts logged'+
          (perPart>0?(' \u00b7 '+perPart.toFixed(2)+' hrs per part'):'')+'</div>';
      }
    }
    return '<div class="brk">'+
      '<div class="bh">Time breakdown <span>'+fmtHours(total)+' hrs</span></div>'+
      body+
      '<div class="logrow">'+
        '<select id="lOp">'+OPS.map(function(o){return '<option>'+o+'</option>';}).join('')+'</select>'+
        '<input id="lParts" type="number" min="1" step="1" inputmode="numeric" placeholder="Parts finished">'+
        '<button data-do="logparts">Log</button>'+
      '</div>'+
      '<div class="acts" style="margin:9px 0 0"><button class="act ghost wide" data-do="back">'+
        '<span class="an">Back to card</span><span class="ad">Actions, quote and files</span></button></div>'+
    '</div>';
  }

  function wireSheet(c){
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-do],[data-open]'),function(b){
      b.onclick=function(ev){
        ev.stopPropagation();
        var a=b.getAttribute('data-do')||('time');
        if(a==='in'){clockIn(c);openSheet(c,'card');}
        else if(a==='out'){clockOut(c);openSheet(c,'card');}
        else if(a==='next'){advance(c);}
        else if(a==='time'){openSheet(c,'time');}
        else if(a==='back'){openSheet(c,'card');}
        else if(a==='logparts'){
          var op=sheetEl.querySelector('#lOp').value;
          var n=parseInt(sheetEl.querySelector('#lParts').value,10);
          if(isNaN(n)||n<1){sheetEl.querySelector('#lParts').focus();return;}
          logParts(c,op,n);
          openSheet(c,'time');
        }
      };
    });
  }

  // ---- LANES -----------------------------------------------------
  STAGES.forEach(function(s,i){
    var lane=document.createElement('div');
    lane.className='lane';
    lane.innerHTML='<button class="node"></button><div class="fanUp"></div><div class="fanDown"></div>';
    flow.appendChild(lane);
    laneEls.push(lane);
    lane.querySelector('.node').addEventListener('click',function(ev){
      ev.stopPropagation();
      if(window.innerWidth<=700&&!openState[i]){
        STAGES.forEach(function(x,j){if(j!==i)openState[j]=false;});
        renderAll();
      }
      openState[i]=!openState[i];
      renderLane(i);
    });
    nodeEls.push(lane.querySelector('.node'));
  });

  // Hover and wheel are hit-tested against lane geometry rather than bound to
  // each lane. Cards overhang into neighbouring lanes, so per-lane mouseenter
  // fires mouseleave the moment the cursor crosses onto a card — this reads
  // the pointer's x position instead, which can't be fooled by overlap, and
  // it works the same on a touchscreen laptop where mouse events still fire.
  function laneAt(clientX){
    for(var i=0;i<laneEls.length;i++){
      var r=laneEls[i].getBoundingClientRect();
      if(clientX>=r.left&&clientX<r.right) return i;
    }
    return -1;
  }
  flow.addEventListener('mousemove',function(e){
    var i=laneAt(e.clientX);
    var changed=false;
    for(var j=0;j<STAGES.length;j++){
      var want=(j===i);
      if(!!peekState[j]!==want){peekState[j]=want;changed=true;}
    }
    if(changed) renderAll();
  });
  flow.addEventListener('mouseleave',function(){
    var changed=false;
    for(var j=0;j<STAGES.length;j++){ if(peekState[j]){peekState[j]=false;changed=true;} }
    if(changed) renderAll();
  });
  flow.addEventListener('wheel',function(e){
    var i=laneAt(e.clientX);
    if(i<0) return;
    var n=stageCards(i+1).length;
    if(n<2) return;
    e.preventDefault();
    focusIdx[i]=(((focusIdx[i]||0)+(e.deltaY>0?1:-1))%n+n)%n;
    renderLane(i);
  },{passive:false});

  // touch: swipe sideways for stages, up/down to rifle cards
  (function(){
    var sx=0,sy=0,st=0,go=false;
    flow.addEventListener('touchstart',function(e){
      if(e.touches.length!==1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();go=true;
    },{passive:true});
    flow.addEventListener('touchend',function(e){
      if(!go)return;go=false;
      var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st>700)return;
      var adx=Math.abs(dx),ady=Math.abs(dy);
      if(adx<42&&ady<42)return;
      var oi=-1;
      for(var i=0;i<STAGES.length;i++){if(openState[i]){oi=i;break;}}
      if(adx>ady){
        var next=(oi<0)?(dx<0?0:STAGES.length-1):oi+(dx<0?1:-1);
        if(next<0||next>=STAGES.length)return;
        STAGES.forEach(function(x,j){openState[j]=false;});
        openState[next]=true;
        renderAll();
      }else if(oi>=0){
        var n=stageCards(oi+1).length;
        if(n<2)return;
        focusIdx[oi]=(((focusIdx[oi]||0)+(dy<0?1:-1))%n+n)%n;
        renderLane(oi);
      }
    },{passive:true});
  })();

  function renderLane(i){
    var s=STAGES[i],lane=laneEls[i],node=nodeEls[i];
    var cards=stageCards(i+1);
    var late=cards.filter(isLate).length;
    var mineStage=roleDef().stages.indexOf(i+1)>=0&&plain();

    node.className='node'+(openState[i]?' on':'')+(peekState[i]&&!openState[i]?' peek':'')+
                   (mineStage?' mine':'');
    node.innerHTML=(late?'<span class="late"></span>':'')+
      '<span class="plate"><span class="lbl">'+s.name+'</span>'+
      '<span class="cnt">'+cards.length+'</span></span><span class="dot"></span>';

    var up=lane.querySelector('.fanUp'),down=lane.querySelector('.fanDown');
    up.innerHTML='';down.innerHTML='';
    var host=(s.dir==='up')?up:down;
    if(!(openState[i]||peekState[i]))return;

    if(!cards.length){
      var e=document.createElement('div');
      e.className='laneempty';e.textContent='No cards.';
      host.appendChild(e);
      return;
    }

    var openNow=!!openState[i];
    var n=cards.length;
    var fi=((focusIdx[i]||0)%n+n)%n;

    if(openNow&&n>1){
      var ct=document.createElement('div');
      ct.className='counter';ct.textContent=(fi+1)+' / '+n;
      host.appendChild(ct);
    }

    var reveal=openNow?1:0.46;
    var step=openNow?(n>6?26:34):22;
    var base=openNow?30:24;

    cards.forEach(function(c,idx){
      var elc=document.createElement('div');
      var isFocus=(idx===fi);
      var mine=isMine(c)&&plain();
      var notMine=!isMine(c)&&plain();
      elc.className='card'+(isLate(c)?' late':'')+(isFocus?' focus':'')+
                    (mine?' mine':'')+(notMine?' notmine':'')+(hits[c.id]?' hit':'');
      elc.innerHTML=cardFaceHTML(c,false,isFocus?miniActsHTML(c):'');
      elc._cid=c.id;
      elc.addEventListener('click',function(ev){
        if(ev.target.closest('[data-mini]'))return;
        ev.stopPropagation();
        openSheet(c,ev.target.closest('[data-open="time"]')?'time':'card');
      });
      host.appendChild(elc);

      Array.prototype.forEach.call(elc.querySelectorAll('[data-mini]'),function(b){
        b.onclick=function(ev){
          ev.stopPropagation();
          var a=b.getAttribute('data-mini');
          if(a==='in')clockIn(c);
          else if(a==='out')clockOut(c);
          else if(a==='status')openSheet(c,'time');
        };
      });

      var d=idx-fi,ad=Math.abs(d);
      elc.style.zIndex=String(60-ad);
      var tx=d*step*reveal;
      var ty=(base+ad*7)*reveal*(s.dir==='up'?-1:1);
      var rot=d*(openNow?2.5:2)*reveal;
      var scale=(openNow?1:0.86)*(isFocus?1:0.94);
      var op=isFocus?1:(openNow?0.94:0.9);

      setTimeout((function(elc,tx,ty,rot,scale,op,ad){
        return function(){
          elc.style.transitionDelay=(ad*22)+'ms';
          elc.style.transform='translate(calc(-50% + '+tx+'px), '+ty+'px) rotate('+rot+'deg) scale('+scale+')';
          elc.style.opacity=String(op);
          elc.classList.add('show');
        };
      })(elc,tx,ty,rot,scale,op,ad),20);
    });
  }
  function renderAll(){STAGES.forEach(function(s,i){renderLane(i);});}

  // ---- SEARCH ----------------------------------------------------
  var sscrim=document.getElementById('sscrim');
  var spal=document.getElementById('spal');
  var sInput=document.getElementById('sInput');
  var sRes=document.getElementById('sRes');
  var sFlat=[],sSel=0,sOpen=false;

  function openSearch(){
    sOpen=true;
    sscrim.classList.add('open');spal.classList.add('open');
    sInput.value='';sSel=0;
    runSearch('');
    setTimeout(function(){sInput.focus();},30);
  }
  function closeSearch(){
    sOpen=false;
    sscrim.classList.remove('open');spal.classList.remove('open');
  }
  sscrim.addEventListener('click',closeSearch);
  document.getElementById('searchBtn').onclick=openSearch;

  function buildResults(q){
    q=q.trim().toLowerCase();
    var groups=[
      {key:'Parts',items:[]},{key:'Work orders',items:[]},
      {key:'POs',items:[]},{key:'Invoices',items:[]},{key:'Customers',items:[]}
    ];
    if(!q){
      // no query yet: offer whatever is late, as a useful default
      CARDS.filter(isLate).slice(0,8).forEach(function(c){
        groups[0].items.push({label:c.part||c.wo,meta:'PO '+(c.po||'\u2014')+' \u00b7 '+
          Math.abs(c.days)+'d over',note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      });
      return groups.filter(function(g){return g.items.length;});
    }
    var seenPO={},seenCust={};
    CARDS.forEach(function(c){
      if((c.part||'').toLowerCase().indexOf(q)>=0){
        groups[0].items.push({label:c.part,meta:(c.customer||'')+' \u00b7 PO '+(c.po||'\u2014')+
          ' \u00b7 qty '+(c.qty!=null?c.qty:'\u2014'),note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if((c.wo||'').toLowerCase().indexOf(q)>=0){
        groups[1].items.push({label:c.wo,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.invoice&&String(c.invoice).toLowerCase().indexOf(q)>=0){
        groups[3].items.push({label:'INV '+c.invoice,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.po&&String(c.po).toLowerCase().indexOf(q)>=0&&!seenPO[c.po]){
        seenPO[c.po]=1;
        var sib=CARDS.filter(function(x){return x.po===c.po;});
        groups[2].items.push({label:'PO '+c.po,meta:sib.map(function(x){return x.part;}).join(', '),
          note:sib.length+' card'+(sib.length===1?'':'s'),ids:sib.map(function(x){return x.id;})});
      }
      if(c.customer&&c.customer.toLowerCase().indexOf(q)>=0&&!seenCust[c.customer]){
        seenCust[c.customer]=1;
        var mine=CARDS.filter(function(x){return x.customer===c.customer;});
        groups[4].items.push({label:c.customer,meta:mine.length+' open card'+(mine.length===1?'':'s'),
          note:'',ids:mine.map(function(x){return x.id;})});
      }
    });
    return groups.filter(function(g){return g.items.length;});
  }

  function runSearch(q){
    var groups=buildResults(q);
    sFlat=[];
    if(!groups.length){
      sRes.innerHTML='<div class="sempty">Nothing matches that.</div>';
      return;
    }
    var html='';
    groups.forEach(function(g){
      html+='<div class="sgrp">'+esc(g.key)+'</div>';
      g.items.slice(0,8).forEach(function(it){
        var idx=sFlat.length;
        sFlat.push(it);
        html+='<div class="sitem" data-i="'+idx+'">'+
          '<span class="sk">'+esc(it.label)+'</span>'+
          '<span class="sm">'+esc(it.meta||'')+'</span>'+
          '<span class="sn">'+esc(it.note||'')+'</span></div>';
      });
    });
    sRes.innerHTML=html;
    if(sSel>=sFlat.length) sSel=0;
    paintSel();
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      el.onclick=function(){ sSel=+el.getAttribute('data-i'); choose(); };
    });
  }
  function paintSel(){
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      var on=(+el.getAttribute('data-i')===sSel);
      el.classList.toggle('sel',on);
      if(on&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    });
  }
  function choose(){
    var it=sFlat[sSel];
    if(!it)return;
    closeSearch();
    gotoCards(it.ids);
  }

  // Bring the timeline to a card (or a PO's whole set) and mark them.
  function gotoCards(ids){
    hits={};
    ids.forEach(function(id){hits[id]=1;});
    setView('timeline');
    var stagesHit={};
    ids.forEach(function(id){
      var c=byId(id);
      if(c) stagesHit[c.stage]=1;
    });
    STAGES.forEach(function(s,i){ openState[i]=!!stagesHit[i+1]; });
    // focus the first hit inside each opened stage
    Object.keys(stagesHit).forEach(function(st){
      var list=stageCards(+st);
      for(var i=0;i<list.length;i++){
        if(hits[list[i].id]){ focusIdx[+st-1]=i; break; }
      }
    });
    renderAll();
    if(ids.length===1){
      var c=byId(ids[0]);
      if(c) setTimeout(function(){openSheet(c,'card');},260);
    } else {
      toast(ids.length+' cards across '+Object.keys(stagesHit).length+' stage'+
            (Object.keys(stagesHit).length===1?'':'s'));
    }
    setTimeout(function(){hits={};renderAll();},6000);
  }

  sInput.addEventListener('input',function(){sSel=0;runSearch(sInput.value);});
  sInput.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();sSel=Math.min(sSel+1,sFlat.length-1);paintSel();}
    else if(e.key==='ArrowUp'){e.preventDefault();sSel=Math.max(sSel-1,0);paintSel();}
    else if(e.key==='Enter'){e.preventDefault();choose();}
    else if(e.key==='Escape'){e.preventDefault();closeSearch();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ if(sOpen)closeSearch(); else closeSheet(); return; }
    var typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||''));
    if(!sOpen&&!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){
      e.preventDefault();openSearch();
    }
  });
  // terminal shell can hand us a card to jump to
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='sr:focusCard'&&d.id) gotoCards([d.id]);
    if(d.type==='sr:search') openSearch();
  });

  // ---- DASHBOARD -------------------------------------------------
  function priority(a,b){
    if(isRunning(a)!==isRunning(b))return isRunning(a)?-1:1;
    var ad=(a.days==null)?9999:a.days,bd=(b.days==null)?9999:b.days;
    return ad-bd;
  }
  function renderDash(){
    var r=roleDef();
    var mine=CARDS.filter(function(c){return isMine(c)&&c.active;}).sort(priority);
    document.getElementById('dTitle').textContent=r.label;
    var lateN=mine.filter(isLate).length;
    document.getElementById('dSub').textContent=
      r.stages.length===0
        ? 'Pick a station in the selector above to get a work queue.'
        : mine.length+' job'+(mine.length===1?'':'s')+' at your station'+
          (lateN?(' \u00b7 '+lateN+' late'):'')+' \u00b7 highest priority first';

    var host=document.getElementById('dList');
    if(!mine.length){
      host.innerHTML='<div class="dempty">Nothing waiting at your station right now. '+
        'Switch to <b>Timeline</b> to see where everything else is sitting.</div>';
      return;
    }
    host.innerHTML='';
    mine.forEach(function(c){
      var row=document.createElement('div');
      row.className='drow'+(isRunning(c)?' running':'');
      var nxt=(STAGES[c.stage]||{}).name;
      var done=partsDone(c);
      row.innerHTML=
        '<div class="dstripe"><span>'+esc(c.wo)+'</span></div>'+
        '<div class="in"><div class="top">'+
          '<div class="who"><div class="dpart">'+esc(c.part||c.name||'\u2014')+'</div>'+
            '<div class="meta">PO '+esc(c.po||'\u2014')+' \u00b7 '+esc(c.customer||'\u2014')+
              ' \u00b7 '+esc((STAGES[c.stage-1]||{}).name||'')+'<br>'+
              done+' / '+esc(c.qty!=null?c.qty:'?')+' parts \u00b7 '+fmtHours(totalMs(c))+' hrs \u00b7 '+
              esc(dueText(c))+'</div></div>'+
          '<div class="timer" data-do="time"><span data-clock="'+esc(c.id)+'">'+fmtHMS(totalMs(c))+
            '</span><small>'+(isRunning(c)?'RUNNING':'LOGGED')+'</small></div>'+
        '</div>'+
        (flagsHTML(c)?'<div class="flags">'+flagsHTML(c)+'</div>':'')+
        '<div class="btns">'+
          (isRunning(c)
            ? '<button class="act stop" data-do="out"><span class="an">Clock out</span><span class="ad">Stop the timer</span></button>'
            : '<button class="act go" data-do="in"><span class="an">Clock in</span><span class="ad">Start the timer</span></button>')+
          (nxt
            ? '<button class="act" data-do="next"><span class="an">Finish</span><span class="ad">Send to '+esc(nxt)+'</span></button>'
            : '<button class="act" disabled><span class="an">Finish</span><span class="ad">Last station</span></button>')+
          '<button class="act wide ghost" data-do="open"><span class="an">Card</span>'+
            '<span class="ad">Full card, quote and files</span></button>'+
        '</div></div>';
      Array.prototype.forEach.call(row.querySelectorAll('[data-do]'),function(b){
        b.onclick=function(){
          var a=b.getAttribute('data-do');
          if(a==='in')clockIn(c);
          else if(a==='out')clockOut(c);
          else if(a==='next')advance(c);
          else if(a==='time')openSheet(c,'time');
          else if(a==='open')openSheet(c,'card');
        };
      });
      host.appendChild(row);
    });
  }

  setInterval(function(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-clock]'),function(t){
      var c=byId(t.getAttribute('data-clock'));
      if(c)t.textContent=fmtHMS(totalMs(c));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.mb.live'),function(b){
      var card=b.closest('.card');
      if(!card||!card._cid)return;
      var c=byId(card._cid);
      if(c&&isRunning(c))b.textContent=fmtHMS(totalMs(c));
    });
  },1000);

  function refreshViews(){
    renderAll();renderDash();
    if(openSheetId){var c=byId(openSheetId);if(c)openSheet(c,sheetMode);}
  }

  // ---- VIEW SWITCH -----------------------------------------------
  var tabT=document.getElementById('tabTimeline'),tabD=document.getElementById('tabDash');
  function setView(v){
    view=v;
    tabT.classList.toggle('on',v==='timeline');
    tabD.classList.toggle('on',v==='dashboard');
    document.getElementById('scTimeline').classList.toggle('on',v==='timeline');
    document.getElementById('scDash').classList.toggle('on',v==='dashboard');
    document.getElementById('btnAll').style.display=(v==='timeline')?'':'none';
    setHint();
    if(v==='dashboard')renderDash();else renderAll();
  }
  tabT.onclick=function(){setView('timeline');};
  tabD.onclick=function(){setView('dashboard');};

  function setHint(){
    var h=document.getElementById('hint');
    h.textContent=(view==='dashboard')
      ? 'Your jobs, highest priority first \u00b7 press / to search'
      : 'Hover a stage to peek \u00b7 click to hold open \u00b7 wheel or swipe to rifle cards \u00b7 press / to search';
  }

  var roleSel=document.getElementById('roleSel');
  roleSel.innerHTML=ROLES.map(function(r){
    return '<option value="'+r.id+'"'+(r.id===role?' selected':'')+'>'+r.label+'</option>';
  }).join('');
  roleSel.onchange=function(){
    role=roleSel.value;lsSet('sr_role',role);
    toast('Station set to '+roleDef().label);
    refreshViews();
  };
  document.getElementById('btnAll').addEventListener('click',function(){
    var anyClosed=STAGES.some(function(s,i){return !openState[i];});
    STAGES.forEach(function(s,i){openState[i]=anyClosed;});
    this.textContent=anyClosed?'Close all':'Open all';
    renderAll();
  });

  // ---- DEMO DATA (only when /api/trello can't be reached) ---------
  function demoCards(){
    var parts=[
      ['100844','ROBERTS','15902','B',40],['100849','ROBERTS','15902','B',40],
      ['100846','ROBERTS','15902','A',40],['100101','ROBERTS','15935','C',8],
      ['100151','ROBERTS','15935','C',8],['TRAM_G2-01046','FTI','266677','A',12],
      ['BRKT-9','FTI','266550','D',20],['SLV-2207','FTI','266612','A',30],
      ['PIN-4410','ROBERTS','15948','B',150],['HSG-1180','FTI','266701','B',6],
      ['CLP-3302','ROBERTS','15951','A',75],['MNT-0074','FTI','266688','C',18],
      ['SPCR-119','ROBERTS','15944','A',200],['ADPT-556','FTI','266720','B',10],
      ['ROD-8821','ROBERTS','15960','A',24],['CAM-0453','FTI','266733','E',4],
      ['BSHG-207','ROBERTS','15955','B',90],['FLNG-330','FTI','266742','A',14],
      ['KEY-1102','ROBERTS','15962','C',60],['GDE-7789','FTI','266750','B',22]
    ];
    var now=Math.floor(Date.now()/1000);
    return parts.map(function(p,i){
      var stage=1+Math.floor(Math.random()*6);
      var days;
      if(Math.random()<0.25)days=-(2+Math.floor(Math.random()*24));
      else if(Math.random()<0.4)days=Math.floor(Math.random()*7);
      else days=8+Math.floor(Math.random()*30);
      var shipped=(stage===6);
      var created=now-Math.floor(Math.random()*400*86400);
      return {
        id:created.toString(16)+String(1000+i),
        part:p[0],name:p[0]+' \u2014 PO '+p[2],customer:p[1],po:p[2],rev:p[3],qty:p[4],
        stage:stage,list:STAGES[stage-1].name,days:days,
        active:!shipped,shipped:shipped,
        invoice:(shipped&&Math.random()<0.6)?String(1053+i):null,
        time:null,op1:null,photo:null,url:null
      };
    });
  }

  function ingest(cards,demo){
    CARDS=cards.map(function(c){
      var o={};
      for(var k in c)if(Object.prototype.hasOwnProperty.call(c,k))o[k]=c[k];
      o._created=cardCreated(c.id);
      if(moves[o.id]){o.stage=moves[o.id];o.list=(STAGES[o.stage-1]||{}).name||o.list;}
      return o;
    });
    assignWorkOrders(CARDS);
    document.getElementById('sOpen').textContent=CARDS.filter(function(c){return c.active;}).length;
    document.getElementById('sLate').textContent=CARDS.filter(isLate).length;
    document.getElementById('sDemo').style.display=demo?'':'none';
    refreshViews();
  }

  function load(){
    return fetch('/api/trello',{credentials:'same-origin'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(d){
        if(d.error)throw new Error(d.error);
        if(!d.cards||!d.cards.length)throw new Error('no cards');
        ingest(d.cards,false);
      })
      .catch(function(){if(!CARDS.length)ingest(demoCards(),true);});
  }

  setHint();
  load();
  setInterval(load,120000);
})();
</script>
