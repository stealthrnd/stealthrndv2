<meta charset="utf-8">
<!-- TIMELINE.HTML — loads inside terminal.html's Timeline station. Version in APP_VERSION below. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Timeline — Stealth R&amp;D</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --purple:#9233E6; --purple-lift:#A855F7; --purple-deep:#6B21C4;
    --purple-tint:rgba(146,51,230,.10);
    --white:#FFFFFF; --silver:#CCCCCC;
    --bg:#232327; --panel:#2C2C31; --raised:#35353B; --sunken:#060606;
    --line:#43434B; --line-hot:#54545E;
    --ink:#F4F4F6; --dim:#A6A6B2; --faint:#7C7C88;
    --pass:#4ADE80; --warn:#F0B429; --fail:#F87171;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --disp:'Barlow Condensed','Oswald',system-ui,sans-serif;
    /* card stock */
    --frame:#1A1A1F; --frame-2:#0E0E12;
    --face:#33333C; --face-2:#26262D;
    --rule:rgba(255,255,255,.11);
    --off:#2B2B32; --off-2:#212126;
  }
  html,body{height:100%}
  /* transparent: this file runs inside terminal.html's iframe and the dither canvas
     lives behind it. Standalone it falls back to --bg via the html rule below. */
  html{background:transparent}
  body{margin:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:13px;
       -webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- top bar ---------- */
  .bar{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:8px 12px;
       border-bottom:1px solid var(--line);background:rgba(35,35,39,.72);
       backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);flex-wrap:wrap}
  .bar .t{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.18em;
          text-transform:uppercase;color:var(--white)}
  .bar .t span{color:var(--purple-lift)}
  .toggle{display:flex;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
  .toggle button{background:none;border:none;color:var(--faint);font-family:var(--disp);
          font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
          padding:7px 14px;cursor:pointer;transition:all .15s}
  .toggle button.on{background:var(--purple);color:var(--white)}
  .searchbtn{flex:1;max-width:230px;display:flex;align-items:center;gap:8px;background:var(--sunken);
    border:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11px;
    padding:7px 11px;cursor:pointer;text-align:left}
  .searchbtn:hover{border-color:var(--purple);color:var(--dim)}
  .searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:9px;border:1px solid var(--line);
    padding:1px 4px;color:var(--faint)}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .stat{font-size:10px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
  .stat b{color:var(--white);font-weight:500}
  .stat.demo{color:var(--warn);border:1px solid rgba(240,180,41,.4);padding:3px 7px}
  select.role,button.mini{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
       font-family:var(--mono);font-size:10px;padding:5px 9px;cursor:pointer}
  select.role:focus{outline:none;border-color:var(--purple)}
  button.mini:hover{border-color:var(--purple);color:var(--purple-lift)}
  .help{margin-left:2px;width:17px;height:17px;flex-shrink:0;border:1px solid var(--line);
    background:none;color:var(--faint);font-family:var(--mono);font-size:10px;line-height:1;
    cursor:help;border-radius:50%;padding:0}
  .help:hover{border-color:var(--purple);color:var(--purple-lift)}

  .screen{flex:1;min-height:0;display:none}
  .screen.on{display:flex}

  /* ---------- TIMELINE ---------- */
  #scTimeline{flex-direction:column}
  .flow{position:relative;flex:1;display:flex;padding:0 6px;min-height:0;overflow:hidden;touch-action:pan-y}
  .flow::before{content:'';position:absolute;left:24px;right:24px;top:50%;height:1px;z-index:0;
    background:linear-gradient(90deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.34) 14%,
      var(--purple-lift) 50%,rgba(255,255,255,.34) 86%,rgba(255,255,255,.10) 100%)}
  .flow::after{content:'';position:absolute;left:24px;right:24px;top:50%;height:5px;z-index:0;
    transform:translateY(-2px);opacity:.32;filter:blur(4px);
    background:linear-gradient(90deg,transparent 20%,var(--purple) 50%,transparent 80%)}
  .lane{flex:1;position:relative;transition:flex-grow .34s cubic-bezier(.2,.8,.2,1),opacity .28s}
  /* Zoom: the claimed station takes the width, the rest collapse to markers.
     Ratios not fixed widths, so it still works at any viewport. */
  .lane.zoom{flex-grow:4.2}
  .lane.shrunk{flex-grow:.42;opacity:.5}
  .lane.shrunk:hover{opacity:.92}
  @media(max-width:700px){.lane.zoom{flex-grow:6}.lane.shrunk{flex-grow:.3}}

  /* node sits above the cards and carries its own plate so nothing overlaps it */
  .node{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:80;
        background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
        align-items:center;gap:6px;padding:4px}
  .node .plate{display:flex;align-items:center;gap:7px;background:rgba(20,20,22,.88);
    border:1px solid var(--line);padding:3px 9px;white-space:nowrap;transition:all .16s}
  .node.peek .plate,.node.on .plate{border-color:var(--white)}
  .node .lbl{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--faint);transition:color .16s}
  .node.on .lbl,.node.peek .lbl{color:var(--white)}
  .node.mine .lbl{color:var(--pass)}
  .node .cnt{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;
             border-left:1px solid var(--line);padding-left:7px;font-variant-numeric:tabular-nums}
  .node .cnt.pos{color:var(--white)}
  .node.on .cnt{color:var(--purple-lift)}
  .node .dot{width:13px;height:13px;transform:rotate(45deg);background:var(--sunken);
             border:1px solid rgba(255,255,255,.45);transition:all .16s}
  .node.peek .dot{border-color:var(--white);background:var(--purple-deep)}
  .node.on .dot{border-color:var(--white);background:var(--purple)}
  .node.mine .dot{border-color:var(--pass)}
  .node.mine.on .dot{background:var(--pass)}
  .node .late{position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:var(--fail);
              transform:rotate(45deg)}

  .fanUp,.fanDown{position:absolute;left:50%;z-index:2}
  .fanUp{bottom:calc(50% + 34px)}
  .fanDown{top:calc(50% + 34px)}
  .laneempty{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;
             color:var(--faint);white-space:nowrap}
  .fanUp .laneempty{bottom:calc(50% + 38px)}
  .fanDown .laneempty{top:calc(50% + 38px)}

  /* ---------- THE CARD (MTG frame) ---------- */
  .card{position:absolute;left:50%;width:216px;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px;
    opacity:0;pointer-events:none;cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.6);
    transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .22s,border-color .16s}
  .fanUp .card{bottom:0;transform-origin:bottom center;transform:translate(-50%,0) scale(.72)}
  .fanDown .card{top:0;transform-origin:top center;transform:translate(-50%,0) scale(.72)}
  .card.show{opacity:1;pointer-events:auto}
  /* riffle: a short, flat-out transition with no stagger, used while scrolling or
     sweeping the stack. GPU hints keep it off the main thread. */
  /* will-change is applied only while a lane is actually moving. Leaving it on
     every card permanently forces a compositor layer per card, which on a tablet
     with 20 cards costs more memory than it saves. */
  .card.riffle,.flow.dragging .card{will-change:transform,opacity}
  .card.riffle{transition:transform .16s cubic-bezier(.25,.9,.3,1),opacity .12s linear,
    border-color .16s}
  /* While a finger is actually dragging, the transition is dead weight — every
     frame sets a new target the tween never reaches, so it just adds lag between
     the thumb and the cards. Position directly instead and let the finger be the
     animation; .riffle takes over again on release. */
  .flow.dragging .card{transition:none!important}
  @media(prefers-reduced-motion:reduce){
    .card,.card.riffle{transition:opacity .12s linear}
  }
  .card.focus{border-color:var(--purple-lift)}
  .card.focus .plate2{border-color:var(--purple)}
  .card.mine{border-color:rgba(74,222,128,.55)}
  .card.hit{border-color:var(--warn)}
  .plate2{border:1px solid var(--rule);border-radius:5px;overflow:hidden;
          background:linear-gradient(160deg,var(--face) 0%,var(--face-2) 100%)}
  .card.notmine .plate2{background:linear-gradient(160deg,var(--off) 0%,var(--off-2) 100%)}

  /* title bar — part number left, work order right (the "cost") */
  .tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;
        background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
        border-bottom:1px solid var(--rule)}
  .tname{flex:1;min-width:0;font-family:var(--disp);font-size:18px;font-weight:700;
         color:var(--white);line-height:1.05;letter-spacing:.01em;word-break:break-word}
  .twо,.two{flex-shrink:0}
  .two{font-family:var(--disp);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--white);
       background:var(--purple);border:1px solid rgba(255,255,255,.35);padding:2px 6px;
       transform:skewX(-10deg)}
  .card.mine .two{background:var(--pass);color:var(--sunken)}

  /* art window */
  .art{position:relative;height:72px;margin:5px 6px;background:var(--sunken);
       border:1px solid var(--rule);overflow:hidden;
       background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px)}
  .art i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;
         font-family:var(--disp);font-size:8px;letter-spacing:.22em;color:var(--faint)}
  .art img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---- photo / model switch ---- */
  .artsw{position:absolute;right:4px;bottom:4px;display:flex;gap:2px;z-index:2;
    background:rgba(6,6,6,.72);border:1px solid var(--rule);padding:1px}
  .artsw button{background:none;border:none;color:var(--faint);cursor:pointer;
    font-family:var(--disp);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 5px;transition:all .14s}
  .artsw button:hover{color:var(--white)}
  .artsw button.on{background:var(--purple);color:var(--white)}
  .sheet .artsw button{font-size:9.5px;padding:3px 9px}
  .modelph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4px}
  .modelph svg{width:48%;max-width:110px;height:auto;opacity:.5}
  .modelph svg path,.modelph svg circle{fill:none;stroke:var(--purple-lift);stroke-width:1.4;
    vector-effect:non-scaling-stroke}
  .modelph i{position:static;transform:none;font-style:normal;font-family:var(--disp);
    font-size:7.5px;letter-spacing:.18em;color:var(--faint)}
  .sheet .modelph i{font-size:9px}

  /* type line — PO · CUSTOMER · STAGE, grouped as one identity strip */
  .tline{margin:0 6px;padding:4px 7px;background:rgba(255,255,255,.05);
         border:1px solid var(--rule);font-family:var(--disp);font-size:11px;letter-spacing:.1em;
         text-transform:uppercase;color:var(--white);display:flex;gap:6px;align-items:center;
         white-space:nowrap;overflow:hidden}
  .tline b{font-weight:700;color:var(--purple-lift)}
  .card.mine .tline b{color:var(--pass)}
  .tline em{font-style:normal;color:var(--faint)}

  /* text box — production block: qty, parts, time */
  .tbox{margin:5px 6px 0;padding:6px 7px;background:rgba(0,0,0,.28);border:1px solid var(--rule);
        min-height:52px}
  .prow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2.5px 0}
  .prow .k{color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .prow .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .prow.clickable{cursor:pointer;margin:0 -3px;padding:1.5px 3px}
  .prow.clickable:hover{background:var(--purple-tint)}
  .prow.clickable .v{color:var(--purple-lift);border-bottom:1px dotted var(--purple)}
  .bars{display:flex;height:4px;margin-top:6px;gap:1px;background:var(--sunken)}
  .bars i{display:block;height:100%}

  .flags{display:flex;gap:3px;flex-wrap:wrap;margin:5px 6px 0}
  .flag{font-size:9px;letter-spacing:.07em;padding:1.5px 5px;color:var(--faint);
        border:1px solid var(--line);white-space:nowrap}
  .flag.late{color:var(--fail);border-color:rgba(248,113,113,.5)}
  .flag.sib{color:var(--warn);border-color:rgba(240,180,41,.5)}
  .flag.inv{color:var(--pass);border-color:rgba(74,222,128,.5)}
  /* Money state, three colours ordered by how much it wants from you:
     red = not billed yet, amber = billed and waiting, green = done. */
  .flag.noinv{color:var(--fail);border-color:rgba(248,113,113,.6);
    background:rgba(248,113,113,.1)}
  .flag.unpaid{color:var(--warn);border-color:rgba(240,180,41,.6);
    background:rgba(240,180,41,.08)}
  .flag.paid{color:var(--pass);border-color:rgba(74,222,128,.6);
    background:rgba(74,222,128,.1)}
  .flag.you{color:var(--pass);border-color:rgba(74,222,128,.6)}
  .flag.run{color:var(--white);border-color:var(--purple);background:var(--purple-tint)}
  .flag.qcok{color:var(--pass);border-color:rgba(74,222,128,.5)}
  .flag.qcbad{color:var(--fail);border-color:rgba(248,113,113,.55)}
  .flag.qcopen{color:var(--warn);border-color:rgba(240,180,41,.5)}

  /* bottom bar — collector line left, qty box right (the "power/toughness") */
  .bbar{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
        margin:6px 6px 5px;padding-top:5px;border-top:1px solid var(--rule)}
  .coll{font-size:9.5px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;line-height:1.45}
  .pt{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--white);
      background:var(--sunken);border:1px solid rgba(255,255,255,.3);padding:3px 9px;
      white-space:nowrap;font-variant-numeric:tabular-nums}
  .card.late .pt{border-color:rgba(248,113,113,.6);color:var(--fail)}

  .mini-acts{display:none;gap:4px;margin:6px 6px 2px}
  .card.focus .mini-acts{display:flex}
  .mb{flex:1;background:var(--sunken);border:1px solid var(--line);color:var(--dim);
      font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
      padding:7px 3px;cursor:pointer;text-align:center;text-decoration:none;white-space:nowrap}
  .mb:hover{border-color:var(--purple);color:var(--white)}
  .mb.go{border-color:rgba(74,222,128,.45);color:var(--pass)}
  .mb.stop{border-color:rgba(248,113,113,.45);color:var(--fail)}
  .mb.live{border-color:var(--purple);color:var(--white);background:var(--purple-tint)}

  /* ---------- overlays ----------
     Layer stack, deliberately spaced so timeline chrome can't punch through:
       board content .......... 0–99  (.node 80, .counter 90)
       card sheet ............. 200 / 201
       search palette ......... 210 / 211
       toast .................. 300
     The old sheet sat at 60/61 — under .node and .counter — which is why stage
     nodes and lane counters showed through an open card. */
  .scrim{position:fixed;inset:0;background:rgba(6,6,6,.76);z-index:200;opacity:0;
         pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:201;
    width:min(440px,calc(100vw - 26px));max-height:calc(100vh - 30px);overflow-y:auto;
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid var(--purple);border-radius:10px;padding:6px;
    box-shadow:0 24px 56px rgba(0,0,0,.75);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s}
  .sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  /* the open sheet is colour-keyed to the mode, so "where am I" is answered
     before you read anything: purple = the card, amber = clock, green = quality */
  .sheet.m-time{border-color:var(--warn);box-shadow:0 24px 56px rgba(0,0,0,.75),0 0 0 1px rgba(240,180,41,.25)}
  .sheet.m-qc{border-color:var(--pass);box-shadow:0 24px 56px rgba(0,0,0,.75),0 0 0 1px rgba(74,222,128,.25)}
  .sheet.m-info{border-color:#CCC;box-shadow:0 24px 56px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.18)}

  /* ---------- Details tab: every editable number in one place ---------- */
  .inf{margin:7px 6px 4px}
  .infr{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;
    padding:5px 0;border-bottom:1px solid rgba(53,53,59,.55)}
  .infr:last-of-type{border-bottom:none}
  .infr label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .infr input{width:100%;background:#050506;border:1px solid var(--line);
    color:var(--white);font-family:var(--mono);font-size:13px;padding:6px 7px}
  .infr input[type=checkbox]{width:auto;height:15px;accent-color:var(--purple);
    background:none;border:none;padding:0}
  .infr input:focus{outline:none;border-color:var(--purple);background:#0E0E11}
  .infr .ro{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .infline{display:flex;justify-content:space-between;align-items:baseline;
    margin:9px 6px 0;padding-top:8px;border-top:1px solid var(--line)}
  .infline span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .infline b{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--pass)}
  .infline b.none{color:var(--faint)}
  .infhd{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);margin:11px 6px 0;
    border-top:1px solid var(--line);padding-top:9px}
  .paidrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mini{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 8px;background:none;border:1px solid var(--line);color:var(--faint);cursor:pointer}
  .mini:hover{color:var(--dim);border-color:var(--dim)}
  .mstate{font-size:9px;letter-spacing:.06em;color:var(--faint)}
  .mstate.paid{color:var(--pass)}
  .mstate.unpaid{color:var(--warn)}
  .mstate.uninvoiced{color:var(--fail)}
  .infsave{margin:9px 6px 4px}
  .infsave .st{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-top:5px;text-align:center;min-height:12px}
  .infsave .st.ok{color:var(--pass)} .infsave .st.bad{color:var(--fail)}
  .infsave .st.busy{color:var(--warn)}
  .sheet .tname{font-size:27px}
  .sheet .two{font-size:15px;padding:3px 9px}
  .sheet .art{height:168px}
  .sheet .tline{font-size:11.5px}
  .sheet .prow{font-size:12px;padding:4px 0}
  .sheet .tbox{min-height:0}

  /* ---- mode tabs: always visible, so no screen is a dead end ---- */
  .smodes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin:0 0 6px;
    background:var(--sunken);border:1px solid var(--rule);padding:4px}
  .smode{background:none;border:1px solid transparent;color:var(--faint);cursor:pointer;
    font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;padding:8px 4px;transition:all .15s;position:relative}
  .smode:hover{color:var(--white);background:rgba(255,255,255,.05)}
  .smode.on{color:var(--white);background:var(--purple-tint);border-color:var(--purple)}
  .smode[data-m="time"].on{background:rgba(240,180,41,.12);border-color:var(--warn);color:var(--warn)}
  .smode[data-m="qc"].on{background:rgba(74,222,128,.12);border-color:var(--pass);color:var(--pass)}
  .smode .tag{display:block;font-family:var(--mono);font-size:8.5px;font-weight:400;
    letter-spacing:.04em;text-transform:none;color:var(--faint);margin-top:2px}
  .smode.on .tag{color:inherit;opacity:.8}
  .smode .pip{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%}
  .smode .pip.run{background:var(--warn);animation:bp 1.6s ease-in-out infinite}
  .smode .pip.ok{background:var(--pass)}
  .smode .pip.bad{background:var(--fail)}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
  .sheet .close{position:absolute;top:10px;right:12px;z-index:3;background:none;border:none;
                color:var(--faint);font-size:19px;line-height:1;cursor:pointer;padding:3px 6px}
  .sheet .close:hover{color:var(--white)}

  /* ---- clock-out parts prompt: sits above the sheet, since it's raised from it ---- */
  .pscrim{position:fixed;inset:0;background:rgba(6,6,6,.7);z-index:220;opacity:0;
    pointer-events:none;transition:opacity .18s}
  .pscrim.open{opacity:1;pointer-events:auto}
  .pprompt{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);z-index:221;
    width:min(330px,calc(100vw - 28px));
    background:linear-gradient(160deg,var(--frame) 0%,var(--frame-2) 100%);
    border:1px solid var(--purple);border-radius:10px;padding:18px 18px 16px;
    box-shadow:0 24px 56px rgba(0,0,0,.8);opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s cubic-bezier(.2,.8,.2,1)}
  .pprompt.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .pprompt h3{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--white);margin:0 0 3px}
  .pprompt .psub{font-size:10.5px;color:var(--faint);margin:0 0 14px;line-height:1.5}
  .pprompt .psub b{color:var(--purple-lift);font-weight:500}
  .pprompt label{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin-bottom:5px}
  .pprompt .pf{margin-bottom:12px}
  .pprompt select,.pprompt input{width:100%;background:var(--sunken);border:1px solid var(--line);
    color:var(--white);font-family:var(--mono);font-size:14px;padding:9px 10px}
  .pprompt select:focus,.pprompt input:focus{outline:none;border-color:var(--purple)}
  .pquick{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .pquick button{flex:1;min-width:40px;background:var(--sunken);border:1px solid var(--line);
    color:var(--dim);font-family:var(--mono);font-size:12px;padding:7px 0;cursor:pointer}
  .pquick button:hover{border-color:var(--purple);color:var(--white)}
  .pacts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}
  .pacts button{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;padding:11px;cursor:pointer;background:var(--sunken);
    border:1px solid var(--line);color:var(--dim);transition:all .15s}
  .pacts button.go{border-color:var(--fail);color:var(--fail)}
  .pacts button.go:hover{background:rgba(248,113,113,.12);color:var(--white)}
  .pacts button.ghost:hover{border-color:var(--line-hot);color:var(--white)}
  .prun{font-variant-numeric:tabular-nums;color:var(--white)}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 6px 4px}
  .act{display:flex;flex-direction:column;gap:3px;text-decoration:none;background:var(--sunken);
       border:1px solid var(--line);padding:9px 10px;cursor:pointer;font-family:var(--mono);
       text-align:left;width:100%;transition:border-color .15s,background .15s}
  .act:hover{border-color:var(--purple);background:var(--purple-tint)}
  .act .an{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.12em;
           text-transform:uppercase;color:var(--purple-lift)}
  .act .ad{font-size:9px;color:var(--faint);line-height:1.3}
  .act.wide{grid-column:1/-1}
  .act.ghost .an{color:var(--dim)}
  .act.go{border-color:rgba(74,222,128,.4)} .act.go .an{color:var(--pass)}
  .act.stop{border-color:rgba(248,113,113,.4)} .act.stop .an{color:var(--fail)}
  .act[disabled]{opacity:.4;cursor:not-allowed}

  /* time breakdown */
  .brk{margin:9px 6px 2px;padding:10px 11px;background:rgba(0,0,0,.3);border:1px solid var(--rule)}
  .brk .bh{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--white);margin-bottom:9px;display:flex;justify-content:space-between}
  .brk .bh span{color:var(--purple-lift)}
  .seg{margin-bottom:9px}
  .seg .sl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:4px}
  .seg .sl b{color:var(--white);font-weight:500;font-variant-numeric:tabular-nums}
  .track{height:7px;background:var(--sunken);border:1px solid var(--line)}
  .track i{display:block;height:100%;background:var(--purple)}
  .seg.op2 .track i{background:var(--purple-lift)}
  .seg.op3 .track i{background:var(--pass)}
  .brk .none{font-size:11.5px;color:var(--dim);line-height:1.6}
  .logrow{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
  .logrow select,.logrow input{background:var(--sunken);border:1px solid var(--line);color:var(--white);
    font-family:var(--mono);font-size:12px;padding:7px 8px;min-width:0}
  .logrow select{flex:0 0 74px} .logrow input{flex:1}
  .logrow button{background:var(--sunken);border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 11px;cursor:pointer}
  .logrow button:hover{background:var(--purple-tint);color:var(--white)}

  /* ---- quoted vs actual ---- */
  .pace{margin:7px 6px 2px;padding:9px 10px;background:rgba(0,0,0,.3);border:1px solid var(--rule)}
  .pace.mini{margin:6px 0 0;padding:0;background:none;border:none}
  .pace .ph{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-bottom:8px}
  .pace .ph span{font-size:11px;letter-spacing:.06em;color:var(--purple-lift)}
  .pace.warn .ph span{color:var(--warn)}
  .pace.over .ph span{color:var(--fail)}
  .ptrack{position:relative;height:9px;background:var(--sunken);border:1px solid var(--rule);
    overflow:hidden}
  .pace.mini .ptrack{height:6px}
  .pfill{position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,var(--purple-deep),var(--purple-lift));
    box-shadow:0 0 9px rgba(168,85,247,.45);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .pace.warn .pfill{background:linear-gradient(90deg,#8a6a12,var(--warn));
    box-shadow:0 0 9px rgba(240,180,41,.4)}
  .pace.over .pfill{background:linear-gradient(90deg,#7a2222,var(--fail));
    box-shadow:0 0 9px rgba(248,113,113,.45)}
  /* overage rides on top of a full bar, hatched so it reads as debt not progress */
  .pover{position:absolute;right:0;top:0;bottom:0;opacity:.92;
    background:repeating-linear-gradient(45deg,var(--fail) 0 3px,rgba(0,0,0,.45) 3px 6px);
    transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .ptick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.13)}
  .pmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--white);
    box-shadow:0 0 0 1px rgba(0,0,0,.6);transition:left .45s cubic-bezier(.2,.8,.2,1)}
  .plbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;
    font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .plbl b{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--white);letter-spacing:.04em}
  .pace.warn .plbl b{color:var(--warn)}
  .pace.over .plbl b{color:var(--fail)}
  .pfoot{margin-top:8px;padding-top:7px;border-top:1px solid var(--rule);
    font-size:11px;color:var(--dim);line-height:1.55}
  .pfoot b{color:var(--white);font-weight:500}
  .pfoot.bad{color:var(--fail)} .pfoot.good{color:var(--pass)}
  .pnone{font-size:11.5px;color:var(--dim);line-height:1.6}
  .qrow2{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:9px}
  .qrow2 input{background:var(--sunken);border:1px solid var(--line);color:var(--white);
    font-family:var(--mono);font-size:11px;padding:7px 8px;min-width:0}
  .qrow2 input:focus{outline:none;border-color:var(--purple)}
  .qrow2 button{background:var(--sunken);border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:0 12px;cursor:pointer}
  .qrow2 button:hover{background:var(--purple-tint);color:var(--white)}

  /* ---- QC panel: same shell as the time breakdown, different guts ---- */
  .brk.qc .bh span.pass{color:var(--pass)}
  .brk.qc .bh span.fail{color:var(--fail)}
  .brk.qc .bh span.open{color:var(--warn)}
  .brk.qc .bh span.none{color:var(--faint)}
  .qident{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 8px;margin-bottom:10px;
    padding-bottom:9px;border-bottom:1px solid var(--rule)}
  .qident div{min-width:0}
  .qident span{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .qident b{display:block;font-size:11px;color:var(--white);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qlist{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
  .qrow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:7px;align-items:center;
    font-size:10px;padding:4px 6px;background:rgba(255,255,255,.04);border-left:2px solid var(--line-hot)}
  .qrow.pass{border-left-color:var(--pass)}
  .qrow.fail{border-left-color:var(--fail);background:rgba(248,113,113,.07)}
  .qrow .qf{color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .qn,.qrow .qa{color:var(--dim);font-variant-numeric:tabular-nums}
  .qrow .qa{color:var(--white)}
  .qrow .qv{font-size:8px;letter-spacing:.08em;color:var(--pass)}
  .qrow.fail .qv{color:var(--fail)}
  .qrow .qx{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;
    line-height:1;padding:0 2px}
  .qrow .qx:hover{color:var(--fail)}
  .qtally{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:9.5px;color:var(--faint);
    padding-top:8px;border-top:1px solid var(--rule)}
  .qtally b{font-weight:500;font-size:9.5px;letter-spacing:.06em;color:var(--faint)}
  .qtally b.ok{color:var(--pass)}
  .qtally b.bad{color:var(--fail)}
  .qadd{display:grid;grid-template-columns:1fr 68px 58px 68px auto;gap:5px;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--rule)}
  .qadd.two{grid-template-columns:1fr auto;border-top:none;padding-top:0;margin-top:5px}
  .qadd input{background:var(--sunken);border:1px solid var(--line);color:var(--white);
    font-family:var(--mono);font-size:10px;padding:6px 7px;min-width:0}
  .qadd input:focus{outline:none;border-color:var(--purple)}
  .qadd button{background:var(--sunken);border:1px solid var(--purple);color:var(--purple-lift);
    font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:0 11px;cursor:pointer}
  .qadd button:hover{background:var(--purple-tint);color:var(--white)}
  .qverdict{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}
  .qbtn{background:var(--sunken);border:1px solid var(--line);color:var(--dim);
    font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    padding:9px;cursor:pointer;transition:all .15s}
  .qbtn.pass:hover,.qbtn.pass.on{border-color:var(--pass);color:var(--pass);background:rgba(74,222,128,.1)}
  .qbtn.fail:hover,.qbtn.fail.on{border-color:var(--fail);color:var(--fail);background:rgba(248,113,113,.1)}

  /* ---------- SEARCH ---------- */
  .sscrim{position:fixed;inset:0;background:rgba(6,6,6,.8);z-index:210;opacity:0;pointer-events:none;
          transition:opacity .16s}
  .sscrim.open{opacity:1;pointer-events:auto}
  .spal{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);z-index:211;
    width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 100px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--purple);box-shadow:0 24px 60px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
  .spal.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .spal input{width:100%;background:var(--sunken);border:none;border-bottom:1px solid var(--line);
    color:var(--white);font-family:var(--mono);font-size:16px;padding:15px 17px}
  .spal input:focus{outline:none}
  .sres{overflow-y:auto;padding:6px 0 8px}
  .sgrp{font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
        color:var(--faint);padding:9px 17px 5px}
  .sitem{display:flex;align-items:center;gap:10px;padding:8px 17px;cursor:pointer;border-left:2px solid transparent}
  .sitem.sel{background:var(--purple-tint);border-left-color:var(--purple)}
  .sitem .sk{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--white);
             flex-shrink:0;min-width:96px}
  .sitem .sm{font-size:10px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .sitem .sn{font-size:9px;color:var(--faint);flex-shrink:0}
  .sempty{padding:22px 17px;font-size:11px;color:var(--faint)}
  .sfoot{border-top:1px solid var(--line);padding:8px 17px;font-size:9px;color:var(--faint);
         display:flex;gap:14px}

  /* ---------- DASHBOARD ---------- */
  #scDash{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:10px 10px 10px;width:100%}
  .dtitle{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--white)}
  .dsub{font-size:11px;color:var(--faint);margin:3px 0 0;line-height:1.4}
  .dsub:empty{display:none}
  .dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    flex-wrap:wrap;margin-bottom:10px;flex-shrink:0}
  /* the dealer's chips — these live in the notch at the top of the table */
  .dsort{display:flex;align-items:center;gap:6px}
  .dsort span{font-family:var(--disp);font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(255,255,255,.62);margin-right:2px}
  .dsort button{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;padding:6px 13px;border-radius:22px;cursor:pointer;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.82);
    transition:background .16s,color .16s,transform .16s,box-shadow .16s}
  .dsort button:hover{background:rgba(0,0,0,.5);color:var(--white);transform:translateY(-1px)}
  .dsort button.son{background:var(--white);color:var(--purple-deep);border-color:var(--white);
    box-shadow:0 0 18px -3px rgba(255,255,255,.55);cursor:default}
  /* stage heading, shown only when the sort groups by stage or the role spans several */
  /* A table of cards seen from above: the real MTG card face, laid flat in a
     grid instead of fanned. Same .card element the timeline builds — .dcard
     only undoes the fan's absolute positioning and scales the face up. */
  /* ---------- THE TABLE ----------
     Cards are dealt into hands, one hand per group, each hand a tight overlapping
     spread the way a dealt hand actually sits. Cards are small on purpose: you're
     reading the table, not one card. Hovering peeks a card up out of its hand and
     slides the rest of the hand aside so the whole face is visible without a click. */
  .tablewrap{flex:1 0 auto;min-height:0;display:flex;justify-content:center;align-items:stretch;
    width:100%;padding:2px 0 0}
  /* The table is a fixed piece of furniture: it fills whatever room it is given
     and never resizes with the hands sitting on it. */
  .ptable{position:relative;width:100%;height:100%;min-height:470px;
    border-radius:110px;padding:16px;
    background:linear-gradient(180deg,var(--raised) 0%,var(--panel) 46%,var(--frame-2) 100%);
    box-shadow:0 34px 74px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.10),
      0 0 0 1px rgba(0,0,0,.55)}
  .felt{position:relative;height:100%;border-radius:96px;
    background:
      radial-gradient(ellipse 62% 54% at 50% 46%,var(--purple-tint) 0%,transparent 68%),
      linear-gradient(180deg,var(--raised) 0%,var(--frame) 52%,var(--frame-2) 100%);
    box-shadow:inset 0 0 110px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.05)}
  /* felt nap */
  .felt::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.45;
    border-radius:inherit;
    background-image:radial-gradient(rgba(255,255,255,.05) .6px,transparent .6px);
    background-size:3px 3px}
  .feltline{position:absolute;inset:14px;border:1px dashed var(--purple);border-radius:84px;
    opacity:.3;pointer-events:none}

  /* the notch cut into the rail — the dealer stands here */
  .dealer{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:8;
    padding:13px 18px 12px;border-radius:0 0 28px 28px;
    border:1px solid rgba(255,255,255,.2);border-top:none;
    background:linear-gradient(180deg,var(--purple-deep) 0%,var(--purple) 52%,var(--purple-deep) 100%);
    box-shadow:0 16px 32px -14px rgba(0,0,0,.95),inset 0 -1px 0 rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.25)}

  /* seats: hands alternate left and right of the house mark */
  /* seats: hands alternate left and right of the house mark. Hands scroll inside
     this box rather than stretching the table. */
  .seats{position:absolute;inset:74px 76px 58px;z-index:3;overflow:auto;
    scrollbar-width:none;-ms-overflow-style:none;
    display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,20%,250px) minmax(0,1fr);
    gap:0 20px;align-items:start;align-content:center;align-content:safe center}
  .seats::-webkit-scrollbar{width:0;height:0}
  .seats.empty{grid-template-columns:1fr;align-items:center;justify-items:center}
  .seatcol{display:flex;flex-direction:column;gap:30px;min-width:0}
  .gut{min-width:0}

  /* house mark — sword slung across the back, eyes lit */
  .brand{position:absolute;left:50%;top:50%;z-index:2;height:clamp(150px,33%,290px);
    width:auto;aspect-ratio:198/272;transform:translate(-50%,-50%)}
  /* the felt is as dark as the mark is, so it gets its own pool of light */
  .brand::before{content:'';position:absolute;left:50%;top:50%;width:230%;height:170%;z-index:0;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(ellipse at center,var(--purple-tint) 0%,transparent 66%);
    opacity:.9}
  .mark{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
  .mark .lg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;
    filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(168,85,247,.4))
      drop-shadow(0 16px 30px rgba(0,0,0,.8))}
  .mark .sw{position:absolute;left:50%;top:50%;width:170%;z-index:1;opacity:.9;
    transform:translate(-50%,-50%) rotate(78deg);
    filter:drop-shadow(0 4px 9px rgba(0,0,0,.85));
    transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s}
  .mark .eyes{position:absolute;left:55.6%;top:50.6%;width:40%;height:15%;z-index:3;
    transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;filter:blur(6px);
    background:radial-gradient(ellipse at center,var(--purple-lift) 0%,var(--purple) 40%,transparent 72%);
    animation:eyeglow 3.6s ease-in-out infinite}
  @keyframes eyeglow{0%,100%{opacity:.45}50%{opacity:.9}}
  .brand:hover .mark{transform:translateY(-5px)}
  .brand:hover .sw{transform:translate(-50%,-50%) rotate(73deg) scale(1.06);opacity:1;
    filter:drop-shadow(0 0 12px rgba(168,85,247,.7))}
  .brand:hover .eyes{animation-duration:1.15s;filter:blur(8px)}
  @media(prefers-reduced-motion:reduce){
    .mark .eyes{animation:none;opacity:.72}
  }
  .hand{display:flex;flex-direction:column;gap:9px;min-width:0}
  .handlbl{display:flex;align-items:baseline;gap:8px;
    font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.17em;
    text-transform:uppercase;color:var(--silver);
    border-bottom:1px solid var(--line);padding-bottom:6px}
  .handlbl i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--faint)}
  .handlbl b.lt{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--fail);
    letter-spacing:.06em}
  /* top padding is the peek room — a raised card must not clip into the label */
  .handrow{display:flex;padding:30px 0 6px;min-height:0}
  .handrow+.handrow{padding-top:16px}

  /* Each card must be its own stacking layer. Left static, the skewed WO badge and
     the absolute Photo/Model switch (both stacking contexts of their own) painted
     above the next card in the fan instead of being covered by it. */
  .tcard{position:relative;z-index:1;left:auto;width:150px;flex-shrink:0;opacity:1;pointer-events:auto;
    padding:4px;border-radius:7px;margin-left:calc(var(--step,52px) - 150px);
    box-shadow:-7px 9px 18px rgba(0,0,0,.62);
    transform:none;transform-origin:center bottom;
    transition:transform .3s cubic-bezier(.2,.85,.25,1),box-shadow .2s,border-color .16s;
    will-change:auto}
  .tcard:first-child{margin-left:0}
  .tcard:hover{transform:translateY(-26px) scale(1.14);z-index:30;
    box-shadow:-10px 20px 34px rgba(0,0,0,.72);border-color:rgba(255,255,255,.42)}
  /* push the rest of the hand right so the peeked card isn't covered */
  .tcard:hover ~ .tcard{transform:translateX(86px)}
  .tcard.running{border-color:var(--purple)}
  .tcard.late{border-color:rgba(248,113,113,.5)}
  .tcard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .tcard.selected{border-color:var(--purple-lift);box-shadow:0 0 0 2px rgba(168,85,247,.28) inset}

  /* the card face, sized down for the table */
  .tcard .tname{font-size:13px;line-height:1.05}
  .tcard .two{font-size:9.5px;padding:1px 4px}
  .tcard .tbar{padding:4px 5px;gap:4px}
  .tcard .art{height:52px;margin:3px 4px}
  .tcard .tline{font-size:8.5px;padding:3px 5px;margin:0 4px}
  .tcard .tbox{margin:3px 4px 0;padding:4px 5px;min-height:0}
  .tcard .flags{margin:3px 4px 0}
  .tcard .flags span{font-size:7.5px;padding:1px 4px}
  .tcard .bbar{padding:4px 5px}
  .tcard .coll{font-size:7.5px;line-height:1.35}
  .tcard .pt{font-size:13px;padding:1px 6px}
  .tcard .prow{font-size:8px}
  .tcard .pnone{font-size:8px}
  .tcard .bars{height:3px}

  /* DEALING: cards start collapsed at the sort buttons and fly to their seat.
     .predeal is the pre-flight frame (no transition, sitting at the origin);
     removing it releases them. Stagger comes from an inline transition-delay. */
  .tcard.predeal{transition:none}
  .tcard.dealt{transition:transform .42s cubic-bezier(.18,.86,.24,1),opacity .22s ease-out}

  @media(prefers-reduced-motion:reduce){
    .tcard,.tcard.dealt{transition:none}
    .tcard:hover ~ .tcard{transform:none}
  }
  @media(max-width:700px){
    /* on a phone the oval becomes a scrolling slab — a fixed table would leave
       room for about one hand */
    #scDash{overflow-y:auto;padding:12px 10px 30px}
    .tablewrap{flex:none;min-height:0}
    .ptable{height:auto;border-radius:34px;padding:9px}
    .felt{height:auto;border-radius:28px;padding:58px 12px 26px}
    .feltline{inset:9px;border-radius:22px}
    .dealer{border-radius:0 0 18px 18px;padding:9px 10px 8px}
    .dsort{flex-wrap:wrap;justify-content:center;gap:5px}
    .dsort span{display:none}
    .seats{position:static;inset:auto;overflow:visible;
      grid-template-columns:1fr;gap:24px}
    .gut{display:none}
    /* the mark drops back to a watermark so the hands own the felt */
    .brand{height:230px;opacity:.15;top:46%}
    .brand::before{display:none}
    .hand{width:100%}
    .handrow{padding:26px 2px 8px}
    .tcard{width:132px;margin-left:calc(var(--step,44px) - 132px)}
    .tcard:hover{transform:none}
    .tcard:hover ~ .tcard{transform:none}
  }

  /* Shuffle: cards fly from their previous position to the new one when the
     sort changes (FLIP — measure, reorder, invert, play). .dealing is set for
     one frame at the old offset, then cleared so the transition runs. */
  .dempty{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;
          padding:20px 26px;font-size:12px;text-align:center;
          color:var(--faint);line-height:1.6;max-width:460px}
  .dempty b{color:var(--dim);font-weight:500}

  .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,14px);z-index:300;
    background:var(--panel);border:1px solid var(--purple);padding:11px 16px;font-size:11px;
    color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .ctxmenu{position:fixed;z-index:400;min-width:172px;background:var(--panel);
    border:1px solid var(--purple);border-radius:6px;padding:4px;
    box-shadow:0 14px 32px rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transform:translateY(-4px);transition:opacity .12s,transform .12s}
  .ctxmenu.on{opacity:1;pointer-events:auto;transform:none}
  .ctxhd{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);padding:6px 10px 7px;border-bottom:1px solid var(--line);margin-bottom:3px}
  .ctxdiv{height:1px;background:var(--line);margin:3px 4px}
  .ctxitem{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);
    font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:4px;cursor:pointer}
  .ctxitem:hover{background:var(--purple-tint);color:var(--white)}
  .ctxitem.cur{color:var(--faint);cursor:default}
  .ctxitem.cur:hover{background:none;color:var(--faint)}
  .ctxitem[disabled]{opacity:.55}

  @media(max-width:700px){
    .card{width:166px}
    .tname{font-size:14px}
    .flow{padding:0 2px}
    .bar{gap:8px;padding:9px 11px} .bar .t{font-size:12px}
    .searchbtn{max-width:none;order:5;flex-basis:100%}
    .dcard .tname{font-size:22px}
    .dcard .art{height:82px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ================= DEPTH PASS ================= */
  :root{--e1:0 1px 2px rgba(0,0,0,.32);--sheen:inset 0 1px 0 rgba(255,255,255,.06);
        --sink:inset 0 2px 5px rgba(0,0,0,.55)}
  /* body background intentionally transparent — see html,body above */
  .bar{background:linear-gradient(180deg,#33333A 0%,#2A2A2F 100%);

  .toggle,.searchbtn,select.role,button.mini{box-shadow:var(--sink)}

  /* the card: a touch more lift and a lit top edge, nothing else moved */
  .card{box-shadow:0 12px 26px -8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.07)}
  .card.focus{box-shadow:0 18px 36px -10px rgba(0,0,0,.75),

  .node .plate{box-shadow:0 4px 12px -4px rgba(0,0,0,.7),var(--sheen)}
  .node .dot{box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .node.on .dot{box-shadow:0 0 12px -1px rgba(146,51,230,.8)}

  .act,.mb,.qbtn{transition:transform .12s,border-color .15s,background .15s,color .15s}
  .act:active,.mb:active,.qbtn:active{transform:scale(.985)}
  .sheet{box-shadow:0 30px 70px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)}

  @media(max-width:700px){

  }

<script>
(function(){
  var THEMES=['normal','pixel','mono','stealth'];
  function apply(t){
    if(THEMES.indexOf(t)<0) t='normal';
    document.documentElement.setAttribute('data-theme',t);
  }
  var saved='normal';
  try{ saved=localStorage.getItem('sr_theme')||'normal'; }catch(e){}
  apply(saved);
  window.addEventListener('storage',function(e){
    if(e.key==='sr_theme') apply(e.newValue||'normal');
  });
})();
</script>

<script>
(function(){
  var APP_VERSION='v4.26';

  var STAGES=[
    {name:'Award',   dir:'up'},
    {name:'Plan',    dir:'down'},
    {name:'Machine', dir:'up'},
    {name:'QC',      dir:'down'},
    {name:'Pack',    dir:'up'},
    {name:'Ship',    dir:'down'}
  ];
  // Off for now — QC checks are still device-local (saveQC only, no patchJob),
  // so a gate here would hold a card for an inspection no other device can
  // see or clear. Flip back on once QC syncs through the same write path as
  // the clock. This one flag controls every place the gate is checked.
  var QC_GATE_ENABLED=false;
  // Derived, not hardcoded — advance() already gates by name ('QC'), and the
  // context menu's move should hold the same card at the same station rather
  // than silently drifting if STAGES is ever reordered.
  var QC_STAGE_NUM=(function(){
    for(var i=0;i<STAGES.length;i++) if(STAGES[i].name==='QC') return i+1;
    return 4;
  })();
  var OPS=['OP1','OP2','OP3'];
  // Which operation a clock session belongs to is a function of where the card is
  // sitting — a session logged from Machine is OP work, one logged from QC is
  // inspection time. This is why the clock had to live on the card: standing at a
  // separate timeclock, nothing knows the stage.
  var STAGE_OPS={
    'Award':  ['Office'],
    'Plan':   ['Programming','Setup'],
    'Machine':['OP1','OP2','OP3'],
    'QC':     ['Inspection','Rework'],
    'Pack':   ['Packaging'],
    'Ship':   ['Shipping']
  };
  function stageName(c){return (STAGES[c.stage-1]||{}).name||'\u2014';}
  function opsFor(c){return STAGE_OPS[stageName(c)]||OPS;}
  function defaultOp(c){return opsFor(c)[0];}
  // Parts only mean something at stations that actually move pieces.
  function countsParts(c){var s=stageName(c);return s==='Machine'||s==='QC'||s==='Pack';}

  var ROLES=[
    {id:'owner',    label:'Owner (all stations)', stages:[1,2,3,4,5,6]},
    {id:'office',   label:'Office / Programming', stages:[1,2]},
    {id:'machinist',label:'Machinist',            stages:[3]},
    {id:'qc',       label:'Quality',              stages:[4]},
    {id:'shipping', label:'Shipping',             stages:[5,6]},
    {id:'viewer',   label:'View only',            stages:[]}
  ];

  var QUOTE_TOOL='quote-generator.html';
  var DROPBOX_ROOT='https://www.dropbox.com/home/JOBSHOP';

  var flow=document.getElementById('flow');
  var scrim=document.getElementById('scrim');
  var sheetEl=document.getElementById('sheet');
  var toastEl=document.getElementById('toast');

  var openState={}, peekState={}, focusIdx={};
  var CARDS=[], laneEls=[], nodeEls=[];
  var hits={};   // card ids highlighted by a search result
  var view='timeline', openSheetId=null, sheetMode='card';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function lsGet(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  var role=lsGet('sr_role','owner');
  var clocks=lsGet('sr_clocks',{});
  var moves=lsGet('sr_moves',{});
  var qcRecs=lsGet('sr_qc',{});
  var quotes=lsGet('sr_quoted',{});   // local quoted-hours overrides, keyed by card id
  function saveClocks(){lsSet('sr_clocks',clocks);}
  function saveMoves(){lsSet('sr_moves',moves);}
  function saveQC(){lsSet('sr_qc',qcRecs);}
  function saveQuotes(){lsSet('sr_quoted',quotes);}

  function roleDef(){for(var i=0;i<ROLES.length;i++)if(ROLES[i].id===role)return ROLES[i];return ROLES[0];}
  // Which stages the timeline is zoomed onto. null = no zoom (all lanes equal).
  // A role covering every stage isn't a zoom, it's the default view.
  function zoomStages(){
    var st=roleDef().stages;
    if(!st.length||st.length>=STAGES.length)return null;
    return st;
  }
  function isZoomed(i){var z=zoomStages();return !!z&&z.indexOf(i+1)>=0;}
  // Lane widths are flex ratios, so zoom is just a class swap — no re-layout
  // math, and fanSpan() keeps working because it measures the lane's real
  // bounding box rather than assuming an even split.
  function applyZoom(){
    var z=zoomStages();
    STAGES.forEach(function(s,i){
      var lane=laneEls[i]; if(!lane)return;
      lane.classList.toggle('zoom',!!z&&z.indexOf(i+1)>=0);
      lane.classList.toggle('shrunk',!!z&&z.indexOf(i+1)<0);
      // Auto-open the stage you just claimed; you're here to work it.
      if(z&&z.indexOf(i+1)>=0)openState[i]=true;
    });
  }
  function isMine(c){return roleDef().stages.indexOf(c.stage)>=0;}
  function plain(){return role!=='owner'&&role!=='viewer';}
  function toast(m){
    toastEl.textContent=m;toastEl.classList.add('on');
    clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('on');},3000);
  }

  // ---- WORK ORDER: XX-YYYY, counter restarts each January ---------
  function cardCreated(id){
    if(!id||id.length<8)return null;
    var ts=parseInt(id.substring(0,8),16);
    return (!ts||isNaN(ts))?null:new Date(ts*1000);
  }
  function assignWorkOrders(cards){
    var dated=cards.filter(function(c){return c._created;});
    dated.sort(function(a,b){return a._created-b._created;});
    var per={};
    dated.forEach(function(c){
      var y=c._created.getFullYear();
      per[y]=(per[y]||0)+1;
      c.wo=String(y%100).padStart(2,'0')+'-'+String(per[y]).padStart(4,'0');
    });
    cards.forEach(function(c){if(!c.wo)c.wo='\u2014';});
  }

  function isLate(c){return !!c.active&&c.days!=null&&c.days<0;}
  function siblings(c){
    if(!c.po)return 0;
    return CARDS.filter(function(x){return x.po===c.po&&x.stage!==c.stage;}).length;
  }
  function dueText(c){
    if(c.days==null)return c.active?'no date':'\u2014';
    if(c.days<0)return Math.abs(c.days)+'d over';
    return c.days===0?'today':'in '+c.days+'d';
  }
  function byId(id){for(var i=0;i<CARDS.length;i++)if(CARDS[i].id===id)return CARDS[i];return null;}
  // A paid job is finished business. It stays in CARDS — the record is intact,
  // still searchable, still reachable from the Paid view — but it leaves every
  // lane, so the board only shows work that still wants something.
  function stageCards(s){
    return CARDS.filter(function(c){return c.stage===s&&!isPaid(c);});
  }
  function dropboxURL(c){
    return DROPBOX_ROOT+'/'+encodeURIComponent(c.customer||'')+'/'+encodeURIComponent(c.part||'');
  }

  // ---- CLOCK: plain in / out, parts logged separately -------------
  function rec(c){
    if(!clocks[c.id])clocks[c.id]={startedAt:null,accumulated:0,sessions:[],opTotals:{}};
    var r=clocks[c.id];
    if(!r.sessions)r.sessions=[];
    if(!r.opTotals)r.opTotals={};
    return r;
  }
  function isRunning(c){return !!(clocks[c.id]&&clocks[c.id].startedAt);}

  // The clock record is richer than the locked schema's flat time/op1/op2, so it
  // persists as its own `clock` object AND writes the three locked fields as
  // derived values. That keeps `time`/`op1`/`op2` meaning exactly what they meant
  // in the Trello descriptions (total hours, pcs done on each op) while nothing
  // in the session history gets thrown away.
  function clockFields(c){
    var r=clocks[c.id]||{}, t=r.opTotals||{};
    return {
      time:+(((r.accumulated||0)/3600000).toFixed(2)),
      op1:(t.OP1!=null?t.OP1:null),
      op2:(t.OP2!=null?t.OP2:null),
      clock:{
        accumulated:r.accumulated||0,
        startedAt:r.startedAt||null,
        sessions:r.sessions||[],
        opTotals:t
      }
    };
  }
  // Unlike a stage move, a failed clock write is NOT rolled back — the local
  // record is the only evidence that the work happened, and discarding it to
  // match the server would destroy real hours. Mark it unsynced instead and
  // retry on the next poll.
  var unsynced={};
  function syncClock(c){
    patchJob(c,clockFields(c),function(ok){
      if(ok){ delete unsynced[c.id]; }
      else { unsynced[c.id]=1; toast('Time saved on this device \u2014 not synced yet'); }
    });
  }
  function retryUnsynced(){
    Object.keys(unsynced).forEach(function(id){
      var c=byId(id); if(!c)return;
      patchJob(c,clockFields(c),function(ok){ if(ok)delete unsynced[id]; });
    });
  }
  function sessionMs(c){var r=clocks[c.id];return (r&&r.startedAt)?(Date.now()-r.startedAt):0;}
  function totalMs(c){var r=clocks[c.id];return r?((r.accumulated||0)+sessionMs(c)):0;}
  function fmtHMS(ms){
    var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  }
  function fmtHours(ms){return (ms/3600000).toFixed(2);}
  function partsDone(c){
    var r=clocks[c.id];if(!r)return 0;
    return OPS.reduce(function(a,o){return a+(r.opTotals[o]||0);},0);
  }

  function clockIn(c){
    // Only one job runs at a time. Anything else still running gets closed out
    // against the station it was started at, so its time isn't silently orphaned.
    var autoClosed=[];
    Object.keys(clocks).forEach(function(id){
      var r=clocks[id];
      if(id!==c.id&&r&&r.startedAt){
        var ms=Date.now()-r.startedAt;
        r.accumulated=(r.accumulated||0)+ms;
        r.sessions.push({op:r.op||'\u2014',stage:r.stage||null,parts:0,ms:ms,endedAt:Date.now()});
        r.startedAt=null;r.op=null;r.stage=null;
        autoClosed.push(id);
      }
    });
    var r=rec(c);
    r.startedAt=Date.now();
    r.op=defaultOp(c);          // stamped from the stage the card is sitting at
    r.stage=stageName(c);
    saveClocks();
    toast('Clocked in \u2014 '+r.stage+' \u00b7 '+r.op);
    refreshViews();
    syncClock(c);
    // Cards auto-clocked out above were mutated too — push those, or their
    // closing session only exists on this device.
    autoClosed.forEach(function(id){ var o=byId(id); if(o)syncClock(o); });
  }

  // Clocking out always asks what got finished, because the session's parts count is
  // the thing nobody goes back and fills in later. "None" is a valid answer.
  function clockOut(c){
    var r=clocks[c.id];
    if(!r||!r.startedAt)return;
    openPartsPrompt(c);
  }
  function finishClockOut(c,op,parts){
    var r=clocks[c.id];
    if(!r||!r.startedAt)return;
    var ms=Date.now()-r.startedAt;
    r.accumulated=(r.accumulated||0)+ms;
    r.sessions.push({op:op,stage:r.stage||stageName(c),parts:parts||0,ms:ms,endedAt:Date.now()});
    if(parts>0)r.opTotals[op]=(r.opTotals[op]||0)+parts;
    r.startedAt=null;r.op=null;r.stage=null;
    saveClocks();
    toast('Clocked out \u2014 '+fmtHours(ms)+' hrs'+(parts>0?(' \u00b7 '+parts+' pcs on '+op):''));
    refreshViews();
    syncClock(c);
  }
  // Parts are logged on their own, from the time breakdown — not a gate on clocking out.
  function logParts(c,op,n){
    var r=rec(c);
    r.opTotals[op]=(r.opTotals[op]||0)+n;
    var last=r.sessions[r.sessions.length-1];
    if(last&&!last.op){last.op=op;last.parts=n;}
    else r.sessions.push({op:op,parts:n,ms:0,endedAt:Date.now()});
    saveClocks();
    toast('Logged '+n+' pcs on '+op);
    refreshViews();
    syncClock(c);
  }

  // ---- QUALITY ---------------------------------------------------
  // Lives on the card for the same reason the clock does: the part number, rev, PO,
  // customer and qty are already here. A standalone inspection tool makes you retype
  // all five before you can measure anything.
  function qrec(c){
    if(!qcRecs[c.id])qcRecs[c.id]={checks:[],status:'none',insp:0,note:''};
    var r=qcRecs[c.id];
    if(!r.checks)r.checks=[];
    return r;
  }
  function qcStatus(c){var r=qcRecs[c.id];return r?r.status:'none';}
  function qcFails(c){
    var r=qcRecs[c.id];if(!r)return 0;
    return r.checks.filter(function(k){return k.verdict==='fail';}).length;
  }
  // A check is in tolerance when |actual - nominal| <= tol. Blank tol means
  // it's a visual/attribute check and the verdict is whatever was tapped.
  function verdictFor(nominal,actual,tol){
    if(nominal===''||actual==='')return null;
    var n=parseFloat(nominal),a=parseFloat(actual),t=parseFloat(tol);
    if(isNaN(n)||isNaN(a))return null;
    if(isNaN(t))t=0;
    return Math.abs(a-n)<=t?'pass':'fail';
  }
  function addCheck(c,feat,nominal,actual,tol){
    var r=qrec(c);
    var v=verdictFor(nominal,actual,tol);
    r.checks.push({feat:feat,nominal:nominal,actual:actual,tol:tol,
                   verdict:v||'pass',at:Date.now()});
    if(r.status==='none')r.status='open';
    saveQC();
    toast((v==='fail'?'OUT OF TOL \u2014 ':'Logged \u2014 ')+feat);
    refreshViews();
  }
  function dropCheck(c,i){
    var r=qrec(c);r.checks.splice(i,1);saveQC();refreshViews();
  }
  function setQCVerdict(c,status){
    var r=qrec(c);
    r.status=status;
    saveQC();
    toast(status==='pass'?'Inspection accepted':'Inspection rejected \u2014 card held at QC');
    refreshViews();
  }
  function setInspected(c,n){
    var r=qrec(c);r.insp=n;saveQC();refreshViews();
  }

  // ---- CLOCK-OUT PARTS PROMPT ------------------------------------
  var pscrimEl=document.getElementById('pscrim');
  var ppromptEl=document.getElementById('pprompt');
  var promptCard=null;

  function openPartsPrompt(c){
    promptCard=c;
    var r=clocks[c.id]||{};
    var ops=opsFor(c), cur=r.op||defaultOp(c);
    var elapsed=fmtHMS(Date.now()-(r.startedAt||Date.now()));
    var qty=(c.qty!=null?c.qty:null), done=partsDone(c);
    var remain=(qty!=null)?Math.max(0,qty-done):null;
    var parts=countsParts(c);

    ppromptEl.innerHTML=
      '<h3>Clock out</h3>'+
      '<p class="psub"><span class="prun">'+elapsed+'</span> on <b>'+esc(stageName(c))+'</b> \u00b7 '+
        esc(c.part||c.wo||'\u2014')+
        (remain!=null?(' \u00b7 '+remain+' of '+qty+' left'):'')+'</p>'+
      '<div class="pf"><label>Operation</label><select id="pOp">'+
        ops.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('')+
      '</select></div>'+
      (parts
        ? '<div class="pf"><label>Parts finished this session</label>'+
          '<input id="pParts" type="number" min="0" step="1" inputmode="numeric" value="0">'+
          '<div class="pquick">'+
            [1,2,5,10].map(function(n){return '<button data-add="'+n+'">+'+n+'</button>';}).join('')+
            (remain?'<button data-set="'+remain+'">All '+remain+'</button>':'')+
            '<button data-set="0">0</button>'+
          '</div></div>'
        : '<input id="pParts" type="hidden" value="0">')+
      '<div class="pacts">'+
        '<button class="ghost" data-p="cancel">Keep running</button>'+
        '<button class="go" data-p="out">Clock out</button>'+
      '</div>';

    pscrimEl.classList.add('open');ppromptEl.classList.add('open');

    Array.prototype.forEach.call(ppromptEl.querySelectorAll('[data-add],[data-set]'),function(b){
      b.onclick=function(){
        var f=ppromptEl.querySelector('#pParts');
        if(b.hasAttribute('data-set'))f.value=b.getAttribute('data-set');
        else f.value=(parseInt(f.value,10)||0)+parseInt(b.getAttribute('data-add'),10);
      };
    });
    ppromptEl.querySelector('[data-p="cancel"]').onclick=closePartsPrompt;
    ppromptEl.querySelector('[data-p="out"]').onclick=function(){
      var op=ppromptEl.querySelector('#pOp').value;
      var n=parseInt(ppromptEl.querySelector('#pParts').value,10);
      if(isNaN(n)||n<0)n=0;
      closePartsPrompt();
      finishClockOut(promptCard,op,n);
      var adv=(pendingAdvance===promptCard.id)?promptCard:null;
      pendingAdvance=null;
      promptCard=null;
      if(adv)doAdvance(adv);
    };
    var pf=ppromptEl.querySelector('#pParts');
    if(pf&&pf.type!=='hidden')setTimeout(function(){pf.focus();pf.select();},60);
  }
  function closePartsPrompt(){
    pscrimEl.classList.remove('open');ppromptEl.classList.remove('open');
    pendingAdvance=null;   // cancelling the prompt cancels the advance too
  }
  pscrimEl.addEventListener('click',closePartsPrompt);

  // ---- QUOTED vs ACTUAL ------------------------------------------
  // Quoted hours come off the card when the API supplies them; a local override
  // wins, so a number can be set from the shop floor without a Trello edit.
  function quotedHrs(c){
    if(quotes[c.id]!=null)return quotes[c.id];
    var v=(c.quoted!=null)?c.quoted:(c.est!=null?c.est:null);
    if(v==null)return null;
    v=parseFloat(v);
    return isNaN(v)?null:v;
  }
  function setQuoted(c,h){
    if(h==null||isNaN(h)||h<=0){delete quotes[c.id];}
    else quotes[c.id]=h;
    saveQuotes();
    toast(h>0?('Quoted '+h.toFixed(2)+' hrs'):'Quote cleared');
    refreshViews();
  }
  // Pace compares burn against completion: 40% of the hours spent to make 40% of the
  // parts is on pace; 80% spent for 40% made is not. Needs a qty to mean anything.
  function paceOf(c){
    var q=quotedHrs(c);
    if(!q)return null;
    var actual=totalMs(c)/3600000;
    var pct=q>0?(actual/q*100):0;
    var qty=(c.qty!=null?+c.qty:null), done=partsDone(c);
    var madePct=(qty&&qty>0)?(done/qty*100):null;
    return {quoted:q,actual:actual,pct:pct,over:actual>q,
            delta:actual-q,madePct:madePct,
            // projected total at the current per-part rate
            proj:(done>0&&qty)?(actual/done*qty):null};
  }

  function paceBarHTML(c,full){
    var p=paceOf(c);
    if(!p){
      return full
        ? '<div class="pace none"><div class="ph">Quoted vs actual</div>'+
          '<div class="pnone">No quoted hours.</div></div>'
        : '';
    }
    var capped=Math.min(p.pct,100);
    var overPct=p.over?Math.min((p.delta/p.quoted)*100,100):0;
    var state=p.over?'over':(p.pct>=85?'warn':'ok');

    // the "should be here" marker — where burn ought to sit given parts finished
    var marker=(p.madePct!=null)
      ? '<i class="pmark" style="left:'+Math.min(p.madePct,100).toFixed(1)+'%" '+
        'title="'+p.madePct.toFixed(0)+'% of parts finished"></i>'
      : '';

    var bar='<div class="ptrack '+state+'">'+
        '<i class="pfill" style="width:'+capped.toFixed(1)+'%"></i>'+
        (p.over?'<i class="pover" style="width:'+overPct.toFixed(1)+'%"></i>':'')+
        marker+
        '<i class="ptick" style="left:25%"></i><i class="ptick" style="left:50%"></i>'+
        '<i class="ptick" style="left:75%"></i>'+
      '</div>';

    if(!full){
      return '<div class="pace mini '+state+'">'+bar+
        '<div class="plbl"><span>'+p.actual.toFixed(2)+' / '+p.quoted.toFixed(2)+' hrs</span>'+
        '<b>'+Math.round(p.pct)+'%</b></div></div>';
    }

    var foot='';
    if(p.madePct!=null){
      var pace=p.pct-p.madePct;
      foot='<div class="pfoot '+(pace>8?'bad':pace<-8?'good':'')+'">'+
        Math.round(p.madePct)+'% of parts done on '+Math.round(p.pct)+'% of the hours \u00b7 '+
        (Math.abs(pace)<=8?'on pace':(pace>0?'burning ahead of output':'running under quote'))+
      '</div>';
      if(p.proj){
        foot+='<div class="pfoot">Projected at this rate: <b>'+p.proj.toFixed(2)+' hrs</b>'+
          ' \u00b7 '+(p.proj>p.quoted?('+'+(p.proj-p.quoted).toFixed(2)+' over'):
                      ((p.quoted-p.proj).toFixed(2)+' under'))+'</div>';
      }
    }

    return '<div class="pace '+state+'">'+
      '<div class="ph">Quoted vs actual'+
        '<span>'+(p.over?('+'+p.delta.toFixed(2)+' hrs over'):(p.quoted-p.actual).toFixed(2)+' hrs left')+
        '</span></div>'+
      bar+
      '<div class="plbl"><span>'+p.actual.toFixed(2)+' actual \u00b7 '+p.quoted.toFixed(2)+' quoted</span>'+
        '<b>'+Math.round(p.pct)+'%</b></div>'+
      foot+
    '</div>';
  }

  function advance(c){
    if(c.stage>=STAGES.length){toast('Already at the last station.');return;}
    // QC is the one station with a gate: a rejected or unrecorded inspection
    // shouldn't be able to walk downstream into Pack. Disabled for now — see
    // QC_GATE_ENABLED above.
    if(QC_GATE_ENABLED && (STAGES[c.stage-1]||{}).name==='QC'){
      var st=qcStatus(c);
      if(st==='fail'){toast('Inspection rejected \u2014 clear it before sending on.');return;}
      if(st!=='pass'){toast('No inspection recorded. Accept or reject it first.');openSheet(c,'qc');return;}
    }
    if(isRunning(c)){
      // Finishing while the clock runs still owes a parts count. Collect it first,
      // then advance — otherwise the session closes with a silent zero.
      openPartsPrompt(c);
      pendingAdvance=c.id;
      return;
    }
    doAdvance(c);
  }
  var pendingAdvance=null;
  function doAdvance(c){
    var to=c.stage+1, from=c.stage;
    c.stage=to;c.list=STAGES[to-1].name;
    // Local write stays — it's the optimistic update and the offline fallback.
    // The server write below is what makes the move survive a device switch.
    moves[c.id]=to;saveMoves();
    closeSheet();
    toast('Sent to '+STAGES[to-1].name);
    refreshViews();
    patchJob(c,{stage:to},function(ok){
      if(ok) return;
      // Server refused or unreachable: roll the card back rather than leave the
      // tablet showing a move that didn't persist. The whole point of this
      // endpoint is that two devices agree — a silent local-only move is the
      // exact failure it exists to prevent.
      c.stage=from;c.list=STAGES[from-1].name;
      moves[c.id]=from;saveMoves();
      toast('Move didn\u2019t save \u2014 put back in '+STAGES[from-1].name);
      refreshViews();
    });
  }

  // ---- WRITE PATH: api/jobs.js -----------------------------------------
  // Single choke point for every card mutation, so clock / QC / quoted hours
  // can hang off this same function as they get wired. Demo cards are never
  // sent — they have no server-side identity.
  function patchJob(c,fields,done){
    if(IS_DEMO||!c||!c.id){ if(done)done(true); return; }
    var body=Object.assign({id:c.id},fields);
    fetch('/api/jobs',{
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    })
    .then(function(r){ if(done)done(r.ok); })
    .catch(function(){ if(done)done(false); });
  }

  // ---- CARD FACE (MTG frame) -------------------------------------
  function money(n){
    if(n==null||isNaN(n))return '\u2014';
    return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function isPaid(c){return !!c.paidAt;}

  // Money state is three distinct things, and conflating them is how an invoice
  // gets forgotten. A job at Ship with no invoice number is money not yet asked
  // for; an invoice with no payment is money owed; paid is done. Only shown from
  // Ship onward — meaningless while the part is still being made.
  function moneyState(c){
    if(c.paidAt) return 'paid';
    if(c.invoice) return 'unpaid';
    if(c.stage>=6) return 'uninvoiced';
    return null;
  }
  function moneyFlag(c){
    var m=moneyState(c);
    if(m==='paid')       return '<span class="flag paid">PAID</span>';
    if(m==='unpaid')     return '<span class="flag unpaid">INV '+esc(c.invoice)+' \u00b7 UNPAID</span>';
    if(m==='uninvoiced') return '<span class="flag noinv">NOT INVOICED</span>';
    return '';
  }

  function flagsHTML(c){
    var f='';
    if(isLate(c))f+='<span class="flag late">'+Math.abs(c.days)+'D LATE</span>';
    var sib=siblings(c);
    if(sib)f+='<span class="flag sib">+'+sib+' ON PO</span>';
    if(isRunning(c))f+='<span class="flag run">RUNNING</span>';
    // QC state deliberately not shown here — it lives on the Quality tab, which
    // carries its own status pip. It was reading twice on one card.
    if(isMine(c)&&plain())f+='<span class="flag you">YOUR STATION</span>';
    f+=moneyFlag(c);
    return f;
  }
  function prow(k,v,click){
    return '<div class="prow'+(click?' clickable':'')+'"'+(click?' data-open="time"':'')+
           '><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  }

  // Per-card art view. Model is a placeholder until STEP parsing lands, but the
  // toggle is real so the slot exists and card layout won't shift when it does.
  var artMode={};
  function artHTML(c){
    var mode=artMode[c.id]||'photo';
    var body;
    if(mode==='model'){
      body='<div class="modelph"><svg viewBox="0 0 64 40" aria-hidden="true">'+
        '<path d="M8 26 L20 10 L44 10 L56 26 L44 34 L20 34 Z"/>'+
        '<path d="M20 10 L20 34 M44 10 L44 34 M8 26 L56 26"/>'+
        '<circle cx="32" cy="22" r="5"/></svg>'+
        '<i>NO MODEL \u2014 STEP NOT LOADED</i></div>';
    }else{
      body=c.photo?'<img src="'+esc(c.photo)+'" alt="">':'<i>NO PHOTO</i>';
    }
    return '<div class="art">'+body+
      '<div class="artsw" data-artsw="'+esc(c.id)+'">'+
        '<button class="'+(mode==='photo'?'on':'')+'" data-art="photo">Photo</button>'+
        '<button class="'+(mode==='model'?'on':'')+'" data-art="model">Model</button>'+
      '</div></div>';
  }

  // One delegated handler covers every context the card renders in — lane fan,
  // sheet, and dashboard row — so the toggle doesn't need re-wiring at each site.
  document.addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-art]');
    if(!b)return;
    var sw=b.closest('[data-artsw]');
    if(!sw)return;
    ev.stopPropagation();ev.preventDefault();
    var id=sw.getAttribute('data-artsw');
    var want=b.getAttribute('data-art');
    if(artMode[id]===want)return;
    artMode[id]=want;
    refreshViews();
  },true);

  function cardFaceHTML(c,big,extra){
    var done=partsDone(c), qty=(c.qty!=null?c.qty:null);
    var t=totalMs(c);

    // Quantity lives in exactly one place now — the corner index, MTG-style.
    // It used to appear three times: a Qty row, a Parts row, and the corner.
    var prod=prow('Time',t>0?(fmtHours(t)+' hrs'):(c.time!=null?esc(c.time)+' hrs':'0.00 hrs'),true);

    // little op-share bar under the block
    var r=clocks[c.id];
    var bars='';
    if(r&&r.sessions&&r.sessions.length){
      var byOp={},tot=0;
      r.sessions.forEach(function(s){var o=s.op||'\u2014';byOp[o]=(byOp[o]||0)+s.ms;tot+=s.ms;});
      if(tot>0){
        var cols={'OP1':'var(--purple)','OP2':'var(--purple-lift)','OP3':'var(--pass)','\u2014':'var(--line-hot)'};
        bars='<div class="bars">'+Object.keys(byOp).map(function(o){
          return '<i style="width:'+((byOp[o]/tot)*100).toFixed(1)+'%;background:'+(cols[o]||'var(--line-hot)')+'"></i>';
        }).join('')+'</div>';
      }
    }

    var flags=flagsHTML(c);

    return '<div class="plate2">'+
      '<div class="tbar"><div class="tname">'+esc(c.part||c.name||'\u2014')+'</div>'+
        '<div class="two">'+esc(c.wo)+'</div></div>'+
      artHTML(c)+
      '<div class="tline"><b>PO '+esc(c.po||'\u2014')+'</b><em>\u00b7</em>'+
        'REV '+esc(c.rev||'\u2014')+'<em>\u00b7</em>'+esc(dueText(c))+
        // price rides the same line — a card with no price says so plainly
        // rather than staying silent about it
        '<em>\u00b7</em><span class="pr'+(c.price==null?' none':'')+'">'+
        (c.price==null?'NO PRICE':money(c.price)+'/ea')+'</span></div>'+
      '<div class="tbox">'+prod+bars+paceBarHTML(c,false)+'</div>'+
      (flags?'<div class="flags">'+flags+'</div>':'')+
      '<div class="bbar"><div class="coll">'+esc(c.customer||'\u2014')+'<br>'+
        esc((STAGES[c.stage-1]||{}).name||c.list||'\u2014')+'</div>'+
        '<div class="pt">'+done+' / '+(qty!=null?esc(qty):'?')+'</div></div>'+
      (extra||'')+
    '</div>';
  }

  function miniActsHTML(c){

  // c.dueDate is carried on the card now; fall back to reconstructing from days.
  function isoDate(c){
    if(c.dueDate)return String(c.dueDate).slice(0,10);
    if(c.days==null)return '';
    var d=new Date(); d.setDate(d.getDate()+c.days);
    return d.toISOString().slice(0,10);
  }

  function openSheet(c,mode){
    openSheetId=c.id;sheetMode=mode||'card';

             :(sheetMode==='qc')?qcHTML(c)

    sheetEl.innerHTML='<button class="close" aria-label="Close">\u00d7</button>'+
      modeTabsHTML(c)+cardFaceHTML(c,true,extra);

    sheetEl.querySelector('.close').onclick=closeSheet;
    Array.prototype.forEach.call(sheetEl.querySelectorAll('.smode'),function(b){
      b.onclick=function(ev){ev.stopPropagation();openSheet(c,b.getAttribute('data-m'));};
    });

  function closeSheet(){

  function breakdownHTML(c){
    var r=clocks[c.id];
    var total=totalMs(c);
    var body='';
    if(!r||!r.sessions||!r.sessions.length){
      body='<div class="none">No time logged.</div>';
    }else{
      var byOp={};
      r.sessions.forEach(function(s){
        var o=s.op||'Unassigned';
        if(!byOp[o])byOp[o]={ms:0,parts:0,n:0};
        byOp[o].ms+=s.ms;byOp[o].parts+=(s.parts||0);byOp[o].n++;
      });
      var max=Math.max.apply(null,Object.keys(byOp).map(function(o){return byOp[o].ms;}))||1;
      body=Object.keys(byOp).map(function(o){
        var d=byOp[o];
        var pct=total>0?Math.round(d.ms/total*100):0;
        return '<div class="seg '+o.toLowerCase()+'">'+
          '<div class="sl"><span>'+esc(o)+' \u00b7 '+d.n+' session'+(d.n===1?'':'s')+
            (d.parts?(' \u00b7 '+d.parts+' pcs'):'')+'</span>'+
            '<b>'+fmtHours(d.ms)+' hrs \u00b7 '+pct+'%</b></div>'+
          '<div class="track"><i style="width:'+Math.round(d.ms/max*100)+'%"></i></div></div>';
      }).join('');
      if(c.qty){
        var done=partsDone(c);
        var perPart=done>0?(total/done/3600000):0;
        body+='<div class="none" style="margin-top:4px">'+done+' of '+c.qty+' parts logged'+
          (perPart>0?(' \u00b7 '+perPart.toFixed(2)+' hrs per part'):'')+'</div>';
      }
    }
    return '<div class="brk">'+
      '<div class="bh">Time breakdown <span>'+fmtHours(total)+' hrs</span></div>'+
      body+
      paceBarHTML(c,true)+
      '<div class="qrow2">'+
        '<input id="qHrs" type="number" min="0" step="0.25" inputmode="decimal" '+
          'placeholder="Quoted hours" value="'+(quotedHrs(c)!=null?quotedHrs(c):'')+'">'+
        '<button data-do="setquote">Set</button>'+
      '</div>'+
      '<div class="logrow">'+
        '<select id="lOp">'+opsFor(c).map(function(o){return '<option>'+o+'</option>';}).join('')+'</select>'+
        '<input id="lParts" type="number" min="1" step="1" inputmode="numeric" placeholder="Parts finished">'+
        '<button data-do="logparts">Log</button>'+
      '</div>'+
    '</div>';
  }
