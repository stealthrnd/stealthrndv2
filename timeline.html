  // Writes the Details tab to the job record, then confirms against a fresh
  // read before saying it saved. Same discipline as everywhere else that touches
  // /api/jobs: the server decides whether it worked, not the screen.
  function saveDetails(c){
    var st=sheetEl.querySelector('#iStat');
    var g=function(id){var v=sheetEl.querySelector(id); return v?v.value.trim():'';};
    var num=function(v){return v===''?null:Number(v);};

    var fields={
      qty:num(g('#iQty')),
      price:num(g('#iPrice')),
      rev:g('#iRev')||null,
      dueDate:g('#iDue')||null,
      invoice:g('#iInv')||null,
      paidAt:g('#iPaid')||null,
      dadJob:!!(sheetEl.querySelector('#iDad')&&sheetEl.querySelector('#iDad').checked)
    };
    var qh=num(g('#iQuoted'));
    setQuoted(c,(qh==null||qh<=0)?null:qh);   // keeps the pace bar live immediately
    fields.quoted=qh;

    st.textContent='Saving\u2026'; st.className='st busy';

    patchJob(c,fields,function(ok){
      if(!ok){ st.textContent='Didn\u2019t save \u2014 try again'; st.className='st bad'; return; }
      st.textContent='Checking\u2026';
      fetch('/api/jobs?id='+encodeURIComponent(c.id),{credentials:'same-origin',cache:'no-store'})
        .then(function(r){ if(!r.ok)throw new Error(); return r.json(); })
        .then(function(live){
          if(live.qty!==fields.qty||live.price!==fields.price){
            st.textContent='Saved but didn\u2019t verify'; st.className='st bad'; return;
          }
          if(live.invoice!==fields.invoice){
            // api/jobs.js won't let a PATCH null out an existing invoice number
            // — it drops that one field rather than erroring, so a cleared
            // field snaps back instead of silently reporting Saved.
            c.qty=live.qty; c.price=live.price; c.rev=live.rev; c.dueDate=live.dueDate;
            c.invoice=live.invoice; c.paidAt=live.paidAt; c.dadJob=live.dadJob;
            c.active=(c.stage<6&&!c.paidAt);
            st.textContent='Saved \u2014 invoice number can\u2019t be cleared once set';
            st.className='st bad';
            refreshViews();
            setTimeout(function(){ if(openSheetId===c.id)openSheet(c,'info'); },900);
            return;
          }
          c.qty=live.qty; c.price=live.price; c.rev=live.rev; c.dueDate=live.dueDate;
          c.invoice=live.invoice; c.paidAt=live.paidAt; c.dadJob=live.dadJob;
          if(live.dueDate){
            var d=new Date(live.dueDate);
            c.days=isNaN(d)?null:Math.floor((d.setHours(23,59,59,999)-Date.now())/86400000);
          }
          c.active=(c.stage<6&&!c.paidAt);
          st.textContent='Saved'; st.className='st ok';
          refreshViews();
          setTimeout(function(){ if(openSheetId===c.id)openSheet(c,'info'); },400);
        })
        .catch(function(){ st.textContent='Couldn\u2019t confirm'; st.className='st bad'; });
    });
  }

  function wireSheet(c){
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-do],[data-open]'),function(b){
      b.onclick=function(ev){
        ev.stopPropagation();
        var a=b.getAttribute('data-do')||('time');
        if(a==='in'){clockIn(c);openSheet(c,'card');}
        else if(a==='out'){clockOut(c);openSheet(c,'card');}
        else if(a==='next'){advance(c);}
        else if(a==='time'){openSheet(c,'time');}
        else if(a==='qc'){openSheet(c,'qc');}
        else if(a==='setquote'){
          var h=parseFloat(sheetEl.querySelector('#qHrs').value);
          setQuoted(c,isNaN(h)?null:h);
          openSheet(c,'time');
        }
        else if(a==='back'){openSheet(c,'card');}
        else if(a==='infosave'){ saveDetails(c); }
        else if(a==='paidnow'){
          sheetEl.querySelector('#iPaid').value=new Date().toISOString().slice(0,10);
        }
        else if(a==='paidclear'){ sheetEl.querySelector('#iPaid').value=''; }
        else if(a==='qcadd'){
          var feat=sheetEl.querySelector('#qFeat').value.trim();
          if(!feat){sheetEl.querySelector('#qFeat').focus();return;}
          addCheck(c,feat,
            sheetEl.querySelector('#qNom').value.trim(),
            sheetEl.querySelector('#qAct').value.trim(),
            sheetEl.querySelector('#qTol').value.trim());
          openSheet(c,'qc');
        }
        else if(a==='qcinsp'){
          var n=parseInt(sheetEl.querySelector('#qInsp').value,10);
          setInspected(c,isNaN(n)||n<0?0:n);
          openSheet(c,'qc');
        }
        else if(a==='qcpass'){setQCVerdict(c,'pass');openSheet(c,'qc');}
        else if(a==='qcfail'){setQCVerdict(c,'fail');openSheet(c,'qc');}
        else if(a==='logparts'){
          var op=sheetEl.querySelector('#lOp').value;
          var n=parseInt(sheetEl.querySelector('#lParts').value,10);
          if(isNaN(n)||n<1){sheetEl.querySelector('#lParts').focus();return;}
          logParts(c,op,n);
          openSheet(c,'time');
        }
      };
    });
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-drop]'),function(b){
      b.onclick=function(ev){
        ev.stopPropagation();
        dropCheck(c,parseInt(b.getAttribute('data-drop'),10));
        openSheet(c,'qc');
      };
    });
  }

  // ---- LANES -----------------------------------------------------
  STAGES.forEach(function(s,i){
    var lane=document.createElement('div');
    lane.className='lane';
    lane.innerHTML='<button class="node"></button><div class="fanUp"></div><div class="fanDown"></div>';
    flow.appendChild(lane);
    laneEls.push(lane);
    lane.querySelector('.node').addEventListener('click',function(ev){
      ev.stopPropagation();

  // Hover and wheel hit-test against lane geometry, with one exception: if the
  // pointer is actually on a card, that card's own lane wins. The fan spreads far
  // enough right to overhang the next lane, so pure x-geometry meant reaching for
  // the second card in a stack flipped the peek to the neighbouring station and
  // the stack you were reaching for vanished out from under the cursor.
  // How much of a lane's width counts as its "capture" zone, centred on the node.
  // Below 1.0 this leaves a dead gutter between lanes: drifting into the gutter
  // holds whatever lane you're already on instead of immediately switching. Lower
  // = stickier / harder to leave a lane by accident. 1.0 restores edge-to-edge.
  var LANE_CORE=0.45;
  // Grace margin in px around the fan's real extent. Bigger = more forgiving when
  // the pointer slips off the edge of a card. X is generous, Y deliberately tight —
  // the fan should own the space beside the cards, not the rail above them.
  var FAN_PAD=34;
  var FAN_PAD_Y=10;

  // Fan geometry lives in one place so the hit zone and the drawing can't drift
  // apart. CARD_W must match .card width in the stylesheet — and the stylesheet
  // narrows .card to 166px under 700px, so a hardcoded 216 made every mobile hit
  // zone 50px too wide. Read it from the DOM instead of restating it here, with
  // the two known values as the fallback.
  var CARD_W=216;
  function refreshCardW(){CARD_W=window.innerWidth<=700?166:216;}
  refreshCardW();
  window.addEventListener('resize',refreshCardW);
  function fanMetrics(i){
    var built=laneCards[i]||[];
    var n=built.length;
    if(!n)return null;
    var openNow=!!openState[i];
    // The zoomed lane owns most of the width, so its cards get scaled up and
    // spread further apart — that's the whole point of zooming, and CARD_W*scale
    // in fanSpan() means the hit zone grows with them automatically.
    var z=isZoomed(i);
    return {
      n:n, open:openNow, zoom:z,
      reveal:openNow?1:0.78,
      step:openNow?(z?(n>6?42:56):(n>6?26:34)):30,
      base:openNow?(z?38:30):24,
      scale:z?(openNow?1.34:1.05):(openNow?1:0.86)
    };
  }
  // Horizontal extent the fan actually occupies on screen, plus the vertical band
  // the cards really sit in. The span is generous left-to-right — that's the whole
  // point — but it must not claim the empty air above or below the stack, or the
  // rail itself stops responding while a wide fan is open.
  function fanSpan(i){
    var m=fanMetrics(i);
    if(!m)return null;
    if(!(openState[i]||peekState[i]))return null;
    var built=laneCards[i];
    var fi=((focusIdx[i]||0)%m.n+m.n)%m.n;
    var fEl=built[fi]&&built[fi].el;
    if(!fEl)return null;
    var fr=fEl.getBoundingClientRect();
    if(!fr.height)return null;

    var r=laneEls[i].getBoundingClientRect();
    var cx=r.left+r.width/2;
    var minTx=(0-fi)*m.step*m.reveal;
    var maxTx=(m.n-1-fi)*m.step*m.reveal;
    var half=(CARD_W*m.scale)/2;

    // cards step away from the centre line as they get further from focus
    var maxAd=Math.max(fi,m.n-1-fi);
    var spread=maxAd*7*m.reveal;
    var up=(STAGES[i].dir==='up');
    return {
      left:cx+minTx-half, right:cx+maxTx+half,
      top:   fr.top    - (up?spread:0) - FAN_PAD_Y,
      bottom:fr.bottom + (up?0:spread) + FAN_PAD_Y
    };
  }

  function currentLane(){
    for(var j=0;j<STAGES.length;j++)if(peekState[j])return j;
    for(var k=0;k<STAGES.length;k++)if(openState[k])return k;
    return -1;
  }
  function laneAt(clientX,sticky){
    var cur=-1;
    for(var i=0;i<laneEls.length;i++){
      var r=laneEls[i].getBoundingClientRect();
      if(clientX>=r.left&&clientX<r.right){cur=i;break;}
    }
    if(cur<0)return -1;
    var rr=laneEls[cur].getBoundingClientRect();
    var inset=rr.width*(1-LANE_CORE)/2;
    // Inside the core band: this lane takes the hover outright.
    if(clientX>=rr.left+inset&&clientX<rr.right-inset)return cur;
    // In the gutter: hold the lane we're already on rather than flipping. Only
    // when nothing is active does a gutter position claim a lane at all.
    if(sticky!=null&&sticky>=0)return sticky;
    return cur;
  }
  function laneFor(e){
    var el=e.target&&e.target.closest?e.target.closest('.card'):null;
    if(el&&el._lane!=null) return el._lane;
    var cur=currentLane();
    // Anywhere over the open fan — including the gaps between cards and a grace
    // margin past either end — stays with that lane. Sliding off the left edge of
    // the focused card no longer dumps you into the previous station.
    if(cur>=0){
      var sp=fanSpan(cur);
      if(sp&&e.clientX>=sp.left-FAN_PAD&&e.clientX<=sp.right+FAN_PAD&&
            e.clientY>=sp.top&&e.clientY<=sp.bottom) return cur;
    }
    return laneAt(e.clientX,cur);
  }
  flow.addEventListener('mousemove',function(e){
    var i=laneFor(e);
    // Only the lanes whose peek state actually flipped get rebuilt. renderAll()
    // here meant six lanes of DOM churn every time the pointer crossed a boundary.
    for(var j=0;j<STAGES.length;j++){
      var want=(j===i);
      if(!!peekState[j]!==want){peekState[j]=want;renderLane(j);}
    }
    // Hover-to-browse. Deliberately driven from mousemove rather than each card's
    // own mouseenter: focusing a card slides it to centre, which drops a different
    // card under the cursor — with mouseenter that fires again and the stack
    // shuffles on its own. mousemove only fires when the pointer really moves.
    if(i<0)return;
    var el=e.target&&e.target.closest?e.target.closest('.card'):null;
    if(!el||el._lane!==i||el._idx==null)return;
    if(focusIdx[i]===el._idx)return;
    focusIdx[i]=el._idx;
    positionLane(i,true);
    clearTimeout(laneSettle[i]);
    laneSettle[i]=setTimeout(function(){refreshFocusActs(i);},170);
  });
  // Click the empty board to close any open stage. Cards and nodes stop propagation
  // themselves, so anything reaching here is genuinely background.
  flow.addEventListener('click',function(e){
    if(e.target.closest&&(e.target.closest('.card')||e.target.closest('.node')))return;
    var changed=false;
    for(var j=0;j<STAGES.length;j++){
      if(openState[j]){openState[j]=false;changed=true;}
    }
    if(changed)renderAll();
  });

  flow.addEventListener('mouseleave',function(){
    for(var j=0;j<STAGES.length;j++){
      if(peekState[j]){peekState[j]=false;renderLane(j);}
    }
  });
  // Wheel riffling: strictly one card per notch, in order. Browsers report wildly
  // different deltaY per physical notch (3 on some trackpads, 300 on some mice), so
  // dividing by a fixed notch size meant one flick could jump three cards — that's
  // what read as random. Magnitude is now ignored entirely; only direction counts.
  var wheelAcc={}, wheelRAF={}, wheelIdle={}, wheelLast={};
  flow.addEventListener('wheel',function(e){
    var i=laneFor(e);
    if(i<0) return;
    if(!(openState[i]||peekState[i])) return;
    var n=stageCards(i+1).length;
    if(n<2) return;
    e.preventDefault();

    var now=(window.performance&&performance.now)?performance.now():Date.now();
    // A gap means a new gesture: drop leftover delta so it can't carry over.
    if(now-(wheelLast[i]||0)>160) wheelAcc[i]=0;
    wheelLast[i]=now;

    wheelAcc[i]=(wheelAcc[i]||0)+(e.deltaMode===1?e.deltaY*16:e.deltaY);

    var TH=40;
    if(Math.abs(wheelAcc[i])<TH) return;
    var dir=wheelAcc[i]>0?1:-1;
    wheelAcc[i]=0;                       // reset, don't subtract — no accumulation
    focusIdx[i]=(((focusIdx[i]||0)+dir)%n+n)%n;

    if(!wheelRAF[i]){
      wheelRAF[i]=requestAnimationFrame(function(){
        wheelRAF[i]=null;
        positionLane(i,true);
      });
    }
    clearTimeout(wheelIdle[i]);
    wheelIdle[i]=setTimeout(function(){refreshFocusActs(i);},160);
  },{passive:false});

  // Touch model. The axis that means "cards" flips depending on whether a stage
  // is open, because that's what the finger expects:
  //   nothing open  — horizontal swipe walks between stations
  //   stage open    — horizontal DRAG rifles that stage's cards (the main gesture:
  //                   open a station, thumb through it like a deck)
  //                 — vertical swipe steps to the previous/next station
  // Rifling tracks the finger continuously rather than firing once on release,
  // so a long drag flips several cards and you can see them move under your thumb.
  (function(){
    var sx=0,sy=0,st=0,go=false,axis=null,acc=0,openAt=-1;
    var STEP_PX=58;     // finger travel per card flipped
    var AXIS_LOCK=14;   // px before the gesture commits to an axis
    var SWIPE_MIN=42;   // discrete swipe threshold

    var rifleRAF=0, rifleLane=-1;
    function queueRifle(i){
      rifleLane=i;
      if(rifleRAF)return;
      rifleRAF=requestAnimationFrame(function(){
        rifleRAF=0;
        if(rifleLane>=0)positionLane(rifleLane,true);
      });
    }
    function openIdx(){
      for(var i=0;i<STAGES.length;i++){if(openState[i])return i;}
      return -1;
    }
    function gotoStage(next){
      if(next<0||next>=STAGES.length)return;
      STAGES.forEach(function(x,j){openState[j]=false;});
      openState[next]=true;
      renderAll();
    }

    flow.addEventListener('touchstart',function(e){
      if(e.touches.length!==1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
      go=true;axis=null;acc=0;openAt=openIdx();
    },{passive:true});

    flow.addEventListener('touchmove',function(e){
      if(!go||e.touches.length!==1)return;
      var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if(!axis){
        if(Math.abs(dx)<AXIS_LOCK&&Math.abs(dy)<AXIS_LOCK)return;
        axis=(Math.abs(dx)>Math.abs(dy))?'x':'y';
      }
      // Continuous rifle only applies to a horizontal drag on an open stage.
      if(axis!=='x'||openAt<0)return;
      if(!flow.classList.contains('dragging'))flow.classList.add('dragging');
      var n=stageCards(openAt+1).length;
      if(n<2)return;
      e.preventDefault();               // stop the page rubber-banding mid-rifle
      var want=Math.trunc((dx-acc)/STEP_PX);
      if(!want)return;
      acc+=want*STEP_PX;
      // drag left = advance through the deck, matching the wheel's direction
      focusIdx[openAt]=(((focusIdx[openAt]||0)-want)%n+n)%n;
      // touchmove can fire several times per frame on a 120Hz panel; laying the
      // lane out on each one does the same work two or three times and then
      // throws most of it away. Coalesce into one positionLane per animation
      // frame — the visible result is identical and the frame budget isn't blown.
      queueRifle(openAt);
    },{passive:false});

    flow.addEventListener('touchend',function(e){
      if(!go)return;go=false;
      flow.classList.remove('dragging');
      if(rifleRAF){cancelAnimationFrame(rifleRAF);rifleRAF=0;}
      var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      var adx=Math.abs(dx),ady=Math.abs(dy);

      if(axis==='x'&&openAt>=0){
        // Was a rifle — settle the actions on whatever card ended up in front.
        if(acc){
          positionLane(openAt,true);   // re-run with transitions live so it eases home
          setTimeout(function(){refreshFocusActs(openAt);},170);
        }
        else if(adx>=SWIPE_MIN&&Date.now()-st<=700){
          // Short flick that never crossed a card boundary: treat as a nudge.
          var n=stageCards(openAt+1).length;
          if(n>1){
            focusIdx[openAt]=(((focusIdx[openAt]||0)+(dx<0?1:-1))%n+n)%n;
            positionLane(openAt,true);
            setTimeout(function(){refreshFocusActs(openAt);},170);
          }
        }
        return;
      }
      if(Date.now()-st>700)return;
      if(adx<SWIPE_MIN&&ady<SWIPE_MIN)return;

      if(openAt<0){
        // No stage open: either axis walks the stations.
        if(adx>ady)gotoStage(dx<0?0:STAGES.length-1);
        return;
      }
      // Stage open + vertical swipe: step to the neighbouring station.
      if(ady>adx)gotoStage(openAt+(dy<0?1:-1));
    },{passive:true});
  })();

  // Lane rendering is split in two on purpose:
  //   renderLane(i)   — rebuilds the card DOM. Only when the card set or state changes.
  //   positionLane(i) — moves what's already there. Runs on every riffle tick.
  // The old code rebuilt every card's innerHTML on each wheel notch, which is why
  // flipping through a stack stuttered: it was re-parsing HTML mid-animation.
  var laneCards={};   // lane index -> [{el, card}]

  function positionLane(i,riffle){
    var built=laneCards[i];
    if(!built||!built.length)return;
    var s=STAGES[i];
    var openNow=!!openState[i];
    var showing=openNow||!!peekState[i];
    var n=built.length;
    var fi=((focusIdx[i]||0)%n+n)%n;
    paintCount(i,n);

    // Hiding is a fade, not a teardown. The DOM stays built so coming back to a
    // lane is a transition rather than a rebuild — that's what made hovering
    // across the board feel like it was catching.
    if(!showing){
      for(var h=0;h<n;h++){
        var eh=built[h].el;
        eh.classList.remove('show','riffle');
        eh.style.transitionDelay='0ms';
        // positionLane writes opacity as an inline style when showing, and an inline
        // style outranks the class rule — so dropping .show alone left the cards
        // sitting there fully visible. Clear the inline value too.
        eh.style.opacity='0';
        eh.style.pointerEvents='none';
      }
      return;
    }

    // Peek used to be a preview you couldn't touch. Now it's a browsing surface,
    // so the fan opens wider — each card needs a sliver big enough to aim at.
    var m=fanMetrics(i);
    var reveal=m.reveal, step=m.step, base=m.base;


    for(var k=0;k<n;k++){
      var elc=built[k].el, isFocus=(k===fi);
      var d=k-fi, ad=Math.abs(d);
      elc.style.zIndex=String(60-ad);
      var tx=d*step*reveal;
      var ty=(base+ad*7)*reveal*(s.dir==='up'?-1:1);
      var rot=d*(openNow?2.5:2)*reveal;
      var scale=m.scale*(isFocus?1:0.94);
      var op=isFocus?1:(openNow?0.94:(ad>3?0.55:0.8));

      // During a riffle every card moves at once with no stagger — the stagger is
      // what made fast scrolling feel like wading. Only the first reveal stacks.
      elc.style.transitionDelay=riffle?'0ms':(ad*22)+'ms';
      elc.classList.toggle('riffle',!!riffle);
      elc.classList.toggle('focus',isFocus);
      elc.style.transform='translate(calc(-50% + '+tx+'px), '+ty+'px) rotate('+rot+'deg) scale('+scale+')';
      elc.style.opacity=String(op);
      elc.style.pointerEvents='';   // clears the inline block set while hidden
      elc.classList.add('show');
    }
  }

  var laneSig={}, laneSettle={};
  function paintCount(i,total){
    var cnt=nodeEls[i]&&nodeEls[i].querySelector('.cnt');
    if(!cnt)return;
    var showing=openState[i]||peekState[i];
    if(showing&&total>1){
      var fi=((focusIdx[i]||0)%total+total)%total;
      cnt.textContent=(fi+1)+'/'+total;
      cnt.classList.add('pos');
    }else{
      cnt.textContent=String(total);
      cnt.classList.remove('pos');
    }
  }
  function sigOf(cards){
    return cards.map(function(c){
      return c.id+':'+c.stage+':'+(isRunning(c)?1:0)+':'+partsDone(c)+':'+(hits[c.id]?1:0)+
             ':'+(artMode[c.id]||'photo');
    }).join('|');
  }

  function renderLane(i){
    var s=STAGES[i],lane=laneEls[i],node=nodeEls[i];
    var cards=stageCards(i+1);
    var late=cards.filter(isLate).length;
    var mineStage=roleDef().stages.indexOf(i+1)>=0&&plain();

    node.className='node'+(openState[i]?' on':'')+(peekState[i]&&!openState[i]?' peek':'')+
                   (mineStage?' mine':'');
    node.innerHTML=(late?'<span class="late"></span>':'')+
      '<span class="plate"><span class="lbl">'+s.name+'</span>'+
      '<span class="cnt">'+cards.length+'</span></span><span class="dot"></span>';
    // position-in-stack moved into the node plate. It used to be a floating box
    // above the fan, which sat right on top of the timeline rail.
    paintCount(i,cards.length);

    // Nothing about the cards changed — this is just a show/hide. Reposition the
    // existing DOM instead of rebuilding it, so peeking is a pure transition.
    var sig=sigOf(cards);
    if(laneSig[i]===sig&&laneCards[i]&&laneCards[i].length===cards.length&&cards.length){
      positionLane(i,false);
      return;
    }
    laneSig[i]=sig;

    var up=lane.querySelector('.fanUp'),down=lane.querySelector('.fanDown');
    up.innerHTML='';down.innerHTML='';
    laneCards[i]=[];
    var host=(s.dir==='up')?up:down;
    if(!(openState[i]||peekState[i])){laneSig[i]=null;return;}

    if(!cards.length){
      var e=document.createElement('div');
      e.className='laneempty';e.textContent='No cards.';
      host.appendChild(e);
      return;
    }

    var n=cards.length;
    var fi=((focusIdx[i]||0)%n+n)%n;

    cards.forEach(function(c,idx){
      var elc=document.createElement('div');
      var mine=isMine(c)&&plain();
      var notMine=!isMine(c)&&plain();
      elc.className='card'+(isLate(c)?' late':'')+
                    (mine?' mine':'')+(notMine?' notmine':'')+(hits[c.id]?' hit':'');
      elc.innerHTML=cardFaceHTML(c,false,(idx===fi)?miniActsHTML(c):'');
      elc._cid=c.id;
      elc._idx=idx;
      elc._lane=i;
      elc.addEventListener('click',function(ev){
        if(ev.target.closest('[data-mini]'))return;
        ev.stopPropagation();
        openSheet(c,ev.target.closest('[data-open="time"]')?'time':'card');
      });
      host.appendChild(elc);

      Array.prototype.forEach.call(elc.querySelectorAll('[data-mini]'),function(b){
        b.onclick=function(ev){
          ev.stopPropagation();
          var a=b.getAttribute('data-mini');
          if(a==='in')clockIn(c);
          else if(a==='out')clockOut(c);
          else if(a==='status')openSheet(c,'time');
        };
      });

      laneCards[i].push({el:elc,card:c});
    });

    // first paint: let the browser see the start state, then fan out with stagger
    requestAnimationFrame(function(){positionLane(i,false);});
  }

  // The focused card carries the clock buttons. Rebuilding that markup mid-riffle is
  // what we're avoiding, so it's deferred until the stack stops moving.
  function refreshFocusActs(i){
    var built=laneCards[i];
    if(!built||!built.length)return;
    var n=built.length, fi=((focusIdx[i]||0)%n+n)%n;
    for(var k=0;k<n;k++){
      var b=built[k], has=!!b.el.querySelector('.mini-acts');
      if(k===fi&&!has)b.el.innerHTML=cardFaceHTML(b.card,false,miniActsHTML(b.card));
      else if(k!==fi&&has)b.el.innerHTML=cardFaceHTML(b.card,false,'');
      else continue;
      (function(el,c){
        Array.prototype.forEach.call(el.querySelectorAll('[data-mini]'),function(bt){
          bt.onclick=function(ev){
            ev.stopPropagation();
            var a=bt.getAttribute('data-mini');
            if(a==='in')clockIn(c);
            else if(a==='out')clockOut(c);
            else if(a==='status')openSheet(c,'time');
          };
        });
      })(b.el,b.card);
    }
  }

  function renderAll(){STAGES.forEach(function(s,i){renderLane(i);});}

  // ---- SEARCH ----------------------------------------------------
  var sscrim=document.getElementById('sscrim');
  var spal=document.getElementById('spal');
  var sInput=document.getElementById('sInput');
  var sRes=document.getElementById('sRes');
  var sFlat=[],sSel=0,sOpen=false;

  function openSearch(){
    sOpen=true;
    sscrim.classList.add('open');spal.classList.add('open');
    sInput.value='';sSel=0;
    runSearch('');
    setTimeout(function(){sInput.focus();},30);
  }
  function closeSearch(){
    sOpen=false;
    sscrim.classList.remove('open');spal.classList.remove('open');
  }
  sscrim.addEventListener('click',closeSearch);
  document.getElementById('searchBtn').onclick=openSearch;

  function buildResults(q){
    q=q.trim().toLowerCase();
    var groups=[
      {key:'Parts',items:[]},{key:'Work orders',items:[]},
      {key:'POs',items:[]},{key:'Invoices',items:[]},{key:'Customers',items:[]}
    ];
    if(!q){
      // no query yet: offer whatever is late, as a useful default
      CARDS.filter(isLate).slice(0,8).forEach(function(c){
        groups[0].items.push({label:c.part||c.wo,meta:'PO '+(c.po||'\u2014')+' \u00b7 '+
          Math.abs(c.days)+'d over',note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      });
      return groups.filter(function(g){return g.items.length;});
    }
    var seenPO={},seenCust={};
    CARDS.forEach(function(c){
      if((c.part||'').toLowerCase().indexOf(q)>=0){
        groups[0].items.push({label:c.part,meta:(c.customer||'')+' \u00b7 PO '+(c.po||'\u2014')+
          ' \u00b7 qty '+(c.qty!=null?c.qty:'\u2014'),note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if((c.wo||'').toLowerCase().indexOf(q)>=0){
        groups[1].items.push({label:c.wo,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.invoice&&String(c.invoice).toLowerCase().indexOf(q)>=0){
        groups[3].items.push({label:'INV '+c.invoice,meta:(c.part||'')+' \u00b7 '+(c.customer||''),
          note:(STAGES[c.stage-1]||{}).name,ids:[c.id]});
      }
      if(c.po&&String(c.po).toLowerCase().indexOf(q)>=0&&!seenPO[c.po]){
        seenPO[c.po]=1;
        var sib=CARDS.filter(function(x){return x.po===c.po;});
        groups[2].items.push({label:'PO '+c.po,meta:sib.map(function(x){return x.part;}).join(', '),
          note:sib.length+' card'+(sib.length===1?'':'s'),ids:sib.map(function(x){return x.id;})});
      }
      if(c.customer&&c.customer.toLowerCase().indexOf(q)>=0&&!seenCust[c.customer]){
        seenCust[c.customer]=1;
        var mine=CARDS.filter(function(x){return x.customer===c.customer;});
        groups[4].items.push({label:c.customer,meta:mine.length+' open card'+(mine.length===1?'':'s'),
          note:'',ids:mine.map(function(x){return x.id;})});
      }
    });
    return groups.filter(function(g){return g.items.length;});
  }

  function runSearch(q){
    var groups=buildResults(q);
    sFlat=[];
    if(!groups.length){
      sRes.innerHTML='<div class="sempty">Nothing matches that.</div>';
      return;
    }
    var html='';
    groups.forEach(function(g){
      html+='<div class="sgrp">'+esc(g.key)+'</div>';
      g.items.slice(0,8).forEach(function(it){
        var idx=sFlat.length;
        sFlat.push(it);
        html+='<div class="sitem" data-i="'+idx+'">'+
          '<span class="sk">'+esc(it.label)+'</span>'+
          '<span class="sm">'+esc(it.meta||'')+'</span>'+
          '<span class="sn">'+esc(it.note||'')+'</span></div>';
      });
    });
    sRes.innerHTML=html;
    if(sSel>=sFlat.length) sSel=0;
    paintSel();
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      el.onclick=function(){ sSel=+el.getAttribute('data-i'); choose(); };
    });
  }
  function paintSel(){
    Array.prototype.forEach.call(sRes.querySelectorAll('.sitem'),function(el){
      var on=(+el.getAttribute('data-i')===sSel);
      el.classList.toggle('sel',on);
      if(on&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    });
  }
  function choose(){
    var it=sFlat[sSel];
    if(!it)return;
    closeSearch();
    gotoCards(it.ids);
  }

  // Bring the timeline to a card (or a PO's whole set) and mark them.
  function gotoCards(ids){
    hits={};
    ids.forEach(function(id){hits[id]=1;});
    setView('timeline');
    var stagesHit={};
    ids.forEach(function(id){
      var c=byId(id);
      if(c) stagesHit[c.stage]=1;
    });
    STAGES.forEach(function(s,i){ openState[i]=!!stagesHit[i+1]; });
    // focus the first hit inside each opened stage
    Object.keys(stagesHit).forEach(function(st){
      var list=stageCards(+st);
      for(var i=0;i<list.length;i++){
        if(hits[list[i].id]){ focusIdx[+st-1]=i; break; }
      }
    });
    renderAll();
    if(ids.length===1){
      var c=byId(ids[0]);
      if(c) setTimeout(function(){openSheet(c,'card');},260);
    } else {
      toast(ids.length+' cards across '+Object.keys(stagesHit).length+' stage'+
            (Object.keys(stagesHit).length===1?'':'s'));
    }
    setTimeout(function(){hits={};renderAll();},6000);
  }

  sInput.addEventListener('input',function(){sSel=0;runSearch(sInput.value);});
  sInput.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();sSel=Math.min(sSel+1,sFlat.length-1);paintSel();}
    else if(e.key==='ArrowUp'){e.preventDefault();sSel=Math.max(sSel-1,0);paintSel();}
    else if(e.key==='Enter'){e.preventDefault();choose();}
    else if(e.key==='Escape'){e.preventDefault();closeSearch();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ if(sOpen)closeSearch(); else closeSheet(); return; }
    var typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||''));
    if(!sOpen&&!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){
      e.preventDefault();openSearch();
    }
  });
  // terminal shell can hand us a card to jump to
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='sr:focusCard'&&d.id) gotoCards([d.id]);
    if(d.type==='sr:search') openSearch();
  });

  // ---- DASHBOARD -------------------------------------------------
  function priority(a,b){
    if(isRunning(a)!==isRunning(b))return isRunning(a)?-1:1;
    var ad=(a.days==null)?9999:a.days,bd=(b.days==null)?9999:b.days;
    return ad-bd;
  }
  // Dashboard sort. Due date is the default because it's the only ordering that
  // answers "what do I touch next"; the others are for finding things. A running
  // clock always floats to the top regardless of sort — you need to see what
  // you're on.
  var dashSort=lsGet('sr_dsort','due');
  // Right-click (or long-press on a tablet) opens a Trello-style menu to jump
  // a card straight to a stage. Ctrl/Cmd-click toggles a card into a light
  // multi-selection first; right-clicking a selected card then acts on the
  // whole selection. Dashboard only — the Timeline fan's hover-peek /
  // wheel-riffle / drag gestures already use touchstart and a long-press
  // timer on top of that would fight the rifle gesture.
  var selected={};
  function selectedCount(){return Object.keys(selected).length;}
  function byDue(a,b){
    var ad=(a.days==null)?9999:a.days,bd=(b.days==null)?9999:b.days;
    return ad-bd;
  }
  function txt(v){return String(v==null?'':v).toLowerCase();}
  var SORTS={
    due:      byDue,
    customer: function(a,b){ return txt(a.customer).localeCompare(txt(b.customer))||byDue(a,b); },
    po:       function(a,b){ return txt(a.po).localeCompare(txt(b.po),undefined,{numeric:true})||byDue(a,b); },
    stage:    function(a,b){ return (a.stage-b.stage)||byDue(a,b); }
  };
  function dashCompare(a,b){
    if(isRunning(a)!==isRunning(b))return isRunning(a)?-1:1;
    return (SORTS[dashSort]||byDue)(a,b);
  }
  // Group heading for the current sort — null means one flat list.
  function groupKey(c){
    if(dashSort==='stage')    return (STAGES[c.stage-1]||{}).name||'';
    if(dashSort==='customer') return c.customer||'No customer';
    if(dashSort==='po')       return 'PO '+(c.po||'\u2014');
    return null;
  }
  // Due date has no natural group key, so it buckets by urgency instead — which
  // is the question the sort is actually answering ("what's on fire"), and it
  // gives the table the same dealt-hands shape as the other sorts.
  function dueBucket(c){
    if(c.days==null)      return 'No date';
    if(c.days<0)          return 'Late';
    if(c.days===0)        return 'Today';
    if(c.days<=7)         return 'This week';
    return 'Later';
  }
  var DUE_ORDER=['Late','Today','This week','Later','No date'];

  function handsFor(list){
    var order=[],map={};
    list.forEach(function(c){
      var k=(dashSort==='due')?dueBucket(c)
           :(dashSort==='paid')?('INV '+(c.invoice||'\u2014'))
           :groupKey(c);
      if(k==null)k='';
      if(!map[k]){map[k]=[];order.push(k);}
      map[k].push(c);
    });
    if(dashSort==='due'){
      order.sort(function(a,b){return DUE_ORDER.indexOf(a)-DUE_ORDER.indexOf(b);});
    }
    return order.map(function(k){return {key:k,cards:map[k]};});
  }

  function renderDash(){
    var r=roleDef();
    var paidView=(dashSort==='paid');

    // Paid is an archive, not a station queue — it ignores role entirely and
    // shows every paid job, most recently paid first. Everything below this
    // point (seating, fanning, dealing) is shared with the normal view.
    var mine;
    if(paidView){
      mine=CARDS.filter(isPaid).sort(function(a,b){
        return String(b.paidAt||'').localeCompare(String(a.paidAt||''));
      });
      var val=mine.reduce(function(a,c){
        return a+((c.qty!=null&&c.price!=null)?c.qty*c.price:0);
      },0);
      document.getElementById('dTitle').textContent='Paid';
      document.getElementById('dSub').textContent=
        mine.length ? mine.length+' job'+(mine.length===1?'':'s')+
                      (val?(' \u00b7 '+money(val)+' collected'):'') : '';
    }else{
      mine=CARDS.filter(function(c){return isMine(c)&&c.active;}).sort(dashCompare);
      document.getElementById('dTitle').textContent=r.label;
      var lateN=mine.filter(isLate).length;
      document.getElementById('dSub').textContent=
        r.stages.length===0 ? '' :
        mine.length+' open'+(lateN?(' \u00b7 '+lateN+' late'):'');
    }

    var host=document.getElementById('dList');
    if(!mine.length){
      host.className='seats empty';
      host.innerHTML='<div class="dempty">'+
        (paidView?'Nothing marked paid yet.':'Nothing at your station.')+'</div>';
      return;
    }
    host.className='seats';
    host.innerHTML='<div class="seatcol"></div><div class="gut"></div><div class="seatcol"></div>';
    var cols=host.querySelectorAll('.seatcol');
    var rows=[];
    // Seat width decides how wide a hand can fan before the cards stop being
    // readable. Past that the hand is dealt in two or three balanced rows rather
    // than squeezed into a stack of slivers.
    var CW=(window.innerWidth<=700)?132:150;
    var seatW=cols[0].clientWidth||330;
    var perRow=Math.max(3,Math.floor((seatW-CW)/34)+1);

    // Hands are seated alternately either side of the house mark, in deal order.
    handsFor(mine).forEach(function(h,gi){
      var hand=document.createElement('div');
      hand.className='hand';
      var lateInHand=h.cards.filter(isLate).length;
      hand.innerHTML='<div class="handlbl">'+esc(h.key||'\u2014')+
        '<i>'+h.cards.length+'</i>'+
        (lateInHand?'<b class="lt">'+lateInHand+' late</b>':'')+'</div>';
      var nRows=Math.ceil(h.cards.length/perRow);
      var per=Math.ceil(h.cards.length/nRows);
      var ci=0;
      for(var ri=0;ri<nRows;ri++){
        var row=document.createElement('div');
        row.className='handrow';
        h.cards.slice(ri*per,(ri+1)*per).forEach(function(c){
          var el=tableCard(c);
          // one group at a time, card by card inside it — that is the deal rhythm
          el._dealDelay=gi*90+(ci++)*46;
          row.appendChild(el);
        });
        hand.appendChild(row);
        rows.push(row);
      }
      cols[gi%2].appendChild(hand);
    });

    // Fit each hand to its seat: the overlap tightens as the hand grows, so a
    // big group stays on the felt instead of running off the edge of the table.
    requestAnimationFrame(function(){
      rows.forEach(function(row){
        var n=row.children.length;
        if(!n)return;
        var w=row.parentNode.clientWidth||320;
        var cw=row.children[0].offsetWidth||150;
        var step=(n>1)?Math.max(26,Math.min(54,(w-cw)/(n-1))):0;
        row.style.setProperty('--step',step.toFixed(1)+'px');
      });
    });
  }

  // One card on the table. Same MTG face as the timeline — the CSS shrinks it;
  // the markup is identical so the two views can never disagree about what a
  // job looks like.
  function tableCard(c){
    var el=document.createElement('div');
    el.className='card tcard'+(isLate(c)?' late':'')+
                 (isMine(c)&&plain()?' mine':'')+
                 (isRunning(c)?' running':'')+
                 (selected[c.id]?' selected':'');
    el.setAttribute('data-id',c.id);
    el._cid=c.id;
    el.innerHTML=cardFaceHTML(c,false,'');
    el.title=(c.part||'')+'  \u00b7  PO '+(c.po||'\u2014')+'  \u00b7  '+(c.customer||'')+
             '  \u00b7  '+dueText(c);
    el.addEventListener('click',function(ev){
      if(ev.target.closest('[data-mini]'))return;
      if(ev.metaKey||ev.ctrlKey){ toggleSelect(c.id,el); return; }
      // A plain click while cards are picked clears the pick rather than
      // opening whatever's underneath it — same convention as a file manager.
      if(selectedCount()){ clearSelection(); return; }
      openSheet(c,'card');
    });
    wireCardContextMenu(el,c);
    return el;
  }

  function toggleSelect(id,el){
    if(selected[id]) delete selected[id]; else selected[id]=true;
    if(el) el.classList.toggle('selected',!!selected[id]);
  }
  function clearSelection(){
    selected={};
    Array.prototype.forEach.call(document.querySelectorAll('.tcard.selected'),function(e){
      e.classList.remove('selected');
    });
  }

  // ---- right-click / long-press context menu ----------------------------
  var ctxMenuEl=null;
  function ensureCtxMenu(){
    if(ctxMenuEl) return ctxMenuEl;
    ctxMenuEl=document.createElement('div');
    ctxMenuEl.className='ctxmenu';
    document.body.appendChild(ctxMenuEl);
    document.addEventListener('click',closeCtxMenu);
    document.addEventListener('contextmenu',function(ev){
      if(!ev.target.closest('.tcard')) closeCtxMenu();
    });
    document.addEventListener('scroll',closeCtxMenu,true);
    window.addEventListener('resize',closeCtxMenu);
    document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') closeCtxMenu(); });
    return ctxMenuEl;
  }
  function closeCtxMenu(){ if(ctxMenuEl) ctxMenuEl.classList.remove('on'); }

  function openCtxMenu(x,y,ids){
    var jobs=ids.map(byId).filter(Boolean);
    if(!jobs.length) return;
    var menu=ensureCtxMenu();
    var label=jobs.length===1?(jobs[0].part||jobs[0].wo||'Card'):jobs.length+' cards';
    var openRow=jobs.length===1
      ? '<button class="ctxitem" data-act="open">Open card</button><div class="ctxdiv"></div>'
      : '';
    var stageRows=STAGES.map(function(s,i){
      var n=i+1, allHere=jobs.every(function(c){return c.stage===n;});
      return '<button class="ctxitem'+(allHere?' cur':'')+'" data-stage="'+n+'"'+
        (allHere?' disabled':'')+'>'+(allHere?'\u2713 ':'')+esc(s.name)+'</button>';
    }).join('');
    menu.innerHTML='<div class="ctxhd">'+esc(label)+'</div>'+openRow+stageRows;

    var b=menu.querySelector('[data-act="open"]');
    if(b) b.onclick=function(ev){ ev.stopPropagation(); closeCtxMenu(); clearSelection(); openSheet(jobs[0],'card'); };
    Array.prototype.forEach.call(menu.querySelectorAll('.ctxitem[data-stage]'),function(bt){
      if(bt.disabled) return;
      bt.onclick=function(ev){ ev.stopPropagation(); closeCtxMenu(); moveCardsTo(jobs,+bt.getAttribute('data-stage')); };
    });

    var mw=menu.offsetWidth||172, mh=menu.offsetHeight||220;
    menu.style.left=Math.max(8,Math.min(x,window.innerWidth-mw-8))+'px';
    menu.style.top=Math.max(8,Math.min(y,window.innerHeight-mh-8))+'px';
    menu.classList.add('on');
  }

  // Long-press stands in for right-click on a touch surface — the Terminal
  // is browser-based on a tablet, and neither a right-click nor a Ctrl-click
  // exists there. Cancels on any real movement so it doesn't fire mid-scroll.
  function wireCardContextMenu(el,c){
    el.addEventListener('contextmenu',function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var ids=selected[c.id]?Object.keys(selected):[c.id];
      openCtxMenu(ev.clientX,ev.clientY,ids);
    });
    var timer=null,sx=0,sy=0;
    el.addEventListener('touchstart',function(ev){
      if(ev.touches.length!==1) return;
      sx=ev.touches[0].clientX; sy=ev.touches[0].clientY;
      timer=setTimeout(function(){
        timer=null;
        var ids=selected[c.id]?Object.keys(selected):[c.id];
        openCtxMenu(sx,sy,ids);
        if(navigator.vibrate) navigator.vibrate(8);
      },480);
    },{passive:true});
    el.addEventListener('touchmove',function(ev){
      if(!timer) return;
      var dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
      if(Math.abs(dx)>10||Math.abs(dy)>10){ clearTimeout(timer); timer=null; }
    },{passive:true});
    el.addEventListener('touchend',function(){ if(timer){clearTimeout(timer);timer=null;} });
    el.addEventListener('touchcancel',function(){ if(timer){clearTimeout(timer);timer=null;} });
  }

  // Sequential on purpose, one PATCH in flight at a time. api/jobs.js does a
  // read-whole-blob / modify-one-job / write-whole-blob per request — two
  // PATCHes racing means the second write silently clobbers the first, the
  // same trap that lost values when the backfill tool first fired one PATCH
  // per keystroke. Move one card, wait for it to land, then start the next.
  // No QC gate here — see QC_GATE_ENABLED.
  function moveCardsTo(jobs,targetStage){
    if(!jobs.length) return;
    var held=QC_GATE_ENABLED?jobs.filter(function(c){
      return c.stage===QC_STAGE_NUM&&targetStage>QC_STAGE_NUM&&qcStatus(c)!=='pass';
    }):[];
    var moving=jobs.filter(function(c){return held.indexOf(c)<0;});

    var prevStage={};
    moving.forEach(function(c){
      prevStage[c.id]=c.stage;
      c.stage=targetStage;c.list=STAGES[targetStage-1].name;
      moves[c.id]=targetStage;
    });
    saveMoves();
    clearSelection();
    toast('Moved '+moving.length+' card'+(moving.length===1?'':'s')+' to '+STAGES[targetStage-1].name+
          (held.length?(' \u2014 '+held.length+' held at QC'):''));
    refreshViews();

    var i=0, failed=[];
    (function next(){
      if(i>=moving.length){
        if(failed.length){
          failed.forEach(function(c){
            var from=prevStage[c.id];
            c.stage=from;c.list=STAGES[from-1].name;moves[c.id]=from;
          });
          saveMoves();
          toast(failed.length+' didn\u2019t save \u2014 put back');
          refreshViews();
        }
        return;
      }
      var c=moving[i++];
      patchJob(c,{stage:targetStage},function(ok){ if(!ok)failed.push(c); next(); });
    })();
  }

  setInterval(function(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-clock]'),function(t){
      var c=byId(t.getAttribute('data-clock'));
      if(c)t.textContent=fmtHMS(totalMs(c));

    Array.prototype.forEach.call(document.querySelectorAll('.mb.live'),function(b){
      var card=b.closest('.card');
      if(!card||!card._cid)return;
      var c=byId(card._cid);
      if(c&&isRunning(c))b.textContent=fmtHMS(totalMs(c));
    });
  },1000);

    // Picking a station zooms the timeline onto it — it does NOT change views.
    // The fan stays the working surface; the focused lane just gets most of the

  // ---- dashboard sort buttons ----
  // FLIP shuffle: measure where every card is, re-render in the new order,
  // then start each card at its OLD position and let CSS transition it home.
  // Cards physically slide past each other like a hand being reordered, which
  // is also what makes it obvious the order changed rather than the content.
  // THE DEAL. Changing the sort re-deals the table: every card collapses to the
  // sort buttons — the dealer's hands — and is flung out to its new seat, in
  // order, with a little rotation so it reads as a throw rather than a slide.
  // Pure FLIP with a shared origin instead of each card's previous position.
  function dealFrom(originEl,fn){
    var host=document.getElementById('dList');
    var o=originEl.getBoundingClientRect();
    var ox=o.left+o.width/2, oy=o.bottom-6;   // cards slide out from under the dealer

    fn();   // re-render into the new grouping

    var cards=host.querySelectorAll('.tcard');
    if(!cards.length)return;

    // Pre-flight: park every card on top of the buttons, shrunk and turned.
    var list=[];
    Array.prototype.forEach.call(cards,function(e,i){
      var r=e.getBoundingClientRect();
      var dx=ox-(r.left+r.width/2), dy=oy-(r.top+r.height/2);
      var rot=(i%2?-1:1)*(8+Math.random()*14);
      e.classList.add('predeal');
      e.style.opacity='0';
      e.style.transform='translate('+dx+'px,'+dy+'px) scale(.16) rotate('+rot+'deg)';
      list.push(e);
    });

    // Two frames: the first commits the parked state, the second releases it.
    // One frame isn't enough — the browser coalesces both writes and nothing moves.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        list.forEach(function(e,i){
          e.classList.remove('predeal');
          e.classList.add('dealt');
          e.style.transitionDelay=((e._dealDelay!=null)?e._dealDelay:i*34)+'ms';
          e.style.opacity='';
          e.style.transform='';
        });
        // Clean up so :hover peek gets its own short transition back.
        var maxd=0;
        list.forEach(function(e){ if((e._dealDelay||0)>maxd)maxd=e._dealDelay||0; });
        setTimeout(function(){
          list.forEach(function(e){
            e.classList.remove('dealt');
            e.style.transitionDelay='';
          });
        },maxd+900);
      });
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.dsort button[data-sort]'),function(b){
    b.onclick=function(){
      if(b.classList.contains('son'))return;   // already this sort
      dashSort=b.getAttribute('data-sort');
      lsSet('sr_dsort',dashSort);
      clearSelection();   // a stale pick from the last grouping is more confusing than useful
      Array.prototype.forEach.call(document.querySelectorAll('.dsort button[data-sort]'),function(x){
        x.classList.toggle('son',x===b);
      });
      // deal out of the button cluster, not the individual button — the whole
      // control is the dealer's hands
      dealFrom(document.getElementById('dealer'),renderDash);
    };
    if(b.getAttribute('data-sort')===dashSort) b.classList.add('son');
    else b.classList.remove('son');
  });

  applyZoom();  // role persists across reloads, so restore its zoom on boot
  document.getElementById('btnAll').addEventListener('click',function(){

  var IS_DEMO=false;   // module scope — patchJob must never write demo cards to the server
  function ingest(cards,demo){
    IS_DEMO=!!demo;
    CARDS=cards.map(function(c){
      var o={};
      for(var k in c)if(Object.prototype.hasOwnProperty.call(c,k))o[k]=c[k];
      o._created=cardCreated(c.id);
      if(moves[o.id]){o.stage=moves[o.id];o.list=(STAGES[o.stage-1]||{}).name||o.list;}
      return o;
    });

  // ---- api/jobs.js -> CARDS shape --------------------------------------
  // /api/trello already returns cards pre-enriched with stage/list/days/active/
  // shipped. /api/jobs returns the locked schema straight — dueDate, numeric
  // stage — so that enrichment happens here once, at the boundary, rather than
  // teaching every render function two shapes.
  function daysUntil(iso){
    if(!iso) return null;
    var due=new Date(iso); if(isNaN(due)) return null;
    var ms=due.setHours(23,59,59,999)-Date.now();
    return Math.floor(ms/86400000);
  }
  function jobToCard(j){
    var stage=j.stage||1, shipped=(stage>=6);
    // Adopt the server's clock record so a second device sees hours logged on
    // the first. Skipped while this card has unsynced local work — that record
    // is newer than anything the server holds, and overwriting it would lose
    // the very hours retryUnsynced() is still trying to push.
    if(j.clock && !unsynced[j.id]){
      clocks[j.id]={
        startedAt:j.clock.startedAt||null,
        accumulated:j.clock.accumulated||0,
        sessions:j.clock.sessions||[],
        opTotals:j.clock.opTotals||{}
      };
      saveClocks();
    }
    return {
      id:j.id, part:j.part, name:(j.part||'')+' \u2014 PO '+(j.po||''),
      customer:j.customer, po:j.po, rev:j.rev, qty:j.qty,
      stage:Math.min(stage,6), list:(STAGES[Math.min(stage,6)-1]||{}).name,
      // price / dueDate / paidAt must be carried here or the card never sees them —
      // this mapping is the only path from the job record onto the card object.
      price:j.price, dueDate:j.dueDate, paidAt:j.paidAt,
      days:daysUntil(j.dueDate), active:(!shipped&&!j.paidAt), shipped:shipped,
      invoice:j.invoice, time:j.time, op1:j.op1, op2:j.op2, rate:j.rate,
      photo:j.photo, url:null, quoted:j.quoted, dadJob:!!j.dadJob
    };
  }

  function load(){
    return fetch('/api/jobs',{credentials:'same-origin'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(jobs){
        if(!Array.isArray(jobs)||!jobs.length)throw new Error('no jobs yet');
        ingest(jobs.map(jobToCard),false);
      })
      .catch(function(){
        return fetch('/api/trello',{credentials:'same-origin'})
          .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
          .then(function(d){
            if(d.error)throw new Error(d.error);
            if(!d.cards||!d.cards.length)throw new Error('no cards');
            ingest(d.cards,false);
          });
      })
      .catch(function(){if(!CARDS.length)ingest(demoCards(),true);});
  }

  setHint();
  load();
  setInterval(function(){ load(); retryUnsynced(); },120000);
})();
</script>
